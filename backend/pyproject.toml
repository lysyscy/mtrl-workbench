[project]
name = "mtrl-workbench-backend"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "httptools",
    "pydantic",
    "pydantic-settings",
    "python-multipart",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "httpx",
    "gmssl",
    "openpyxl",
    "pandas",
    "xlsxwriter",
    "xlrd",
    "playwright",
    "loguru",
    "pywin32",
    "pypdf>=7.2.0,<8",
]

[dependency-groups]
dev = [
    "pytest",
    "pip-audit",
    "requests",
    "ruff",
    "starlette",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv]
package = false

[tool.ruff]
target-version = "py315"
cache-dir = ".venv/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "B", "S110", "S112"]
ignore = ["E501"]
