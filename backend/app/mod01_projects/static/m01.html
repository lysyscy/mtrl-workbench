<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>项目档案</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx);
         font:14px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
  .wrap { max-width:1220px; margin:0 auto; padding:18px 20px 40px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  nav a { color:var(--pri); text-decoration:none; margin-right:10px; font-size:13px; }
  .card { background:var(--sf); border:1px solid var(--bd); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .spacer { flex:1; }
  button { border:1px solid var(--bd); background:var(--sf); color:var(--tx); padding:6px 12px;
           border-radius:6px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--pri); color:var(--pri); }
  button.primary { background:var(--pri); border-color:var(--pri); color:var(--sf); }
  button.primary:hover { background:var(--pri-d); color:var(--sf); }
  button.ghost { background:transparent; }
  button.mini { padding:3px 8px; font-size:12px; }
  input, select { border:1px solid var(--bd); border-radius:6px; padding:6px 10px; font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--bd); font-size:13px; vertical-align:middle; }
  th { color:var(--mut); font-weight:500; background:var(--sf2); }
  tbody tr:hover { background:var(--row-hover); }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .tag.normal { background:var(--pri-l); color:var(--pri); }
  .tag.shell { background:var(--wn-l); color:var(--wn); }
  .tag.small { background:var(--ok-l); color:var(--ok); }
  .tag.archived { background:var(--sf3); color:var(--mut); }
  .tag.ph { background:var(--dg-l); color:var(--dg); }
  .hint { color:var(--mut); font-size:12px; }
  .msg { margin-top:8px; font-size:13px; }
  .msg.err { color:var(--dg); } .msg.ok { color:var(--ok); } .msg.warn { color:var(--wn); }
  .empty { color:var(--mut); text-align:center; padding:26px 0; }
  .modal-mask { position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:50; }
  .modal-mask.show { display:flex; }
  .modal { background:var(--sf); border-radius:10px; width:520px; max-width:94vw; max-height:88vh; overflow:auto; padding:18px 20px; }
  .modal h3 { margin:0 0 8px; font-size:16px; }
  .modal .foot { display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  .f { margin:8px 0; } .f label { display:block; color:var(--mut); font-size:12px; margin-bottom:3px; }
  .f input, .f select { width:100%; }
  code { background:var(--sf3); padding:1px 5px; border-radius:4px; font-size:12px; }
  .ellipsis { max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>项目档案</h1>
    <nav><a href="/m01">项目档案</a><a href="/m02">抓取任务</a><a href="/m03">付款通知书打印</a></nav>
    <span class="spacer"></span>
    <button id="btnCreate" class="primary">建档…</button>
    <button id="btnOwnership" class="ghost">归属判定…</button>
  </header>

  <div class="card">
    <div class="row">
      <span>状态</span>
      <select id="status"><option value="active">在建</option><option value="archived">归档</option><option value="all">全部</option></select>
      <input id="keyword" placeholder="全名 / 仓库名 / 展示名" />
      <button id="btnQuery" class="primary">查询</button>
      <span class="hint">默认只筛「在建」；归档项恒排最后。</span>
    </div>
    <div id="listMsg" class="msg"></div>
  </div>

  <div class="card">
    <table>
      <thead><tr>
        <th style="width:60px;">序</th><th>展示名</th><th>仓库名（键）</th><th>项目全名</th>
        <th style="width:90px;">类型</th><th style="width:80px;">状态</th><th style="width:200px;">操作</th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal-mask" id="modalCreate"><div class="modal">
  <h3>建档</h3>
  <div class="f"><label>项目类型</label>
    <select id="cType"><option value="normal">普通项目</option><option value="shell">小微壳</option><option value="small">具体小微</option></select></div>
  <div class="f"><label>项目全名（必填）</label><input id="cFull" /></div>
  <div class="f"><label>仓库名（壳留空；普通项目/小微留空则自动取占位名 <code>未建仓-序号</code>）</label><input id="cWh" /></div>
  <div class="f"><label>展示名（留空取仓库名）</label><input id="cDisp" /></div>
  <div class="f"><label>信息化编号 phid</label><input id="cPhid" /></div>
  <div class="f"><label>所属壳 id（仅具体小微）</label><input id="cParent" /></div>
  <div class="f"><label>小微识别关键词（逗号分隔）</label><input id="cKw" placeholder="大唐雷州,焦作百利" /></div>
  <div id="createMsg" class="msg"></div>
  <div class="foot"><button class="ghost" onclick="closeModal('modalCreate')">取消</button><button class="primary" id="btnCreateOk">建档</button></div>
</div></div>

<div class="modal-mask" id="modalOwn"><div class="modal">
  <h3>归属判定</h3>
  <div class="hint">付款通知书只写「项目全名」；系统先判它是不是「壳」，是壳再用单据名匹配关键词。</div>
  <div class="f"><label>付款项目全名</label><input id="oFull" /></div>
  <div class="f"><label>单据名称（匹配关键词用）</label><input id="oDoc" /></div>
  <div class="foot"><button class="ghost" onclick="closeModal('modalOwn')">关闭</button><button class="primary" id="btnOwnOk">判定</button></div>
  <div id="ownMsg" class="msg"></div>
  <div id="ownDetail"></div>
</div></div>

<script>
const $ = (id) => document.getElementById(id);
const MODAL = (id, show) => $(id).classList.toggle("show", show);
const closeModal = (id) => MODAL(id, false);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opts||{}));
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.message || data.detail || ("HTTP "+r.status));
  return data;
}
const TYPE_TAG = {normal:'<span class="tag normal">普通项目</span>', shell:'<span class="tag shell">小微壳</span>', small:'<span class="tag small">具体小微</span>'};
let ROWS = [];

function render(){
  const tb = $("tbody");
  if(!ROWS.length){ tb.innerHTML = '<tr><td colspan="7" class="empty">暂无档案行 —— 可先「建档…」。</td></tr>'; return; }
  tb.innerHTML = ROWS.map((p,i)=>`
    <tr>
      <td>${p.ord}</td>
      <td>${esc(p.disp || p.warehouse_name || "—")}</td>
      <td>${p.warehouse_name ? esc(p.warehouse_name) : '<span class="hint">（壳无仓库）</span>'}
          ${p.is_placeholder ? ' <span class="tag ph">占位</span>' : ''}</td>
      <td class="ellipsis" title="${esc(p.name_full)}">${esc(p.name_full)}</td>
      <td>${TYPE_TAG[p.project_type]||esc(p.project_type)}</td>
      <td>${p.status==="archived" ? '<span class="tag archived">已归档</span>' : '<span class="tag small">在建</span>'}</td>
      <td>
        <button class="mini" data-act="up" data-id="${p.id}">↑</button>
        <button class="mini" data-act="down" data-id="${p.id}">↓</button>
        <button class="mini" data-act="toggle" data-id="${p.id}">${p.status==="archived"?"取消归档":"归档"}</button>
        <button class="mini" data-act="edit" data-id="${p.id}">改…</button>
      </td>
    </tr>`).join("");
  tb.querySelectorAll("button[data-act]").forEach(b=>b.addEventListener("click",()=>act(b.dataset.act, Number(b.dataset.id))));
}

async function load(){
  try{
    const st = $("status").value, kw = $("keyword").value.trim();
    ROWS = await api(`/api/m01/projects?status=${encodeURIComponent(st)}&keyword=${encodeURIComponent(kw)}`);
    $("listMsg").textContent = `共 ${ROWS.length} 行（顺序 = 自定义排序：归档后置 > 序号 > 原序）`;
    $("listMsg").className = "msg";
    render();
  }catch(e){ $("tbody").innerHTML = `<tr><td colspan="7" class="empty">加载失败：${esc(e.message)}</td></tr>`; }
}

async function act(kind, id){
  try{
    if(kind==="up"||kind==="down"){
      await api(`/api/m01/projects/${id}/ord`, {method:"PUT", body:JSON.stringify({direction:kind})});
    } else if(kind==="toggle"){
      const p = ROWS.find(r=>r.id===id);
      await api(`/api/m01/projects/${id}/status`, {method:"PUT",
        body:JSON.stringify({status: p.status==="archived"?"active":"archived", changed_by:"界面"})});
    } else if(kind==="edit"){
      const p = ROWS.find(r=>r.id===id);
      const full = window.prompt("项目全名（改了会留痕；仓库名不可改）：", p.name_full); if(full===null) return;
      const disp = window.prompt("展示名：", p.disp || ""); if(disp===null) return;
      const kw = window.prompt("小微关键词（逗号分隔）：", (p.match_keywords||[]).join(",")); if(kw===null) return;
      await api(`/api/m01/projects/${id}`, {method:"PUT", body:JSON.stringify({
        name_full: full, disp: disp, match_keywords: kw.split(",").map(s=>s.trim()).filter(Boolean), changed_by:"界面"})});
    }
    await load();
  }catch(e){ $("listMsg").textContent = "操作失败：" + e.message; $("listMsg").className = "msg err"; }
}

$("btnQuery").addEventListener("click", load);
$("btnCreate").addEventListener("click", ()=>{ $("createMsg").textContent=""; MODAL("modalCreate", true); });
$("btnCreateOk").addEventListener("click", async ()=>{
  try{
    const body = {
      project_type: $("cType").value,
      name_full: $("cFull").value.trim(),
      warehouse_name: $("cWh").value.trim() || null,
      disp: $("cDisp").value.trim(),
      phid: $("cPhid").value.trim(),
      parent_shell_id: $("cParent").value.trim() ? Number($("cParent").value.trim()) : null,
      match_keywords: $("cKw").value.split(",").map(s=>s.trim()).filter(Boolean),
    };
    if(!body.name_full) throw new Error("项目全名必填");
    await api("/api/m01/projects", {method:"POST", body:JSON.stringify(body)});
    MODAL("modalCreate", false); await load();
  }catch(e){ $("createMsg").textContent = "建档失败：" + e.message; $("createMsg").className="msg err"; }
});
$("btnOwnership").addEventListener("click", ()=>{ $("ownMsg").textContent=""; $("ownDetail").innerHTML=""; MODAL("modalOwn", true); });
$("btnOwnOk").addEventListener("click", async ()=>{
  try{
    const d = await api("/api/m01/ownership", {method:"POST", body:JSON.stringify({
      name_full: $("oFull").value.trim(), doc_name: $("oDoc").value.trim()})});
    const KIND = {normal:"普通项目：归属自动确定", small:"壳：已自动归集到具体小微",
                  needs_choice:"壳：命中多个小微 ⇒ 需你指定", needs_keyword:"壳：未命中 ⇒ 需你指定（选已有小微并补词 / 新建小微）",
                  not_archived:"未建档 ⇒ 需走建档（链路 A）"};
    $("ownMsg").textContent = (KIND[d.kind]||d.kind) + (d.reason ? " —— " + d.reason : "");
    $("ownMsg").className = d.settled ? "msg ok" : "msg warn";
    if(d.candidates && d.candidates.length){
      $("ownDetail").innerHTML = '<div class="hint" style="margin-top:8px;">该壳下的具体小微：</div><ul>' +
        d.candidates.map(c=>`<li>${esc(c.display)} <code>${esc(c.key)}</code>${c.archived?' <span class="tag archived">已归档</span>':''}</li>`).join("") + "</ul>";
    }
  }catch(e){ $("ownMsg").textContent = "判定失败：" + e.message; $("ownMsg").className="msg err"; }
});

load();
</script>
</body>
</html>
