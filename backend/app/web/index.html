<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>材料报表自动化工作台</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--fs);font-size:13px;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;overflow:visible}

/* ---------- 侧栏 ---------- */
.sb{width:238px;flex:0 0 238px;background:var(--sb);color:var(--sb-tx);display:flex;flex-direction:column;overflow-y:auto}
.sb::-webkit-scrollbar{width:8px}
.sb::-webkit-scrollbar-track{background:none}
.sb::-webkit-scrollbar-thumb{background:var(--sb-bd);border-radius:4px}
.sb-brand{padding:14px 16px 12px;border-bottom:1px solid var(--sb-bd)}
/* ⚠️ 侧栏的**三档文字**各用各的角色（2026-09-21 修）：品牌/悬停 = `--sb-hd`、普通项 = `--sb-tx`、
   次要（编号/分组/页脚）= `--sb-mut`。⛔ **别再借 `--on`**（它是"主色**之上**的前景"）——
   原来 `.sb-brand b` 与 `.sb-i:hover` 用 `--on`，在深色套里 `--on` 是**黑** ⇒ 黑字压深面板。 */
.sb-brand b{display:block;color:var(--sb-hd);font-size:13.5px;font-weight:500;letter-spacing:.2px}
.sb-brand span{display:block;color:var(--sb-mut);font-size:11px;margin-top:3px}
.sb-g{padding:10px 0 2px}
.sb-g>h5{padding:0 16px 6px;font-size:11px;color:var(--sb-mut);font-weight:400;letter-spacing:.6px}
.sb-i{display:flex;align-items:center;gap:8px;padding:6.5px 16px;cursor:pointer;font-size:12.5px;border-left:2.5px solid transparent;line-height:1.35}
.sb-i:hover{background:var(--sb-hover);color:var(--sb-hd)}
/* 选中项：底 = **主色本尊**（`--sb-on`），字 = `--on`（"主色之上的前景"）⇒ 语义正好、深浅两族都读得清；
   左侧亮边用 `--on`（若仍用 `--pri` 就与底同色、等于看不见）。 */
.sb-i.on{background:var(--sb-on);color:var(--on);border-left-color:var(--on);font-weight:600}
.sb-i .c{font-family:var(--fm);font-size:10.5px;color:var(--sb-mut);flex:0 0 46px}
.sb-i.on .c{color:var(--sb-on-hl)}
.sb-i.dis{color:var(--sb-dis)}   /* 「暂缓」= 语义标注，不是禁用：该项仍可点进 MOD-10 查看说明页 ⇒ 光标保持 pointer（不用 not-allowed，免得"看着点不动、其实能点"） */
.sb-i.dis:hover{background:none;color:var(--sb-dis)}
.sb-i .m{margin-left:auto;font-size:10px;color:var(--sb-mut)}
.sb-foot{margin-top:auto;padding:10px 16px;border-top:1px solid var(--sb-bd);font-size:10.5px;color:var(--sb-mut);line-height:1.6}

/* ---------- 主体 ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0}
.tb{height:54px;flex:0 0 54px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:0 18px}
.tb h1{font-size:14.5px;font-weight:500}
.tb h1 em{font-style:normal;font-family:var(--fm);font-size:11px;color:var(--mut);margin-left:8px;font-weight:400}
.tb .sp{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tx2)}
.view{flex:1;overflow-y:auto;padding:14px 18px 40px}

/* ---------- 通用件 ---------- */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card>h4{padding:9px 13px;border-bottom:1px solid var(--bd2);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px;background:var(--sf2)}
.card>h4 .sp{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
.card .bd{padding:12px 13px}
.card .bd.np{padding:0}
.tip{background:var(--pri-l);border:1px solid var(--pri-bd);border-left:3px solid var(--pri);border-radius:6px;padding:8px 11px;font-size:12px;color:var(--pri-d);line-height:1.65;margin-bottom:10px}
.tip.wn{background:var(--wn-l);border-color:var(--wn-bd);border-left-color:var(--wn);color:var(--wn-d)}
.tip.dg{background:var(--dg-l);border-color:var(--dg-bd);border-left-color:var(--dg);color:var(--dg-d)}
.tip.ok{background:var(--ok-l);border-color:var(--ok-bd);border-left-color:var(--ok);color:var(--ok-d)}
.tip b{font-weight:500}
.tip code{font-family:var(--fm);font-size:11px;background:var(--code-bg);padding:1px 4px;border-radius:3px}
/* 可折叠的口径说明：默认收起，把纵向空间让给数据 */
details.tip>summary{cursor:pointer;font-weight:500;outline:none;list-style:none}
details.tip>summary::-webkit-details-marker{display:none}
details.tip>summary::before{content:'▸ ';color:var(--pri);font-size:11px}
details.tip[open]>summary::before{content:'▾ '}

/* 按钮 */
.btn{font-family:var(--fs);font-size:12px;padding:4.5px 11px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:6px;cursor:pointer;line-height:1.4;white-space:nowrap}
.btn:hover{border-color:var(--bd3);background:var(--sf2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on)}
.btn.pri:hover{background:var(--pri-d)}
.btn.dg{color:var(--dg-d);border-color:var(--dg-bd)}
.btn.dg:hover{background:var(--dg-l)}
.btn.sm{padding:2.5px 7px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gost{border-style:dashed;color:var(--mut)}

/* 表格 */
/* 表格滚动容器：必须有高度上限，sticky 表头才「贴得住」。
   否则容器不滚动、整页滚动，表头会跟着一起滚走 —— 表现为「往下拖表头没了」。 */
.tw{overflow:auto;max-height:calc(100vh - 330px);min-height:260px}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{position:sticky;top:0;z-index:2;background:var(--sf2);border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;font-weight:500;color:var(--tx2);white-space:nowrap;font-size:11.5px}
/* 「合计」行**统一置底**（2026-09-13 用户口径）：表头贴顶、合计行贴底 ⇒ 数据量大时不用滚到底才看得到（`sumRowOf` 产出的行带 `sumrow` 类）。
   ⭐⭐ **`position:sticky` 必须落在 `<tr>` 上 —— 写在 `>td` 上永不生效**（2026-09-16 修正）：
       `sticky` 作用在 `<td>` 时，它的**包含块是表格行**（行高 = 单元格高）⇒ **没有可位移的空间**。
       实测（真实浏览器 · 容器高 200px · 表内 30 行 · `scrollTop=0`，判据 = 「合计行底 − 容器底」）：
       `td` 写法 = **+792.5px**（合计行在屏幕外，**必须滚到底才看得见**）vs `tr` 写法 = **−1px**（吸附生效）。
       ⚠️ 它**不报错、不崩、只是不生效** ⇒ 只能靠实测抓出来；`_smoke` 的 N27 断言已按此收紧。
   ⚠️ `border-collapse:collapse` 下吸附行的**边框会丢** ⇒ 用 `box-shadow` 补上边线（故 `>td` 那条仍要保留）；
   ⚠️ 吸附行**必须有不透明底色**（否则数据行会透出来）⇒ 底色统一取 `var(--sf2)`（与既有合计行同色）。
   ⚠️ **分组表**（`MOD-07` 焊材/气体提取）不置底 —— 分组合计要紧贴本组，两行同 sticky 会重叠（由 `sumRowOf` 的 `sticky:false` 控制）。
       ⚠️ **不吸附 ≠ 不置底**：`sticky:false` 时合计行仍带 `data-pin`、仍钉在表尾、仍不参与排序。 */
.dt tbody tr.sumrow{position:sticky;bottom:0;z-index:2}
.dt tbody tr.sumrow>td{background:var(--sf2);box-shadow:inset 0 1px 0 var(--bd)}
.dt td{border-bottom:1px solid var(--bd2);padding:5px 8px;vertical-align:middle}
/* 分段竖线（`.vsep`）：`MOD-06` 表①② 按「总求和（本表）」的四段做**视觉分隔**（2026-09-13 用户口径）。
   ⚠️ 只加 `border-left`、颜色走 token（不写死色值 —— 内联样式无硬编码色值的断言对 class 同样成立）。 */
.dt th.vsep,.dt td.vsep{border-left:2px solid var(--bd)}
.dt tbody tr:hover{background:var(--row-hover)}
.dt tbody tr.hl{background:var(--wn-l)}
.dt tbody tr.hl:hover{background:var(--hl-hover)}
.dt tbody tr.ex{color:var(--mut);background:var(--ex-bg)}
.dt tbody tr.ex td{text-decoration:line-through;text-decoration-color:var(--del-line)}
/* ⭐ i8 已撤单行（§4.2.7）：与「剔除」同行样式（.ex），但**左侧加一道警示竖条**，
   并把删除线关掉 —— 撤单不等于"作废的错数据"，它是"源单被删、保留可查"，故只加标识不划掉。
   ⚠️ 有牵涉（ntVoidJoint）时该行**仍算有效**（留在统计里），故本类只表达"来源"，不表达"退出统计"。 */
.dt tbody tr.ntvoid{box-shadow:inset 3px 0 0 var(--wn);background:var(--void-bg)}
.dt tbody tr.ntvoid:hover{background:var(--hl-hover)}
.dt tbody tr.ntvoid td{text-decoration:none}
.dt tbody tr.ntvoid .fl{background:var(--void-bg)}
.dt tbody tr.pick{background:var(--pri-l)}
.dt tbody tr.pick:hover{background:var(--pri-bd)}
.dt tbody tr.sel{background:var(--sel)}
.dt .num{text-align:right;font-family:var(--fm);font-size:12px;white-space:nowrap}
.dt .ctr{text-align:center}
.dt .now{white-space:nowrap}
.dt.cond td,.dt.cond th{padding:4.5px 7px;font-size:12px}
.fl{position:sticky;left:0;background:var(--sf);z-index:1}
.dt tbody tr:hover .fl{background:var(--row-hover)}
.dt tbody tr.hl .fl{background:var(--wn-l)}
.dt tbody tr.ex .fl{background:var(--ex-bg)}

/* 标签 */
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;line-height:1.55;white-space:nowrap;border:1px solid transparent}
.t-pri{background:var(--pri-l);color:var(--pri-d);border-color:var(--pri-bd)}
.t-ok{background:var(--ok-l);color:var(--ok-d);border-color:var(--ok-bd)}
.t-wn{background:var(--wn-l);color:var(--wn-d);border-color:var(--wn-bd)}
.t-dg{background:var(--dg-l);color:var(--dg-d);border-color:var(--dg-bd)}
.t-in{background:var(--in-l);color:var(--in-d);border-color:var(--in-bd)}
.t-vi{background:var(--vi-l);color:var(--vi-d);border-color:var(--vi-bd)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.d-ok{background:var(--ok)}.d-wn{background:var(--wn)}.d-dg{background:var(--dg)}.d-in{background:var(--in)}.d-pri{background:var(--pri)}.d-vi{background:var(--vi)}

/* 表单/行内编辑 */
select.inp,input.inp,textarea.inp{font-family:var(--fs);font-size:12px;padding:3px 6px;border:1px solid var(--bd);border-radius:5px;background:var(--sf);color:var(--tx);width:100%}
input.inp.num{text-align:right;font-family:var(--fm)}
input.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-bd)}
input.inp[readonly]{background:var(--sf2);color:var(--tx2);border-style:dashed;cursor:not-allowed}
.ed{background:var(--edit-l)!important;border-color:var(--edit-bd)!important}
.plain{border:1px solid transparent;background:transparent}
.plain:hover{border-color:var(--bd);background:var(--sf)}
/* ---------- 活动大表手填项（MOD-07 · OPEN-05「上次值带入」）----------
   带入态 = 输入框黄底（复用 .ed）+ 左上角「↺07月」来源标记；本月已录入则白底无标记。 */
.dt td.bigc{position:relative}
.dt td.bigc .ctag{position:absolute;left:5px;top:2px;font-size:9.5px;font-style:normal;color:var(--wn-d);pointer-events:none}
.dt td.bigc .inp{padding-left:28px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 13px;border-bottom:1px solid var(--bd2);background:var(--sf2)}
.fbar .fi{display:flex;flex-direction:column;gap:3px}
.fbar .fi>label{font-size:10.5px;color:var(--mut)}
.fbar .fi input,.fbar .fi select{min-width:112px;width:auto}
.chk{width:13px;height:13px;cursor:pointer;vertical-align:-2px}
/* ---------- 表头点击排序（数据列表，见 applySorts）----------
   三态：升序 ▲ → 降序 ▼ → 原序 ↕（可反复切换，同一时刻只有一列生效）。
   当前排序列常显且用主色；其余可排序列淡灰，鼠标移上去变深。 */
.dt th.srt{cursor:pointer;-webkit-user-select:none;user-select:none}
.dt th.srt:hover{background:var(--th-hover);color:var(--tx)}
.dt th.srt .sind{font-size:10.5px;color:var(--mut2);margin-left:3px}
.dt th.srt:hover .sind{color:var(--mut)}
.dt th.srt.on,.dt th.srt.on .sind{color:var(--pri)}
/* 无障碍焦点框的**唯一出口**：凡「非按钮但可点」的元素，一律 加 `data-act` + `role="button"` + `tabindex="0"`，
   由这一条规则统一给焦点框、由文件末的 keydown 委托统一给「回车 / 空格」—— 两处都只写一遍。 */
[data-act][role="button"]:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px}
.kpi .k{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:4px}
.kpi .v{font-size:19px;font-weight:500;font-family:var(--fm);margin-top:3px;letter-spacing:-.3px}
.kpi .s{font-size:11px;color:var(--mut);margin-top:2px}
.kpi.dg .v{color:var(--dg-d)}
.kpi.wn .v{color:var(--wn-d)}
.kpi.ok .v{color:var(--ok-d)}
.kpi.pri .v{color:var(--pri)}

/* 选中汇总条（付款通知书页：选中上下文指标 + 主操作合并为一条） */
.selbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;background:var(--sf);
  border:1px solid var(--bd);border-radius:var(--r);padding:0 8px 0 15px;min-height:50px;margin-bottom:12px;
  box-shadow:0 1px 2px var(--shadow)}
.selbar .m{display:flex;flex-direction:column;gap:2px}
.selbar .m .k{font-size:11px;color:var(--mut);line-height:1.15;white-space:nowrap}
.selbar .m .v{font-family:var(--fm);font-size:14.5px;font-weight:500;line-height:1.2;letter-spacing:-.2px;white-space:nowrap}
.selbar .dv{width:1px;height:26px;background:var(--bd2);margin:0 16px}
.selbar .act{margin-left:auto;display:flex;align-items:center;gap:10px}

/* 迷你条 */
.bars{display:flex;flex-direction:column;gap:6px}
.bars .br{display:flex;align-items:center;gap:9px;font-size:12px}
/* 迷你条标签 = **项目名**（看板仓库条 / 按项目看欠款 / 付款统计按项目）⇒ 与表格列同一条规则：
   **一律不截断**（超宽换行）。⚠️ 该截断只发生在 CSS 里 —— DOM 的文本始终是全文，
   行为式断言**测不出来**，所以 `_smoke` 另有一条"实现标记"断言直接扫整份文件。 */
.bars .br .nm{flex:0 0 176px;white-space:normal;overflow-wrap:anywhere;line-height:1.35;color:var(--tx2)}
.bars .br .tk{flex:1;height:13px;background:var(--sf2);border-radius:3px;overflow:hidden}
.bars .br .tk i{display:block;height:100%;background:var(--pri);border-radius:3px}
.bars .br .tk i.g{background:var(--ok)}.bars .br .tk i.r{background:var(--dg)}.bars .br .tk i.o{background:var(--wn)}.bars .br .tk i.v{background:var(--vi)}
.bars .br .vl{flex:0 0 108px;text-align:right;font-family:var(--fm);font-size:12px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:var(--mask);display:flex;align-items:center;justify-content:center;z-index:90;padding:24px}
.modal{background:var(--sf);border-radius:10px;box-shadow:0 12px 32px var(--shadow-md);width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:940px}
.modal h3{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;font-weight:500;display:flex;align-items:center}
.modal h3 .x{margin-left:auto;cursor:pointer;color:var(--mut);font-size:17px;line-height:1;padding:0 3px}
.modal h3 .x:hover{color:var(--dg-d)}
.modal .mb{padding:14px 16px;overflow-y:auto}
.modal .mf{padding:10px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;background:var(--sf2)}
.fld{margin-bottom:11px}
.fld>label{display:block;font-size:11.5px;color:var(--tx2);margin-bottom:4px}
.fld>label b{color:var(--dg-d);font-weight:400}
.fld .hint{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.6}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:112px 1fr;gap:6px 10px;font-size:12px}
.kv dt{color:var(--mut)}
.kv dd{font-family:var(--fm)}

/* 提示条 */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--on);padding:9px 18px;border-radius:8px;font-size:12.5px;z-index:120;box-shadow:0 8px 22px var(--shadow-toast);max-width:70vw;line-height:1.5}
.toast b{color:var(--pri-hl);font-weight:500}

/* 其他 */
.mut{color:var(--mut)}.sm{font-size:11.5px}.fc{font-family:var(--fm)}
/* 「外观主题」的**配色标本卡**（`V.set`，2026-09-21）——
   ⚠️ 卡面的**底色/文字色是逐卡内联的**（各套主题自己的取值，由后端给）⇒ 这里只管**骨架**，
   ⛔ 一个色值字面量都不写（写了就是第二份真源，`test_theme.py` 会红）。 */
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:9px}
.thcard{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--bd);
  border-radius:var(--r);cursor:pointer;font:inherit;text-align:left;box-shadow:var(--shadow);
  transition:transform .12s,box-shadow .12s,border-color .12s}
.thcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.thcard.on{box-shadow:var(--shadow-md);cursor:default}
.thdot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;box-shadow:inset 0 0 0 1px var(--bd3)}
.thmeta{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.thmeta b{font-size:12.5px;font-weight:600}
.thhex{font-style:normal;font-size:11px;opacity:.72;font-family:var(--fm)}
.thscene{font-style:normal;font-size:10.5px;opacity:.78;max-width:146px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thck{margin-left:auto;font-size:14px;font-weight:700}
.hr{height:1px;background:var(--bd2);margin:11px 0}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:2px 9px;font-size:11.5px;color:var(--tx2)}
.steps{display:flex;gap:0;margin:4px 0 12px}
.steps .st{flex:1;padding:7px 10px;background:var(--sf2);border:1px solid var(--bd);border-right:0;font-size:11.5px;color:var(--tx2);text-align:center}
.steps .st:first-child{border-radius:6px 0 0 6px}
.steps .st:last-child{border-radius:0 6px 6px 0;border-right:1px solid var(--bd)}
.steps .st.on{background:var(--pri-l);color:var(--pri-d);font-weight:500;border-color:var(--pri-bd)}

     · `badMoneyMsg(标签,{unit,positive})` 统一措辞「〈标签〉不合法：请填…（…），已保留原值」
     · `overCap(v,上限)`           超上限（**容差只此一处**）
   ⚠️ 提示**后面的补充说明**（如「按发票走，只能往下调」）仍写在各调用点 —— 那是业务话术，不是通用件。
   ⚠️ `CAP_TOL` 是**浮点噪声容差**（不是业务容差；业务口径是 §9.1「判定容差 0」）。
      它只用于"是否超上限"的判断，避免 1e-13 级尾噪把等于上限的值判成超限。 */
const CAP_TOL=0.005;
const overCap=(v,cap)=>Number(v)>Number(cap)+CAP_TOL;
const numOf=(raw,o)=>{ const t=String(raw==null?'':raw).trim();
  return (t===''&&o&&o.empty0)?0:N2(parseFloat(t)); };
/* ⚠️ `signed` = **允许正负号**（差异金额专用：§5.8.3「带符号 · + 上调 / − 下调」）。
   默认仍拒负数 ⇒ 既有调用点行为一字不变。 */
const badMoney=(v,o)=>isNaN(v)||((o&&o.positive)?v<=0:((o&&o.signed)?false:v<0));
const badMoneyMsg=(label,o)=>`<b>${label}不合法</b>：请填${o&&o.positive?'正数':((o&&o.signed)?'数字（可带正负号，+ 上调 / − 下调）':'非负数')}（${(o&&o.unit)||'2 位小数'}），已保留原值`;

/* ===== 留痕的统一形状与唯一写入出口（2026-09-13 定案）=====
   《说明书》§9.3 规定留痕**范围**（只给统计结算 / 统计付款金额 · 调整单 · 项目全名与状态），
   并要求记「改前值 / 改后值 / 改动人 / 时间」。
   ⚠️ 原型原先有**三套数组排法**（付款通知书 `[字段,改前,改后,人,时间,说明]` ·
      项目档案 `[时间,名,字段,改前,改后,人]` · 调整单 `[字段,改前,改后]`）——
      读的人得先数下标，**排法记错一次就是静默错值**（本项目已把"按 id 不按名"写成铁律，同理）。
   ⇒ 统一成**对象**：`{ obj, field, before, after, by, at, note }`（`obj` / `note` 可空）。
   ⇒ **写入只走 `pushTrail`、读取只走 `hasTrail` / `trailOf`**，不再有第二套排法。 */
const mkTrail=o=>({ obj:o.obj||'', field:o.field, before:o.before, after:o.after,
  by:o.by||CUR.name, at:o.at||now(), note:o.note||'' });
const pushTrail=(list,o)=>{ const r=mkTrail(o); list.push(r); return r; };
const hasTrail=(list,field)=>(list||[]).some(t=>t&&t.field===field);
const trailOf=(list,field)=>(list||[]).filter(t=>t&&t.field===field);

/* =====================================================================
   1.5 表头点击排序（全站数据列表统一处理）
   ── 为什么做成「HTML 字符串 → HTML 字符串」的纯函数：本原型是"全量重渲染 +
      字符串模板"，在整页 HTML 生成后统一重排行，可一处覆盖所有数据表；
      且纯函数能被自检直接断言行序（若改为操作真实 DOM，现有自检桩无法验证）。
   ── 三态循环：升序 → 降序 → 原序（可反复切换；同一时刻只有一列生效）。
   ── 只处理标了 data-sort 的表。不可排的列：表头为空 / 操作 / 处理 / 含复选框 / 标 data-nosort。
   ── 排序状态的键 = 表自己声明的 **`data-sort-key`**（稳定身份）；未声明时才回退「scope + 出现次序」。
       ⇒ **加一张可排表不会串位**；新表**必须**声明 data-sort-key。
   ── 合计行（含「合计 / 总计 / 小计」）与跨列提示行钉在最后，不参与排序。
   ── 排序只重排行，不改任何单元格内容。
   ===================================================================== */
let SORT={};                                            /* { 表键: {i:列索引, d:1|-1|0} } */
const NOSORT_COL={'':1,'操作':1,'处理':1};               /* 这些列头不参与排序 */
const _plain=s=>String(s).replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();
const _num=s=>{const t=String(s).replace(/[,¥%\s]/g,''); if(t==='')return null; const x=Number(t); return isFinite(x)?x:null;};
const _date=s=>/^\d{4}-\d{2}(-\d{2})?$/.test(String(s));
/* 单元格取值优先级：data-v 属性 → <input value>（可改金额列 / 大表手填列）→ 文本 */
function _cellRaw(td){
  if(td===undefined) return '';
  const dv=td.match(/\bdata-v="([^"]*)"/); if(dv) return dv[1];
  const iv=td.match(/<input\b[^>]*\bvalue="([^"]*)"/i); if(iv) return iv[1];
  return _plain(td.slice(td.indexOf('>')+1, td.lastIndexOf('</td>')));
}
/* 列类型自动判定：日期先判 —— 否则 2026-08-03 会被 parseFloat 吞成 2026 */
function _colType(vals){
  let n=0,d=0,t=0;
  vals.forEach(v=>{ if(v==='')return; t++; if(_date(v)) d++; else if(_num(v)!==null) n++; });
  if(!t) return 'text';
  if(d/t>=0.7) return 'date';
  if(n/t>=0.7) return 'num';
  return 'text';
}
function _cmp(a,b,t,dir){
  const ea=(a===''), eb=(b==='');
  if(ea&&eb) return 0;
  if(ea) return 1;                                      /* 空值恒排最后，不随升降序翻转 */
  if(eb) return -1;
  let r;
  if(t==='num'){const x=_num(a),y=_num(b); r=(x===null?0:x)-(y===null?0:y);}
  else if(t==='date') r=(a<b?-1:(a>b?1:0));
  else r=String(a).localeCompare(String(b),'zh-Hans-CN');
  return dir*r;
}
/* 主函数：scope 用于给表编稳定键（同一视图同一位置 = 同一张表） */
function applySorts(html,scope){
  let n=0;
  return String(html).replace(/<table\b[^>]*>[\s\S]*?<\/table>/gi,tbl=>{
    const open=tbl.match(/^<table\b[^>]*>/i); if(!open) return tbl;
    if(!/\sdata-sort[\s>]/.test(open[0])) return tbl;   /* ⚠️ 必须**精确匹配 `data-sort` 属性本身**：原来的 `\bdata-sort\b`
                                                           会把 `data-sort-key` 也算成"可排"（`-` 是词边界）⇒ 只声明 key 想表达
                                                           "可排但用稳定键"会被误判；而**刻意不可排**的表（如 `MOD-07` 焊材/气体提取的
                                                           分组表）只写 key 就会被注入排序入口、合计行还会被 pin 到表尾。 */
    const body=tbl.slice(open[0].length, tbl.lastIndexOf('</table>'));
    if(/<table\b/i.test(body)) return tbl;                        /* 嵌套表跳过，避免误伤 */
    const thead=body.match(/<thead\b[^>]*>[\s\S]*?<\/thead>/i);
    const tbody=body.match(/<tbody\b[^>]*>[\s\S]*?<\/tbody>/i);
    if(!thead||!tbody) return tbl;
    const idx=n++;
    /* 表的**身份**优先取它自己声明的 `data-sort-key`（稳定 · 与表在页面里的位置无关）；
       没声明才回退「scope + 出现次序」—— 回退键会随表的位置漂移（加一张表就把后面的键全冲掉），
       因此**新表一律声明 `data-sort-key`**，回退分支只为兼容保留。
       ⚠️ 别混用两个名字：`data-sort-key`（**表**声明 · 输入）≠ `data-tk`（th 上的运行时键 · 输出）。 */
    const decl=open[0].match(/\bdata-sort-key="([^"]*)"/i);
    const key=decl?decl[1]:(scope+'#'+idx);
    const ths=[...thead[0].matchAll(/<th\b([^>]*)>([\s\S]*?)<\/th>/gi)];
    if(ths.length<2) return tbl;
    const can=ths.map(th=>(/\bdata-nosort\b/.test(th[1])||/<input\b/i.test(th[2]))?false:!NOSORT_COL[_plain(th[2])]);
    const st=SORT[key]||(SORT[key]={i:-1,d:0});
    const tbOpen=tbody[0].match(/^<tbody\b[^>]*>/i)[0];
    const tbInner=tbody[0].slice(tbOpen.length, tbody[0].lastIndexOf('</tbody>'));
    const rows=tbInner.match(/<tr\b[^>]*>[\s\S]*?<\/tr>/gi)||[];
    const pin=[],data=[];
    rows.forEach(r=>{
      const tdc=(r.match(/<td\b/gi)||[]).length;
      /* ⭐ 2026-09-13 增行模式：草稿行（`tr.draftrow`）与「合计行 / 跨列行」走**同一条 pin 通道** ——
         钉表尾、不参与排序、不参与取值。
         ⚠️ 必须**锚在行首那个 `<tr>` 标签的 class 上**，不能靠"`<td>` 数 < 表头列数" ——
            `MOD-03` 的草稿行是**列对齐行**（`<td>` 数 = 列数），那条判据**保不住它**（实测推演）。 */
      const openTag=(r.match(/^<tr\b[^>]*>/i)||[''])[0];
      if(/\bdraftrow\b/.test(openTag)||/合计|总计|小计/.test(_plain(r))||tdc<ths.length) pin.push(r); else data.push(r);
    });
    let out=data;
    if(st.i>=0&&st.d!==0&&can[st.i]&&data.length>1){
      const vals=data.map(r=>_cellRaw((r.match(/<td\b[^>]*>[\s\S]*?<\/td>/gi)||[])[st.i]));
      const tp=_colType(vals);
      out=data.map((r,k)=>({r,v:vals[k]})).sort((a,b)=>_cmp(a.v,b.v,tp,st.d)).map(o=>o.r);
    }
    /* 表头：注入 class / 点击动作 / 排序指示器 */
    const newTh=ths.map((th,k)=>{
      if(!can[k]) return '<th'+th[1]+'>'+th[2]+'</th>';
      const on=(st.i===k&&st.d!==0);
      let a=th[1];
      a=/\bclass="/.test(a)?a.replace(/\bclass="([^"]*)"/,(m,c)=>'class="'+c+' srt'+(on?' on':'')+'"'):a+' class="srt'+(on?' on':'')+'"';
      a+=' data-act="headSort" data-tk="'+key+'" data-i="'+k+'" tabindex="0" role="button" title="点击排序：升序 → 降序 → 原序"';
      return '<th'+a+'>'+th[2]+'<span class="sind">'+(on?(st.d>0?'▲':'▼'):'↕')+'</span></th>';
    }).join('');
    const newHead=thead[0].match(/^<thead\b[^>]*>/i)[0]
      +(thead[0].match(/<tr\b[^>]*>/i)||['<tr>'])[0]+newTh+'</tr></thead>';
    return open[0]+newHead+tbOpen+out.concat(pin).join('\n')+'</tbody>'+tbl.slice(tbl.lastIndexOf('</tbody>')+8);
  });
}

  const tile=(k,n,cls,t,v,s,pg,tx)=>'<div class="kpi '+cls+'" data-todo="'+k+'" data-n="'+n+'"><div class="k">'+t

  const runTile=(k,n,cls,t,v,s,pg,tx)=>hErr

    runTile('fetchDue',fDone?0:1,fDone?'ok':'wn','本月抓取',fDone?'已抓':'未抓','本月（'+bjMonth()+'）'+(fDone?'已有成功抓取':'尚无成功抓取')+' · ','m02','去抓取任务'),
    runTile('fetchFail',fFail?1:0,fFail?'wn':'ok','最近一次抓取失败',fFail?'有':'无',(fFail?(esc(fFail.obj)+' · <span class="fc">'+esc(fFail.at)+'</span>'):'最近无失败')+' · ','m02','去抓取任务'),
    runTile('printFail',pFail?1:0,pFail?'wn':'ok','打印投递失败',pFail?'有':'无',(pFail?(esc(pFail.obj)+' · <span class="fc">'+esc(pFail.at)+'</span>'):'最近无失败')+' · ','m03','去付款通知书')
  ];
  return `

  <div class="kpis">
    <div class="kpi"><div class="k">欠款合计（三类）</div><div class="v">${M(d.合计)}</div><div class="s">辅材 ＋ 机械 ＋ 集采 · 容差 0</div></div>
    <div class="kpi pri"><div class="k">辅材欠款</div><div class="v">${M(d.辅材)}</div><div class="s">Σ统计结算 ${M(d.辅材S)} − Σ统计付款 ${M(d.辅材P)} ＋ 辅材期初 ${M(d.lg辅材)}</div></div>
    <div class="kpi wn"><div class="k">机械欠款</div><div class="v">${M(d.机械)}</div><div class="s">派生结算 ${M(d.machSettle)} − Σ统计付款 ${M(d.machPaid)} ＋ 机械期初 ${M(d.lg机械)}</div></div>
    <div class="kpi dg"><div class="k">集采欠款</div><div class="v">${M(d.集采)}</div><div class="s">合同级，仅计「纳入台账」合同</div></div>
  </div>
  <div class="card"><h4>待办<span class="sp"><span class="mut sm">共 ${tN} 项需处理 · 点链接直达</span></span></h4><div class="bd">
    <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin:0">${todoTiles.join('')}</div>
    <div class="tip" style="margin:10px 0 0"><b>怎么看这一页</b>：每项都是「有具体去处的事」—— 数字由数据源<b>实时算出</b>，点链接直达对应页面处理。⚠️ 业务事实「付款通知书一定早于仓库」被打破时，<b>占位行待扶正</b>会亮 —— 那是「陌生仓库」告警：说明有项目绕过了付款流程，供事后复盘。</div>
  </div></div>
  <div class="grid2">
    <div class="card"><h4>付款通知书台账状态<span class="sp"><span class="mut sm">共 ${NO.length} 条</span></span></h4><div class="bd">
      <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin:0">
        <div class="kpi" style="border:0;background:var(--sf2)"><div class="k">有效</div><div class="v" style="font-size:16px">${nIn}</div></div>
        <div class="kpi" style="border:0;background:var(--sf2)"><div class="k">已剔除</div><div class="v" style="font-size:16px">${nEx}</div></div>
        <div class="kpi" style="border:0;background:var(--sf2)"><div class="k">未审批</div><div class="v" style="font-size:16px;color:var(--dg)">${nUn}</div></div>
        <div class="kpi" style="border:0;background:var(--sf2)"><div class="k">已付清</div><div class="v" style="font-size:16px;color:var(--ok)">${nPaid}</div></div>
      </div>
      <div class="hr"></div>
      <div class="flowline">剔除（4 类规则）→ 分类（机械 / 集采 / 辅材，无「其他」）

              → 付款（实际付款方式默认取计划值，兜底「现汇」）→ 已付清 / 未付清（无中间态）</div>

      <div class="bars">${pjSort(WHs).map(w=>`<div class="br"><span class="nm" title="${esc(w.name)}">${esc(w.name)}</span>
        <span class="tk"><i class="${w.end<0?'r':''}" style="width:${(w.rows/mx*100).toFixed(1)}%"></i></span>
        <span class="vl">${w.rows} 行</span></div>`).join('')}</div>
    </div></div>
  </div>
  <details class="tip"><summary>状态机汇总（§8.3） · 展开查看各对象的状态与流转</summary><table class="dt" style="color:var(--tx)"><thead><tr><th>对象</th><th>状态</th><th>流转</th><th>出处</th></tr></thead><tbody>
    <tr><td>付款通知书</td><td>未付清 ⇄ 已付清</td><td>已付金额（流水汇总）≥ <b>审批金额</b> → 已付清；<b>无「部分付」</b>（统计字段只管算欠款、<b>不管判状态</b>）</td><td class="fc">§4.4.2 · DEV-P-02</td></tr>
    <tr><td>项目</td><td>在建 / 归档</td><td>手工改；各处筛选<b>默认「在建」</b></td><td class="fc">§2.7 · ENT-01</td></tr>
    <tr><td>集采合同存档</td><td>未存档 → 资产处 → 已存档</td><td>手工推进</td><td class="fc">§6.7.2 · ENT-09</td></tr>
    <tr><td>集采合同纳入</td><td>纳入台账 / 不纳入</td><td>抓来即<b>纳入台账</b>；改「不纳入」后<b>抓取不覆盖</b></td><td class="fc">§6.5.3</td></tr>
    <tr><td>差异登记</td><td>待核对 → 已核对 / 差异保留</td><td>手工标记；差异清单可导出</td><td class="fc">§5.8.3 · DEV-R-06</td></tr>
  </tbody></table></details>`;
  /* 业务事实监测告警卡已撤（2026-09-14 看板改造）：① 事实 1 并入上方「占位行待扶正」瓦片
     —— 两者同一数据源（PJs.filter(p => p.name.startsWith('未建仓-'))）；
     ② 事实 2（档案行数 vs i8 仓库数）按 2026-09-12 用户口径「不需要这个监控相关的东西」随卡移除。 */
};

/* =====================================================================
   4. MOD-03 付款通知书
   ===================================================================== */
let pickSet=new Set();
const monthEnd=m=>{const [y,mm]=m.split('-').map(Number); return m+'-'+String(new Date(y,mm,0).getDate()).padStart(2,'0');};
/* ---------- 统一「年月选择器」组件：按钮 → 年步进 + 12 宫格月，最多两次点击 ----------
   替代原生 input[type=month]（原生只支持滚轮/逐月翻，太慢）。
   全前端凡需「选时间」处一律用 tmBtn(id,{scope,val,modes}) 渲染，由 mpToggle/mpYear/mpMode/mpWQ/mpPick 驱动。 */
let mp={open:null,year:2026,mode:'',a:'',b:'',wq:''};
/* 展开态在 `PJ_OPEN`（key='pj' · `#1` 2026-09-26 收口） */
/* ⭐ 通用「时间选择器」组件（2026-09-13 重做；替掉原 `mpBtn` / `mpPanel`）
   原版缺陷：「全部月份」写在组件内部、按 `scope==='nt'` 现判 ⇒ 只有付款通知书有
   ⇒ **组件一份、能力却是散的**（违反 §八 准则 1「同一个事实只写一处」）。
   现在：**能力由调用点声明**（`cfg.modes`），**组件内部不再有任何 `scope===xxx` 分支**。
   modes：'月' · '跨月' · '年' · '季度' · '周' · '全部'
   值：`2026-09` · `2026-06~2026-07`（跨月，**只同年内**）· `2026` · `2026Q3`
       · 周 = 该周**周一**的 `YYYY-MM-DD` · 全部 = `全部`
   ⚠️ 抓取 / 付款计划导入 / 期初截止年月 **有意只声明「月」**（业务上就是"一次一个月"）——
      写进配置防"顺手统一"。 */
const tmBtn=(id,cfg)=>`<div class="mpwrap" style="position:relative;display:inline-block">
  <button class="btn" data-act="mpToggle" data-id="${id}" data-scope="${cfg.scope}" data-val="${esc(cfg.val)}" style="min-width:118px;display:inline-flex;align-items:center;justify-content:space-between;gap:8px"><span class="fc">${esc(cfg.label==null?cfg.val:cfg.label)}</span><span class="mut" style="font-size:9px">▼</span></button>
  ${mp.open===id?tmPanel(id,cfg):''}</div>`;
const tmModes={月:1,跨月:1,年:1,季度:1,周:1,全部:1};
const tmParse=v=>{ v=String(v==null?'':v);
  if(v==='全部') return {mode:'全部'};
  if(/^\d{4}Q[1-4]$/.test(v)) return {mode:'季度',y:+v.slice(0,4),q:+v.slice(5)};
  if(/^\d{4}-\d{2}~\d{4}-\d{2}$/.test(v)) return {mode:'跨月',y:+v.slice(0,4),a:v.slice(0,7),b:v.slice(8,15)};
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return {mode:'周',y:+v.slice(0,4),mon:v};
  if(/^\d{4}-\d{2}$/.test(v)) return {mode:'月',y:+v.slice(0,4),ym:v};
  if(/^\d{4}$/.test(v)) return {mode:'年',y:+v};
  return {mode:'月',ym:v}; };
/* 时间范围判定（**各页筛选共用**，一处实现）：v 见上；d = 'YYYY-MM' 或 'YYYY-MM-DD' */
const tmIn=(v,d)=>{ const k=String(d||'').slice(0,7); v=String(v==null?'':v);
  if(!v||v==='全部') return true;
  if(/^\d{4}-\d{2}~\d{4}-\d{2}$/.test(v)) return k>=v.slice(0,7)&&k<=v.slice(8,15);
  if(/^\d{4}-\d{2}$/.test(v)) return k===v;
  if(/^\d{4}$/.test(v)) return k.slice(0,4)===v;
  return true; };
const tmLabel=v=>String(v==null?'':v)==='全部'?'全部时间':String(v).replace('~',' ~ ');
const tmStart=v=>{ const s=String(v==null?'':v);
  if(/^\d{4}-\d{2}~\d{4}-\d{2}$/.test(s)) return s.slice(0,7);
  if(/^\d{4}-\d{2}$/.test(s)) return s;
  if(/^\d{4}$/.test(s)) return s+'-01';
  return bjMonth(); };
/* 把筛选值渲染成"对应的单据日期闭区间"（只读回显用） */
const tmRange=v=>{ const s=String(v==null?'':v);
  if(!s||s==='全部') return '不限（全部时间）';
  if(/^\d{4}-\d{2}~\d{4}-\d{2}$/.test(s)) return s.slice(0,7)+'-01 ~ '+monthEnd(s.slice(8,15));
  if(/^\d{4}-\d{2}$/.test(s)) return s+'-01 ~ '+monthEnd(s);
  if(/^\d{4}$/.test(s)) return s+'-01-01 ~ '+s+'-12-31';
  return s; };
const tp2=n=>String(n).padStart(2,'0');
const tmD=t=>t.getFullYear()+'-'+tp2(t.getMonth()+1)+'-'+tp2(t.getDate());
const tmQof=d=>{ const t=new Date(d+'T00:00:00'); return t.getFullYear()+'Q'+(Math.floor(t.getMonth()/3)+1); };
const tmQNow=()=>tmQof(SYS_TODAY);
/* 某季度的全部周（**周一 ~ 周日**）→ [[周一, 周日], ...] —— 界面直接显示起止日期 */
const tmWeeksOfQ=(y,q)=>{ const out=[], last=new Date(y,q*3,0);
  const t=new Date(y,(q-1)*3,1); t.setDate(t.getDate()-((t.getDay()+6)%7));   /* 回退到该周周一 */
  for(; t<=last; t.setDate(t.getDate()+7)){ const s=new Date(t); s.setDate(s.getDate()+6); out.push([tmD(t),tmD(s)]); }
  return out; };
const tmPanel=(id,cfg)=>{
  const modes=(cfg.modes||['月']).filter(m=>tmModes[m]);
  const sc=cfg.scope, v=String(cfg.val==null?'':cfg.val), st=tmParse(v);
  const md=(mp.mode&&modes.indexOf(mp.mode)>=0)?mp.mode:(modes.indexOf(st.mode)>=0?st.mode:modes[0]);
  const y=mp.year||st.y||Number(v.slice(0,4))||2026;
  const D=(act,ds,cls,txt)=>`<button class="btn sm ${cls||''}" data-act="${act}"${Object.keys(ds).map(k=>` data-${k}="${esc(ds[k])}"`).join('')}>${txt}</button>`;
  /* 模式切换条**只在声明了 2 种以上模式时**才渲染 —— 只给「月」的调用点不该出现切换条 */
  const head=modes.length>1?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px">${['月','跨月','年','季度','周','全部'].filter(m=>modes.indexOf(m)>=0)
    .map(m=>D('mpMode',{id:id,scope:sc,val:v,m:m},md===m?'pri':'',m)).join('')}</div>`:'';
  const yhead=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:7px">
      ${D('mpYear',{id:id,scope:sc,val:y,d:'-1'},'','‹')}
      <div style="flex:1;text-align:center;font-family:var(--fm);font-size:13px">${y} 年</div>
      ${D('mpYear',{id:id,scope:sc,val:y,d:'1'},'','›')}</div>`;
  const grid=c=>`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">${c}</div>`;
  let body='';
  if(md==='月'){
    body=yhead+grid(Array.from({length:12},(_,i)=>{const k=y+'-'+tp2(i+1);
      return D('mpPick',{id:id,scope:sc,val:k,m:'月'},k===v?'pri':'',(i+1)+'月');}).join(''));
  }else if(md==='跨月'){
    const a=mp.a||st.a||'', b=mp.b||st.b||'';
    body=yhead+`<div class="mut sm" style="margin:-3px 0 6px">先点起点、再点终点（<b>只允许同一年内</b>）</div>`
      +grid(Array.from({length:12},(_,i)=>{const k=y+'-'+tp2(i+1), on=(a&&b)?(k>=a&&k<=b):(k===a);
        return D('mpPick',{id:id,scope:sc,val:k,m:'跨月'},on?'pri':'',(i+1)+'月');}).join(''))
      +`<div style="margin-top:7px"><span class="pill">已选 <b>${a||'—'}</b> ~ <b>${b||'—'}</b></span></div>`;
  }else if(md==='年'){
    const ys=[]; for(let k=y-4;k<=y+4;k++) ys.push(k);
    body=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px">${ys.map(k=>D('mpPick',{id:id,scope:sc,val:String(k),m:'年'},String(k)===v?'pri':'',String(k))).join('')}</div>`;
  }else if(md==='季度'){
    body=yhead+grid([1,2,3,4].map(q=>D('mpPick',{id:id,scope:sc,val:y+'Q'+q,m:'季度'},(y+'Q'+q)===v?'pri':'','Q'+q)).join(''))
      +`<div class="mut sm" style="margin-top:6px">Q1 = 1–3 月 · Q2 = 4–6 月 · Q3 = 7–9 月 · Q4 = 10–12 月（自然季度）</div>`;
  }else if(md==='周'){
    const wq=/^\d{4}Q[1-4]$/.test(mp.wq)?mp.wq:(st.mode==='周'?tmQof(st.mon):tmQNow());
    const qy=+wq.slice(0,4), qq=+wq.slice(5);
    body=yhead+`<div style="display:flex;gap:4px;margin-bottom:6px">${[1,2,3,4].map(q=>D('mpWQ',{id:id,scope:sc,val:v,qy:qy,qq:q},qq===q?'pri':'','Q'+q)).join('')}</div>`
      +`<div style="max-height:186px;overflow-y:auto;display:flex;flex-direction:column;gap:3px">${tmWeeksOfQ(qy,qq).map(w=>
          D('mpPick',{id:id,scope:sc,val:w[0],m:'周'},w[0]===v?'pri':'',`<span style="font-family:var(--fm)">${w[0].slice(5)} ~ ${w[1].slice(5)}</span>`)).join('')}</div>`;
  }else{
    body=`<div class="mut sm">不限时间（不按单据日期筛选）</div>
      <div style="margin-top:7px">${D('mpPick',{id:id,scope:sc,val:'全部',m:'全部'},'pri','切换为「全部」')}</div>`;
  }
  const quick=`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:7px">
      ${modes.indexOf('月')>=0?D('mpPick',{id:id,scope:sc,val:bjMonth(),m:'月'},'','本月（北京时间）'):''}
      ${md==='季度'?D('mpPick',{id:id,scope:sc,val:tmQNow(),m:'季度'},'','本季'):''}
      ${md==='周'?D('mpPick',{id:id,scope:sc,val:wkMon(SYS_TODAY),m:'周'},'','本周'):''}
      ${D('mpClose',{scope:sc},'','关闭')}</div>`;
  return `<div style="position:absolute;z-index:80;top:calc(100% + 4px);left:0;background:var(--sf);border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px var(--shadow-pop);padding:9px;width:238px">
    ${head}${body}${quick}</div>`;
};

/* ---------- 项目档案查询：展示名解析 ----------
   ⚠️ 同一全名可能对应多条档案（1 个壳 + N 个具体小微共享同一全名）→ 此时只提示、不猜（铁律 5/6） */
const projMatches=full=>PJs.filter(p=>p.full===full);

/* ---------- 归属判定（链路 C） · 2026-09-12 定案 ----------
   「归属」= 这一行付款通知书算在【哪一条项目档案行】头上，存在 OWN[单据id]。
   · 全名不含「小微」→ 普通项目：全名唯一 ⇒ 归属天生确定，**永不「待指定」**

/* ---------- 自定义排序（2026-09-13 用户口径）----------

/* ⭐⭐ 2026-09-26（用户报障：「**通用导入的项目选择控件，行数显示不全**」）—— 根因 = **面板被宿主卡片裁掉**：
   `.card{...overflow:hidden}`（见上面 CSS）会把**卡片矩形之外**的部分剪掉，而面板是 `absolute`
   ⇒ 实测（真机量过）：卡片下沿在 504、面板伸到 567 ⇒ **裁掉 63px ＝ 最下面 2~3 行**，
   而那几行**既看不见也滚不到**（面板自身 `scrollH≈clientH` —— 不是它自己的滚动问题）。
   ⇒ 每次渲染后把展开的面板**提升为 `fixed`**（`fixed` 的包含块是视口，**不受非 transform 祖先的 overflow 裁剪**
     ⇒ 逃出卡片），位置按**触发按钮**算、高度按**按钮下方到窗口底**算 ⇒ 一行都不缺；太长时面板自己滚。
   ⚠️ 面板**留在原 DOM 位置**（仍在 `.pjwrap` 内）——「点面板外收起」的委托层判的就是 `.pjwrap` 包含关系，
      搬走它 ⇒ "点面板内"会被当成"点外面"（那种 bug 极隐蔽：点一下就收）。
   ⚠️ 触发按钮取 **`:scope > button`**：面板里的「全选 / 清空」也是 `<button>`，按 DOM 序拿"第一个 button"
      会拿成面板内那个（位置就全错了）。 */
function placePjPanels(){
  document.querySelectorAll('.pjwrap').forEach(w=>{
    const p=w.querySelector(':scope > .pjpop'); if(!p) return;
    const b=w.querySelector(':scope > button'); if(!b) return;
    const r=b.getBoundingClientRect();
    p.style.position='fixed';
    p.style.top=(r.bottom+5)+'px';
    /* 只给"按钮下方到窗口底"这段（最少 140px）—— 面板自己的 `overflow-y:auto` 兜住更长的清单 */
    p.style.maxHeight=Math.max(140, innerHeight-r.bottom-14)+'px';
    /* 左右也夹进视口（按钮靠右时面板不许把右边顶出去） */
    const wide=Math.min(340, Math.max(178, p.offsetWidth||260));
    p.style.left=Math.max(6, Math.min(r.left, innerWidth-wide-6))+'px';
  });
}
/* 面板是 `fixed` ⇒ 外层一滚，它得**跟着按钮走**（否则"粘"在原地像浮在空中）。

  document.addEventListener('scroll', placePjPanels, true);

   ⚠️ 全站口径「统计两金额 ≤ 审批金额」对手动行**同样有效**：要付 5 万，就把审批金额也填到 5 万

/* 单据日期默认 = 界面当前年月的 1 号（界面在「全部月份」时取北京时间当月）。日期用 `type="date"`，

   ⇒ `NT_COLS` 一字不动 · 既有 `n.manual` 判据（6 处）不动 · 欠款 / 台账 / 合计 / 导出 / 全选可见集
     **全部天然不受影响**（它们只认 `NO`）。
   ⚠️ 草稿行是**列对齐行**（18 个 `<td>`）⇒ `applySorts` 原来的"`<td>` 数 < 表头列数"判据**保不住它**
      ⇒ 已给 `applySorts` 补一条 **`.draftrow` → 钉表尾**（与"合计行"同通道），见该函数。 */
const NT_NEW_ID='@new';                     /* 哨兵 id：新增中的草稿行（**不是** `NO` 的行） */
const ntDraftOn=()=>naEditId!=='';          /* 是否处于增行态（渲染草稿行的唯一判据） */
/* ⭐ 「点新增就把筛选放宽到能看见」—— 2026-09-13 用户口径：**从"保存后"前移到"点新增时"**。

const ntReveal=()=>{ fNt.month=String(naD.date||naDefDate()).slice(0,7);

    <td><input class="inp" type="date" data-act="ntRowSet" data-k="date" value="${esc(d.date||'')}" title="单据日期（决定归月）"></td>

    <td><select class="inp" style="min-width:150px" data-act="ntRowSet" data-k="pid" title="付款项目（已建档项目 · 含归档、不含壳，§六-9）">${ntOpts()}</select></td>
    <td class="ctr"><select class="inp plain" style="width:auto" data-act="ntRowSet" data-k="cat">${optsOf(enumVals('cat'),cat)}</select></td>

    <td class="num"><span class="mut">0.00</span></td>

/* ===== 列定义 → 表头 / 空态跨列数（阶段 4 · **试点：只接 m03**）=====
   原先"表头 / 每行 `<td>` / 空态行 `colspan`"三处各写一遍 ⇒ **加一列要改三处**。
   其中 `colspan` 是最阴的一处：它是**写死的数字副本**，漏改不会有任何检查器报红，
   只会表现为"空态那一行没铺满表格"（视觉 bug，没人测）。
   ⇒ 把**表头抽成唯一出处**（`NT_THEAD`），**跨列数由它算**（`thCount`）—— 加列时不可能忘记改 colspan。
   ⚠️ 每行的 `<td>` 仍逐行写：值各不相同，收不了（这是**数据**，不是结构）。
   ⚠️ 表头 HTML **一字不改**（只搬进常量）—— `applySorts` 靠表头文本判列类型与可排性，改一个空格都可能改行为。 */
/* ⭐ **表格件**（`TAIL-64` P0 · 2026-09-24）—— 一张表的**外壳**统一由它渲染：表头 / 行 / 空态 / 合计。
   ⭐ 抽它的真理由 = **虚拟滚动只需要挂一处**（本件内），且「表该怎么开（`class` / `data-sort`）」只有一个口径。
   契约：`TBL({head, rows, empty, sum, key})` ⇒ 返回完整 `<table …>…</table>`（⚠️ 不含外层 `.tw`）。
   ⛔ 与 `sumRowOf` / `thCount` 的分工：那两个是**纯算法**（求和 / 数列），本件只管**拼装**。 */
const TBL=({head='',rows=[],empty='',sum='',key='',cls=''})=>{
  const attr=' class="dt'+(cls?' '+cls:'')+'"'+(key?' data-sort data-sort-key="'+key+'"':'');
  const th=head?'<thead><tr>'+head+'</tr></thead>':'';
  return '<table'+attr+'>'+th+'<tbody>'
    +rows.join('')+(rows.length?'':empty)+sum+'</tbody></table>';
};

const thCount=h=>(String(h).match(/<th\b/g)||[]).length;   /* 一张表有几列 —— 从表头数出来，不写死 */
/* ⚠️ **表头有几「列」**（不是有几个 `<th>`）—— **两行表头**时两者不等：活动大表 `<th>` 共 23 个，而**列数是 20**
   （`rowspan` / `colspan` 各只占 1 个 `<th>`）⇒ `thCount` 会把列数**多算**、合计行就会多出几个空 `<td>`，
   而"列对齐"断言**跳过含「合计」的行** ⇒ **完全静默**（2026-09-13 迁移大表时实测踩到，靠新断言才抓出）。
   正确算法 = **首行表头的 `colspan` 累加**（与 §六「列对齐」断言同一套）。 */
const thCols=h=>{ const s=String(h);
  const th=((s.match(/<thead\b[^>]*>([\s\S]*?)<\/thead>/i)||['',s])[1]);
  const row=((th.match(/<tr\b[^>]*>[\s\S]*?<\/tr>/i)||[th])[0]);
  return (row.match(/<th\b[^>]*>[\s\S]*?<\/th>/gi)||[]).reduce((a,x)=>a+(+((x.match(/colspan="(\d+)"/)||[0,1])[1])),0); };

/* —— 「表内合计行」的**唯一出口**（2026-09-13 用户口径：求和一律落在**表内**、与所有表同款）——
   声明式：`sums` = { 列下标: 取值函数 } 或 { 列下标: [取值函数, 格式化函数] }；列数从**表头常量**派生（`thCount`）
   ⇒ 合计行的 `<td>` 数恒 = 表头列数（不可求和的列给空 `<td>`，与空态行同一个列数出口）。
   行首格写 `lead`（默认「合计」）⇒ `applySorts` 会把含「合计」的行**钉在表尾**，天然不被排序卷走。
   `opt` 一览（⚠️ **每一项都有真实调用点，不是预留** —— 2026-09-13 把 10 处既有合计行迁进来时定的）：
     · `lead` 首格内容（**可含 HTML**；默认 `合计`）
     · `leadSpan` 首格 `colspan`（默认 1）—— `MOD-05` 台账 / 流水、`MOD-07` 大表 用它把标签压在前置列上
     · `leadCls` 首格 class（默认无）—— `MOD-05` 两处合计的标签是**居中**（`ctr`）
     · `cells` { 列下标: **整格 HTML** }：非数值格（如收发结存末列的「校验」状态 tag）；与 `sums` 互斥使用
     · `style` 行内样式（默认 `background:var(--sf2);font-weight:500`；`MOD-05` 两处与集采子表传自己的）
     · `tip` 首格 `title`
     · `sticky` 是否带**置底**标记（默认 `true`）—— **分组表**（`MOD-07` 焊材/气体提取）传 `false`
       （分组合计要紧贴本组；两行同时 sticky 会重叠）
   ⚠️ **不要在视图里内联求和**；要加合计就调这里（与 `thCount` / `pjDisp` 同一套「唯一出口」思路）。 */
const sumRowOf=(thead,rows,sums,opt={})=>{
  const n=thCols(thead), span=Math.max(1,opt.leadSpan||1), cells=opt.cells||{};
  const lead=opt.lead===undefined?'合计':opt.lead;
  const style=opt.style===undefined?'background:var(--sf2);font-weight:500':opt.style;
  const tds=[];
  for(let i=0;i<n;){
    if(i===0){ tds.push(`<td${span>1?` colspan="${span}"`:''}${opt.leadCls?` class="${opt.leadCls}"`:''}${opt.tip?` title="${esc(opt.tip)}"`:''}>${lead}</td>`); i=span; continue; }
    if(cells[i]!=null){ tds.push(cells[i]); i++; continue; }
    const s=sums[i];
    if(s==null){ tds.push('<td></td>'); i++; continue; }
    const f=Array.isArray(s)?s[0]:s, fmt=Array.isArray(s)?(s[1]||M):M;
    tds.push(`<td class="num">${fmt(f(rows))}</td>`); i++;
  }

      一旦审批金额被 i8 **调小**，人工填过的统计值就可能**越界** —— 而这条铁律的拦截
      只发生在"**手改时**"，**拦不住"上限自己掉下来"**。

   ⭐ 方案乙 = **「未手改的跟随、手改过的保留」**（判据 = 留痕，不新增状态位）：
      `hasT(n,'统计结算金额')` / `hasT(n,'统计付款金额')` 即为「这条人工改过没有」的**唯一事实来源**
      —— 复用既有留痕，**不为"是否手改"另开一个字段**（那会是一份必然静默过期的副本）。
      ① 未手改 ⇒ **跟随**新审批金额（重算为新上限）； ⇒ 解决"审批被改小后越界"
      ② 已手改 ⇒ **保留**人工值，**但若越界则挂提醒**（`IMP_WARN`），让人来定 ——
         **绝不自动改写人工判断**（油卡抵扣那类值改掉就是丢业务数据）。
      ③ 审批金额「被改大」时也**不无脑跟随**：已手改的照样保留（否则凭空生出欠款，见下）。
   ⚠️ 欠款的连锁：审批金额调大而统计值跟随 ⇒ 台账里**突然多出欠款，但没多付一分钱**。
      这正是"保留人工值"要保护的东西 ⇒ 方案乙的 ② 顺带把这一坑堵掉。

   ⭐ 「i8 已撤单」：i8 那边**删掉整张单据**（撤单）时，本轮**不硬删** —— 标 `IMP_GONE` 保留可查，
      但**退出全部统计**（与「剔除」同思路：保留标记、不销毁数据）。
      ✅ 口径已定案（2026-09-14）⇒ **有牵涉则硬拦**（见下 `ntVoidJoint`），**不做「删除付款通知书」按钮**。

   ⚠️ 本模块只做**判定与提醒**，不落库 —— 原型里用 `IMP_WARN` / `IMP_GONE` 两个明面表承载，
      由 `fetchNtOk`（= 用户点「按 X 月抓取」）驱动；`rollback` 里清空。 */
const IMP_WARN={};   /* nid → [{field, why}]：再次导入时**人工值越界**的提醒（未改，只提醒） */
const IMP_GONE={};   /* nid → {date,code,doc}：i8 已撤单（本轮不再抓到的行）—— 标记保留、不销毁 */
const impHasWarn=n=>Object.prototype.hasOwnProperty.call(IMP_WARN,n.id);

/* ⭐ i8 撤单行的「退出全部统计」唯一出口（2026-09-14 用户口径 · 见《说明书》§4.2.7）——

const plProjHit=v=>{ const s=String(v==null?'':v).trim(); if(!s) return [];

const LG_R_DEF='系统上线前已发生，无付款通知书';
let lgD={s:'0.00',p:'0.00',r:LG_R_DEF};
let lgPjName='';                           /* 展开区里选的**项目键（仓库名）**（打开时默认＝台账当前项目） */

const ntProjKey=n=>pjKey(ownOf(n));
const ntProjName=n=>{ const k=ntProjKey(n); return k?pjLabel(k):(isShellFull(n.proj)?'（待指定归属）':n.proj); };

const lgProjKeyOf=v=>pjKey(pjRowOf(v));
const nextYm=m=>{ const [y,mm]=String(m).split('-').map(Number); const t=new Date(y,mm,1);
  return ymOf(t); };
const prevYm=m=>{ const [y,mm]=String(m).split('-').map(Number); const t=new Date(y,mm-2,1);

   ⚠️ 原第 2 行按**演示** `MACH6` 的键补候选 —— 那是演示数据 ⇒ 会往选择器里塞**幻影项目**（真库里没有的仓库名）。

const LED_PROJS=sc=>{ const s=new Set();

/* ⭐ 已接后端：期初占位行 / 逐月台账行**一律读 `/api/m05/ledger`**（§4.5.4 的唯一出口）。

const ledProjs=()=>pjSort(uniqBy([...LED_PROJS('辅材'),...LED_PROJS('机械')],v=>v));

const IVC5=['主辅材','工具','劳保','周转材料','临时设施'];
const amtOf=iv=>{const a=ADs.find(x=>x.ivid===iv.id); return a?a.newAmt:iv.amt};
const adjOf=iv=>ADs.find(x=>x.ivid===iv.id);
/* ⭐ 候选键 = **仓库名**（库存单据自带，§2.7.4）。
   ⚠️ **必须由 `reloadInv()` 重算**：`IVs` 接后端后是**异步填充**的 —— 若仍写成加载时
      `uniqBy(IVs,…)` 一次性求值，取数回来时它早已定死成空数组（**静默失去候选**，不报错）。 */
let PROC_PJS=[];
/* procTab 默认 = 1（**表② 调整后表**）；pjIsOpen('procPj') = 「项目」单选面板的开合（用户口径 2026-09-13） */
let procPj='', procTab=1;   /* 初值同理由 `reloadInv()` 落定（不能取加载时的 `PROC_PJS[0]`） */
/* 该项目的**核算月**清单（升序）= 库存单据里出现过的月份 —— 这就是「过程资料 = 每项目每月一份」
   的月份维度。⚠️ 月份**只从库存单据来**，不新立口径。 */
const procMonths=proj=>[...new Set(IVs.filter(iv=>iv.wh===proj).map(iv=>String(iv.dd).slice(0,7)))].sort();
/* 聚合的**唯一出口**：传 `ym` = 只算该核算月；**不传 `ym` = 全月合计**（自检用的就是后者 ⇒ 语义不变）。
   ⚠️ `proj` = **仓库名**（§2.7.4）。机械 6 列同样按核算月取（`mach6Arr`），全月合计时**逐列相加**。 */
function procAgg(proj,adjusted,ym){
  const g=IVs.filter(iv=>iv.wh===proj&&(!ym||String(iv.dd).slice(0,7)===ym)), inC={}, outC={};
  IVC5.forEach(c=>{ const pick=d=>g.filter(iv=>iv.dir===d&&iv.c5===c);
    inC[c]=N2(pick('入库').reduce((a,iv)=>a+(adjusted?amtOf(iv):iv.amt),0));
    outC[c]=N2(pick('出库').reduce((a,iv)=>a+(adjusted?amtOf(iv):iv.amt),0)); });
  const m = ym ? mach6Arr(proj,ym)
               : MACH6_Z.map((_,i)=>N2(Object.keys(MACH6[proj]||{}).reduce((a,k)=>a+MACH6[proj][k][i],0)));
  return {inC,outC,m};
}
/* 表体数据源：**一个核算月一行**（`[{ym,inC,outC,m}]`）—— 表① 与表② 是同一批月份，按下标对齐 */
const procRows=(proj,adjusted)=>procMonths(proj).map(ym=>Object.assign({ym},procAgg(proj,adjusted,ym)));
/* 当前选中的表名 —— 导出取数与按钮提示共用（**默认 = 表② 调整后表**） */
const procTabName=()=>procTab===2?'差异表':(procTab===1?'表② 调整后表':'表① 原始表');
/* MOD-06 的「项目」候选 = **库存单据里出现过的仓库**（`IV.wh` = 仓库名 ⇒ 天然就是候选键，§2.7.4）。
   **复用共用的项目面板 `projPanel`，但由调用点声明为「单选」**（2026-09-13 用户口径）；
   显示名走 `PROJ_META_KEY`（仓库名 → 展示名）。 */
const procPjPanel=()=>projPanel({list:()=>pjSort(PROC_PJS),selected:()=>[procPj],pickAct:'procPjPick',meta:PROJ_META_KEY,single:true});
/* —— 过程资料「按模板导出（每项目一份）」的**多选项目**展开区（2026-09-13 用户口径）——
   原按钮只演示一份；现改为：点开展开区 → **多选项目**（默认 = 本页当前所选）→

const procExpPjPanel=()=>projPanel({list:()=>pjSort(PROC_PJS),selected:()=>procExpPjs,allAct:'procExpPjAll',noneAct:'procExpPjNone',pickAct:'procExpPjPick',meta:PROJ_META_KEY});
const procExpStrip=()=>`<div class="fbar" style="margin:0 0 8px;border:1px solid var(--bd);border-radius:6px;background:var(--sf2);padding:8px 10px">

    </div>`;
V.m06=()=>{
  const rows0=procRows(procPj,false), rows1=procRows(procPj,true);
  const a0=procAgg(procPj,false);                       /* 全月合计：供卡内 kv 用（口径不变） */
  const adjs=IVs.filter(iv=>iv.wh===procPj&&adjOf(iv));
  /* ⭐ 2026-09-13 用户口径：按「总求和（本表）」那**四段**，给整张表（表①/表②）做**视觉分隔** ——
     段首列加 `.vsep`（左侧 2px 竖线），**表头 / 数据行 / 合计行 / 总求和行四处一致**。
     段首列下标（0 = 核算月）：`1` 入库 · `6` 出库 · `11` 机械左 4 列 · `15` 不含税 2 列。
     ⚠️ `15` 是"机械 6 列里的第 5 列"⇒ 机械段被一分为二，正好对上总求和的第三 / 第四段。
     ⚠️ 定义必须写在 `head` **之前**（`const` 有 TDZ，模板里用到会直接抛错）。 */
  const SEG=[1,6,11,15];
  const vs=i=>SEG.indexOf(i)>=0?' class="vsep"':'';
  const vsc=i=>SEG.indexOf(i)>=0?' vsep':'';
  const head=`<tr><th class="fl">核算月</th>${IVC5.map((c,i)=>`<th${vs(1+i)}>入库${c}</th>`).join('')}${IVC5.map((c,i)=>`<th${vs(6+i)}>出库${c}</th>`).join('')}<th${vs(11)}>租分公司设备</th><th>内租设备</th><th>外租零租含税</th><th>外租包月含税</th><th${vs(15)}>外租零租不含税</th><th>外租包月不含税</th></tr>`;
  const mH=['租分公司设备','内租设备','外租零租含税','外租包月含税','外租零租不含税','外租包月不含税'];
  const row=(a,b,isAdj)=>`<tr><td class="fl fc">${a.ym}</td>${IVC5.map((c,i)=>`<td class="num${isAdj&&a.inC[c]!==b.inC[c]?' ed':''}${vsc(1+i)}">${M(a.inC[c])}</td>`).join('')}${IVC5.map((c,i)=>`<td class="num${isAdj&&a.outC[c]!==b.outC[c]?' ed':''}${vsc(6+i)}">${M(a.outC[c])}</td>`).join('')}${a.m.map((v,j)=>`<td class="num${vsc(11+j)}">${M(v)}</td>`).join('')}</tr>`;
  /* 表① = 原始；表② = 调整后（**逐月**与原始比对，被改过的格标 `ed`） */
  const body = procTab===1 ? rows1.map((a,i)=>row(a,rows0[i],true)).join('')
                           : rows0.map(a=>row(a,a,false)).join('');
  /* ⭐ 求和（2026-09-13 用户口径）：
     ① **每个数据列下方**加「合计」行 —— 入库 5 类 / 出库 5 类 / 机械 6 列**逐列垂直求和**；
     ② 另加「总求和」行 —— **入库 / 出库 / 机械** 三组各一个横向总计（用户要的"额外的总求和"）。
     ⚠️ 机械 **6 列全部**参与（含「外租零租不含税 / 外租包月不含税」两列 —— 用户明确要求一并加）。
     ⚠️ 合计跟着**当前显示的那批**走（表① 看原始 / 表② 看调整后），不是恒取其中一批。 */
  const cur = procTab===1 ? rows1 : rows0;
  const sumIn = c => N2(cur.reduce((s,r)=>s+r.inC[c],0));
  const sumOut = c => N2(cur.reduce((s,r)=>s+r.outC[c],0));
  const sumM = i => N2(cur.reduce((s,r)=>s+r.m[i],0));
  const totIn = N2(IVC5.reduce((s,c)=>s+sumIn(c),0));
  const totOut = N2(IVC5.reduce((s,c)=>s+sumOut(c),0));
  /* 机械 6 列**分两段**（列序：0 租分公司设备 · 1 内租设备 · 2 外租零租含税 · 3 外租包月含税 ·
     4 外租零租不含税 · 5 外租包月不含税）：**左 4 列**一段、**不含税 2 列单独**一段 ——
     用户 2026-09-13 明确：不含税两列**单独求和**，不并入左 4 列那一段。 */
  const MACH_TAX_N = 4;
  const totMTax = N2(a0.m.slice(0, MACH_TAX_N).reduce((s,_,i)=>s+sumM(i), 0));
  const totMNoTax = N2(a0.m.slice(MACH_TAX_N).reduce((s,_,i)=>s+sumM(i + MACH_TAX_N), 0));
  const sumRow = `<tr class="sumrow" style="background:var(--sf2);font-weight:500"><td class="fl">合计</td>`
    + IVC5.map((c,i)=>`<td class="num${vsc(1+i)}">${M(sumIn(c))}</td>`).join('')
    + IVC5.map((c,i)=>`<td class="num${vsc(6+i)}">${M(sumOut(c))}</td>`).join('')
    + a0.m.map((_,i)=>`<td class="num${vsc(11+i)}">${M(sumM(i))}</td>`).join('') + `</tr>`;
  /* 总求和行：四段各占一段（`colspan` = 该段列数）⇒ 行内单元格数之和恒等于表头列数。

  const totRow = `<tr style="background:var(--sf2);font-weight:500"><td class="fl">总求和（本表）</td>`

    + `<td class="num vsep" colspan="${IVC5.length}">出库合计 ${M(totOut)}</td>`
    + `<td class="num vsep" colspan="${MACH_TAX_N}">机械合计 ${M(totMTax)}</td>`

/* ⭐ 活动大表的**项目集合与顺序**（2026-09-13 用户口径：从「在建」项目里**多选** + **大表自己的顺序**）。
   候选 = 项目档案里 `status==='在建'` 且**非壳**的行（`pjNoShell`），键 = **仓库名**（§2.7.4）。
   `BIGSET` = 有序数组，是这份集合的**唯一存储**；改动只走选题动作（`ACT.*`）。 */
const bigCands = () => pjKeysOfRows(pjNoShell().filter(p=>p.status==='在建'));   /* 候选 = 在建 · 非壳（实时算） */
let BIGSET = [];   /* ⭐ 已接后端：由 `reloadM07()` 从 `/api/m07/big` 的 `selected` 原地填充（行序 = 大表自己的顺序；未选题时后端给「全部候选」，与原型同款） */
let BIGDRAFT = null;         /* 选题弹窗的**草稿**（「确定」前的临时顺序） */
/* ⭐ 大表每一格的取数（**唯一出口**：页面渲染 / 导出共用）。
   `ym` = 核算月（默认 `bjMonth(-1)`，§9.2 材料报表类）。
   · 焊材 / 三气：取自**收发结存提取**（`EXTM`）—— 当月走 `extMon`、累计走 `extTotal`（全部月份之和）。
   · 外租机械 = **外租零租含税 ＋ 外租包月含税**（= 进结算那两列）⇒ 当月复用 `machExtRent`、累计复用 `machSettleOf`。
   · 设备租赁（含内租）= **内租设备**（机械 6 列的第 1 列）。
   · **合计 = 外租机械开工累计 ＋ 设备租赁开工累计**（用户口径；已按模板图逐行核对）。
   ⚠️ **「租分公司设备」与两个「不含税」列不进本表**（用户口径）。 */
const bigRent     = (wh,ym) => machExtRent(wh, ym);
const bigRentCum  = wh => machSettleOf(wh);
const bigLease    = (wh,ym) => N2(mach6Arr(wh,ym)[1]);
const bigLeaseCum = wh => N2(Object.keys(MACH6[wh]||{}).reduce((a,k)=>a+bigLease(wh,k),0));
const bigTotalCum = wh => N2(bigRentCum(wh) + bigLeaseCum(wh));
const bigHWCum = wh => extTotal('焊材', wh), bigQTCum = wh => extTotal('气体', wh);
/* ⭐ **主材累计（含税）** 的**取数唯一出口**（2026-09-13 用户裁定：由手填改为**派生**）——
   口径 = **按项目取「集采台账结算」额**：= 该项目集采合同**结算金额之和**（§5.7.1）。
     · 结算口径本身**照搬** `jcSettle`（有贸易公司 → 贸易公司发票子表合计；无 → 供应商发票子表合计，§6.4.1），
       **不另立算法**；
     · ⭐ **只计「纳入台账」的合同**（用户 2026-09-13 裁定「甲」）—— 与 `MOD-11` 的「Σ 结算金额」KPI **同口径**；
     · 键 = 仓库名（§2.7.4）；项目恒有值 ⇒ 不需要"未指定"档。
   ⚠️ 视图 / 导出**一律走本出口**，不要在渲染里内联求和。 */
/* ⚠️ 「主材累计（含税）」的取数口**集采台账属 M5**：未接入时给 `null`（页面显「—」），⛔ 不写 0 冒充「确实没有」（`TAIL-25`；口径 = 后端 `mat_available`）。 */
const bigMatCum = wh => MAT_OK ? N2(JCs.filter(j => j.tag === '纳入台账' && j.proj === wh).reduce((a, j) => a + jcSettle(j), 0)) : null;
/* （原 `TOK` / `pickExtra` 已废：大表不再按"项目全名关键词"匹配，改按**仓库名**走上面的出口。） */
/* ---------- 焊材 / 气体提取的**取数出口**（2026-09-13） ----------
   · `extWhs(kind)` = 该类别下出现过的仓库（**排序走共性出口 `pjSort`**）。
   · `extMon(kind, wh, m)` = 某仓库某月的金额（缺省 0）；`extMons()` = 有数据的月份（升序）。
   · `extSum(kind, wh)` = **「金额」列** = 所选**月份范围**内的金额（`fExt.ym` 走 `tmIn`：月 / 连续月 / 年 / 全部）。
   · `extTotal(kind, wh)` = **「总金额」列** = 全部月份的累计（**不随月份筛选变**）。
   · `extVisible(kind)` = 按「项目状态」过滤后的行（状态取自**项目档案行** `pjRowOf(仓库名).status`）。 */
let fExt = { status: '在建', ym: bjMonth(-1) };   /* 项目状态默认「在建」（用户口径）；月份默认上月（§9.2） */
const extMons = () => Object.keys(EXTM).sort();
const extMon = (kind, wh, m) => { const h = ((EXTM[m] || {})[kind] || []).find(x => x[0] === wh); return h ? h[1] : 0; };
const extWhs = kind => { const s = new Set(); extMons().forEach(m => (EXTM[m][kind] || []).forEach(x => s.add(x[0]))); return pjSort([...s]); };
const extStatusOf = wh => { const p = pjRowOf(wh); return p ? p.status : ''; };
const extVisible = kind => extWhs(kind).filter(w => fExt.status === '全部' || extStatusOf(w) === fExt.status);
const extSum = (kind, wh) => N2(extMons().reduce((a, m) => a + (tmIn(fExt.ym, m) ? extMon(kind, wh, m) : 0), 0));
const extTotal = (kind, wh) => N2(extMons().reduce((a, m) => a + extMon(kind, wh, m), 0));
/* 提取表的一「块」= 该类别的数据行 + **紧贴其后的合计行**（用户口径：焊材的求和要贴着焊材数据行）。
   空（被筛没了）时给提示行；跨列数由 `thCount(EXT_THEAD)` 派生。页面与导出**共用**这一份取数。 */
function extBlock(kind){
  const list = extVisible(kind), tagCls = kind === '焊材' ? 't-wn' : 't-pri';
  if (!list.length) return `<tr><td colspan="${thCount(EXT_THEAD)}" class="ctr mut" style="padding:14px">当前筛选条件下没有${kind}数据 —— 换个「项目状态」或月份</td></tr>`;
  /* 结余格 = **点格即改**（`ACT.extBal`）：未录入 ⇒ 空 + 「待填」占位（⛔ 不写 0）；`0` 照写 `0`（合法值）。 */
  const balCell = w => { const v = extBalOf(kind, w);
    return `<td class="num"><input class="inp num" data-act="extBal" data-k="${esc(kind)}" data-p="${esc(w)}" value="${v == null ? '' : esc(String(v))}" placeholder="待填" title="${esc(EXT_BAL_NOTE)}"></td>`; };
  const rows = list.map(w => `<tr><td><span class="tag ${tagCls}">${kind}</span></td><td class="sm">${esc(w)}</td>${balCell(w)}<td class="num">${M(extTotal(kind, w))}</td><td class="num">${M(extSum(kind, w))}</td></tr>`).join('');
  return rows + sumRowOf(EXT_THEAD, list, {3:rs=>N2(rs.reduce((a,w)=>a+extTotal(kind,w),0)),4:rs=>N2(rs.reduce((a,w)=>a+extSum(kind,w),0))}, {lead:kind+'合计',sticky:false});
}
/* 手填值解析（OPEN-05）：当月已录入 → 用当月值（无标记）；否则向更早月份取「最近一次录入值」带入（标来源月）。
   注意用 != null 判断：0 是合法录入值，不能被当作「未录入」。 */
const bigOwn=(wh,m,i)=>{ const r=BIGVAL[m]&&BIGVAL[m][wh]; return (r&&r[i]!=null)?r[i]:null; };
/* 某一格的值：本月已录 → 直接取；否则**向前取最近一次录入值**（带入 · OPEN-05），并标出来源月。 */
function bigCell(wh,month,i){
  const own=bigOwn(wh,month,i);
  if(own!=null) return {v:own,from:null};
  const earlier=Object.keys(BIGVAL).filter(m=>m<month).sort().reverse();   /* 由近及远，实现「最近一次」 */
  for(const m of earlier){ const h=bigOwn(wh,m,i); if(h!=null) return {v:h,from:m}; }
  return {v:null,from:null};
}
/* 大表完整行（页面渲染、导出**共用**，保证「所见即所印」）—— 行序 = `BIGSET`（大表自己的顺序）。 */
function bigRows(month){
  return BIGSET.map(wh=>{ const p=pjRowOf(wh);
    const cells=BIGCOLS.map((c,i)=>bigCell(wh,month,i));
    const rentC=bigRentCum(wh), leaseC=bigLeaseCum(wh), totC=bigTotalCum(wh);
    const cap=bigCell(wh,month,1).v;                                /* 机械费测算（手填） */
    const cont=bigCell(wh,month,2).v, outv=bigCell(wh,month,3).v;   /* 合同（预估）价 / 产值累计（手填） */
    return { wh, disp:p?pjDispOr(p,wh):wh, cells, carryN:cells.filter(c=>c.from).length,
      hwc:bigHWCum(wh), hw:extMon('焊材',wh,month), qtc:bigQTCum(wh), qt:extMon('气体',wh,month),
      rentC, rent:bigRent(wh,month), leaseC, lease:bigLease(wh,month), totC,
      matC:bigMatCum(wh),                     /* 主材累计（含税）= 派生（按项目取集采台账结算额） */
      use:(cap?N2(totC/cap):null),            /* 使用率 = 合计 ÷ 机械费测算 */
      done:(cont?N2(outv/cont):null) };       /* 产值完成率 = 产值累计 ÷ 合同（预估）价 */
  });
}
/* 手填值的显示 / 落库换算（**界面形态 ↔ 存储形态**的唯一出口）：

  return N2(parseFloat(s)); };

/* ---------- 「每列可筛」（Excel 式自动筛选）----------
   `IV_FCOL` = 列元数据的**唯一出处**：`i` = 该列在 `INV_THEAD` 里的下标（0 起算；**末列「操作」不参与**），
   `k` = 取数字段（`adj` = 调整后金额，派生自调整单），`t` = 列型 ——
     · `text`  → 「包含」输入框 + 值清单多选
     · `enum`  → 值清单多选（方向 / 单位 / 业务类型 / 仓库）

const IV_FCOL=[
 {i:0,k:'docNo',t:'text'},{i:1,k:'seq',t:'text'},{i:2,k:'dir',t:'enum'},{i:3,k:'mat',t:'text'},
 {i:4,k:'spec',t:'text'},{i:5,k:'unit',t:'enum'},{i:6,k:'qty',t:'num'},{i:7,k:'px',t:'num'},
 {i:8,k:'pi',t:'num'},{i:9,k:'amt',t:'num'},{i:10,k:'adj',t:'num'},{i:11,k:'tax',t:'num'},
 {i:12,k:'biz',t:'enum'},{i:13,k:'cp',t:'text'},{i:14,k:'dd',t:'date'},{i:15,k:'ad',t:'date'},
 {i:16,k:'wh',t:'enum'},{i:17,k:'wbs',t:'text'},{i:18,k:'cbs',t:'text'}
];
const IV_COLN=IV_FCOL.length;                    /* 参与列筛选的列数（= INV_THEAD 列数 − 1 个「操作」列） */
const ivColMeta=i=>IV_FCOL.filter(c=>c.i===i)[0];

const ivTxt=(iv,i)=>String(ivRaw(iv,i));
const ivHasF=i=>{ const f=fIvCol[i]; return !!(f&&((f.v&&f.v.length)||(f.q!=null&&f.q!=='')||(f.min!=null&&f.min!=='')||(f.max!=null&&f.max!==''))); };
const ivColN=()=>IV_FCOL.filter(c=>ivHasF(c.i)).length;
/* 值清单 = 该列在「当前年月 + 只调整 + 方向」这三个**粗筛**下出现过的值（去重、字典序）——

const ivDistinct=i=>[...new Set(IVs.filter(iv=>tmIn(fIvYm,iv.dd)&&(!invOnlyAdj||adjOf(iv))&&(fIvDir==='全部'||iv.dir===fIvDir)).map(iv=>ivTxt(iv,i)).filter(v=>v!==''))].sort();
const ivColPass=(iv,i)=>{ const f=fIvCol[i]; if(!f) return true; const c=ivColMeta(i); if(!c) return true;
  if(c.t==='num'){ const raw=ivRaw(iv,i); if(raw==='') return false; const v=Number(raw);

   ⭐ `fDf` 两个筛选的**默认值都取「全部」** ⇒ 与本页加筛选**之前**的行为一字不差（有意如此，不是随手取的默认值）。 */
let dfNewOn=false;
let dfD={month:'',proj:'',detail:'',amount:'',remark:'',status:'待核对'};
let fDf={ym:'全部',stat:'全部'};
const dfBlank=()=>({month:/^\d{4}-\d{2}$/.test(fDf.ym)?fDf.ym:bjMonth(-1),proj:'',detail:'',amount:'',remark:'',status:'待核对'});
/* ⚠️ 草稿层复位**必须原地改字段**（不能 `dfD=dfBlank()`）—— `dfD` 是导出给自检的**对象引用**，

    <div class="card"><h4>小微识别关键字配置<span class="sp"><span class="mut sm">已从全局 small_map 迁到项目行</span></span></h4><div class="bd np">${TBL({head:'<th>具体小微（仓库名）</th><th>所属壳</th><th>识别关键词</th>',rows:[
      ...PJs.filter(p=>p.type==='small').map(p=>`<tr><td class="sm">${esc(p.name)}</td><td class="sm mut">${esc((PJs.find(x=>x.id===p.parent)||{}).full||'')}</td>
        <td class="fc">${esc(p.kw)}</td></tr>`)
    ]})}
    <div class="bd"><div class="tip" style="margin:0"><b>设计要点（决策 3/4）：</b>关键词是<b>具体小微的属性</b>，存在<b>项目行</b>上（<span class="fc">|词1|词2|</span> 格式）；<b>允许重复</b>，命中多个时<b>弹窗让用户选</b>，选中后去重追加到该小微名下。</div></div></div></div>
  </div>
  <div class="card" style="margin-bottom:0"><h4>全局铁律（§9.8 · 10 条，实现与验收都按此）</h4><div class="bd np">${TBL({cls:'cond',rows:[
      ...['金额 2 位小数、HALF_UP、Decimal、容差 0','源数据不动，人工判断走旁路载体','人工改过的值不被导入覆盖','仓库名不可人工修改（只能系统建档/扶正时写）','一切写操作按 id 定位，禁止用名字反查','处理付款通知书时先判断是否为壳，不可直接拿全名撞表','小微必须先有壳后有微（不可单独存在）','核心数据软删留痕、配置数据硬删','不标准值不清洗，原样入库 + 批量修改入口','材料月报不上报；过程资料才上报'].map((t,i)=>`<tr><td class="fc" style="width:40px">${i+1}</td><td>${t}</td></tr>`)
    ]})}</div></div>`;

/* =====================================================================
   17. MOD-15 用户管理（§1.5 角色与权限）
   ===================================================================== */
V.m15=()=>{
  const on=USERS.filter(u=>u.status==='在用');
  const offN=USERS.filter(u=>u.status==='已停用').length;
  const delN=USERS.filter(u=>u.status==='已删除').length;
  const admins=USERS.filter(u=>u.role==='admin'&&u.status==='在用');
  const iAmAdmin=CUR.role==='admin';
  /* 防锁死：**最后一个「在用管理员」**不能停用 / 删除（其余账号随便动） */
  const lockAdmin=u=>u.role==='admin'&&u.status==='在用'&&admins.length<=1;
  return `
  <details class="tip"><summary>口径说明 · 7 条 <span class="mut sm">点开查看（默认收起，把空间让给数据）</span></summary>
    <ul style="margin:6px 0 0;padding-left:17px;line-height:1.8">
      <li><b>系统内 2 人</b>（§1.5.1），<b>两人业务权限无区别</b> ⇒ 本页<b>不设业务权限配置</b>（配了也没有区别）。<br>「角色」的<b>唯一</b>区别是：<b>能不能管理账号</b>。</li>
      <li><b>管理动作共 5 类</b>：新增账号 · 改密 · 停用 / 启用 · <b>删除用户</b> · <b>转让管理员</b>。</li>
      <li><b>管理员可授权转让</b>：转让后对方成为管理员、自己转为普通用户 —— 系统内<b>始终只保留一个管理员</b>。</li>
      <li><b>账号名</b>：<b>非空 + 不重复</b>即可（不限制字符与长度）；<b>密码无格式要求、可为空</b>。</li>
      <li><b>停用 ≠ 删除</b>：停用 = 暂不可登录（可再启用）；<b>删除 = 软删除</b> —— 账号名保留、不销毁数据，历史留痕里的人名仍认得出来，必要时可恢复。</li>
      <li><b>防锁死（本页硬规则）</b>：<b>不能停用 / 删除「最后一个在用管理员」</b>；也<b>不能删除自己</b>。</li>
      <li><b>系统外一律不设账号</b>（§1.5.2）：项目端 / 会计 / 资产处 / 大领导 / 供应商 / 班组。<b>与业务字段联动</b>：付款流水操作人、调整单操作人、留痕「改前人」<b>统一取当前登录用户</b>。</li>
    </ul></details>
  <div class="card" style="margin-bottom:0"><h4>账号列表
    <span class="sp"><span class="mut sm">当前登录 <b>${esc(CUR.name)}</b>（${iAmAdmin?'管理员':'普通用户'}）· 在用 <b>${on.length}</b> · 停用 <b>${offN}</b> · 已删除 <b>${delN}</b></span></span>
    ${iAmAdmin?`<button class="btn" data-act="userTransfer">转让管理员</button>`:''}
    <button class="btn pri" data-act="userAdd" ${iAmAdmin?'':'disabled'} title="${iAmAdmin?'':'只有管理员可管理账号'}">＋ 新增账号</button>
    <button class="btn" data-act="logout">登出</button></h4>
    <div class="tw">${TBL({head:'<th>登录账号</th><th>姓名</th><th>角色</th><th>状态</th><th>最近登录</th><th>操作</th>',key:'m15:users',rows:[
    ...USERS.map(u=>`<tr class="${u.status==='在用'?'':'ex'}">
      <td class="fc">${esc(u.acc)}</td>
      <td>${esc(u.name)}${u.id===CUR.id?' <span class="mut sm">（当前登录）</span>':''}</td>
      <td>${u.role==='admin'?tag('管理员','vi'):tag('普通用户','in')}</td>
      <td>${u.status==='在用'?tag('在用','ok'):u.status==='已停用'?tag('已停用','wn'):tag('已删除','dg')}</td>
      <td class="now sm mut">${u.last?esc(u.last):'<span class="mut">从未登录</span>'}</td>
      <td class="ctr now">${u.status==='已删除'
        ? `<button class="btn sm" data-act="userRestore" data-id="${u.id}" ${iAmAdmin?'':'disabled'}>恢复</button>`
        : `<button class="btn sm" data-act="userPwd" data-id="${u.id}" ${iAmAdmin?'':'disabled'}>改密</button><button class="btn sm" data-act="userPwdView" data-id="${u.id}" ${iAmAdmin?'':'disabled'} title="查看明文密码（§1.5.1 明文裁定的显式出口）">看密码</button>
           <button class="btn sm" data-act="userToggle" data-id="${u.id}" ${(iAmAdmin&&!(u.status==='在用'&&lockAdmin(u)))?'':'disabled'} title="${lockAdmin(u)?'不能停用最后一个管理员':''}">${u.status==='在用'?'停用':'启用'}</button>
           ${u.id===CUR.id?'':`<button class="btn sm dg" data-act="userDel" data-id="${u.id}" ${(iAmAdmin&&!lockAdmin(u))?'':'disabled'} title="${lockAdmin(u)?'不能删除最后一个管理员':''}">删除</button>`}`}</td>
    </tr>`)]})}</div>
    <div class="bd"><div class="tip" style="margin:0"><b>为什么只有 2 个账号还要做这一页：</b>不是为了分权限（两人权限相同），而是为了让「<b>谁改的</b>」有出处 —— 留痕里的改前人、付款流水的操作人，都要能对到一个<b>真实账号</b>，而不是一个写死的名字。这也是本页与业务字段的<b>唯一接点</b>。</div></div>
  </div>`;
};

let busy=false;
const kvBlock=pairs=>`<div style="display:grid;grid-template-columns:118px 1fr;gap:6px 12px;font-size:12px;margin-bottom:13px">${pairs.map(([k,v])=>`<div class="mut">${k}</div><div>${v}</div>`).join('')}</div>`;
