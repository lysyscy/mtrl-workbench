<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>材料报表自动化工作台 · 交互原型（全模拟数据）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9; --sf:#fff; --sf2:#f8fafc; --bd:#e3e8ef; --bd2:#eef1f5;
  --tx:#1f2329; --tx2:#5c6675; --mut:#8b95a5;
  --pri:#2563eb; --pri-l:#eff5ff;
  --ok:#16a34a; --ok-l:#f0fdf4;
  --wn:#d97706; --wn-l:#fffbeb;
  --dg:#dc2626; --dg-l:#fef2f2;
  --in:#64748b; --in-l:#f1f5f9;
  --vi:#7c3aed; --vi-l:#f5f3ff;
  --r:8px; --r2:12px;
  --fs:'Microsoft YaHei','PingFang SC',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fm:ui-monospace,'Cascadia Mono',Consolas,monospace;
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--fs);font-size:13px;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;overflow:visible}

/* ---------- 侧栏 ---------- */
.sb{width:238px;flex:0 0 238px;background:#1e293b;color:#cbd5e1;display:flex;flex-direction:column;overflow-y:auto}
.sb-brand{padding:14px 16px 12px;border-bottom:1px solid #334155}
.sb-brand b{display:block;color:#fff;font-size:13.5px;font-weight:500;letter-spacing:.2px}
.sb-brand span{display:block;color:#7c8ba1;font-size:11px;margin-top:3px}
.sb-g{padding:10px 0 2px}
.sb-g>h5{padding:0 16px 6px;font-size:11px;color:#64748b;font-weight:400;letter-spacing:.6px}
.sb-i{display:flex;align-items:center;gap:8px;padding:6.5px 16px;cursor:pointer;font-size:12.5px;border-left:2.5px solid transparent;line-height:1.35}
.sb-i:hover{background:#273449;color:#fff}
.sb-i.on{background:#0f172a;color:#fff;border-left-color:var(--pri)}
.sb-i .c{font-family:var(--fm);font-size:10.5px;color:#64748b;flex:0 0 46px}
.sb-i.on .c{color:#60a5fa}
.sb-i.dis{color:#4b5563}   /* 「暂缓」= 语义标注，不是禁用：该项仍可点进 MOD-10 查看说明页 ⇒ 光标保持 pointer（不用 not-allowed，免得"看着点不动、其实能点"） */
.sb-i.dis:hover{background:none;color:#4b5563}
.sb-i .m{margin-left:auto;font-size:10px;color:#64748b}
.sb-foot{margin-top:auto;padding:10px 16px;border-top:1px solid #334155;font-size:10.5px;color:#64748b;line-height:1.6}

/* ---------- 主体 ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0}
.tb{height:54px;flex:0 0 54px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;padding:0 18px}
.tb h1{font-size:14.5px;font-weight:500}
.tb h1 em{font-style:normal;font-family:var(--fm);font-size:11px;color:var(--mut);margin-left:8px;font-weight:400}
.tb .sp{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tx2)}
.view{flex:1;overflow-y:auto;padding:14px 18px 40px}

/* ---------- 通用件 ---------- */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card>h4{padding:9px 13px;border-bottom:1px solid var(--bd2);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px;background:var(--sf2)}
.card>h4 .sp{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
.card .bd{padding:12px 13px}
.card .bd.np{padding:0}
.tip{background:var(--pri-l);border:1px solid #dbeafe;border-left:3px solid var(--pri);border-radius:6px;padding:8px 11px;font-size:12px;color:#1e40af;line-height:1.65;margin-bottom:10px}
.tip.wn{background:var(--wn-l);border-color:#fde68a;border-left-color:var(--wn);color:#92400e}
.tip.dg{background:var(--dg-l);border-color:#fecaca;border-left-color:var(--dg);color:#991b1b}
.tip.ok{background:var(--ok-l);border-color:#bbf7d0;border-left-color:var(--ok);color:#166534}
.tip b{font-weight:500}
.tip code{font-family:var(--fm);font-size:11px;background:#fff9;padding:1px 4px;border-radius:3px}
/* 可折叠的口径说明：默认收起，把纵向空间让给数据 */
details.tip>summary{cursor:pointer;font-weight:500;outline:none;list-style:none}
details.tip>summary::-webkit-details-marker{display:none}
details.tip>summary::before{content:'▸ ';color:var(--pri);font-size:11px}
details.tip[open]>summary::before{content:'▾ '}

/* 按钮 */
.btn{font-family:var(--fs);font-size:12px;padding:4.5px 11px;border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:6px;cursor:pointer;line-height:1.4;white-space:nowrap}
.btn:hover{border-color:#c4ccd8;background:var(--sf2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:#1d4ed8}
.btn.dg{color:var(--dg);border-color:#fecaca}
.btn.dg:hover{background:var(--dg-l)}
.btn.sm{padding:2.5px 7px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gost{border-style:dashed;color:var(--mut)}

/* 表格 */
/* 表格滚动容器：必须有高度上限，sticky 表头才「贴得住」。
   否则容器不滚动、整页滚动，表头会跟着一起滚走 —— 表现为「往下拖表头没了」。 */
.tw{overflow:auto;max-height:calc(100vh - 330px);min-height:260px}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
.dt th{position:sticky;top:0;z-index:2;background:var(--sf2);border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;font-weight:500;color:var(--tx2);white-space:nowrap;font-size:11.5px}
/* 「合计」行**统一置底**（2026-09-13 用户口径）：表头贴顶、合计行贴底 ⇒ 数据量大时不用滚到底才看得到（`sumRowOf` 产出的行带 `sumrow` 类）。
   ⭐⭐ **`position:sticky` 必须落在 `<tr>` 上 —— 写在 `>td` 上永不生效**（2026-09-16 修正）：
       `sticky` 作用在 `<td>` 时，它的**包含块是表格行**（行高 = 单元格高）⇒ **没有可位移的空间**。
       实测（真实浏览器 · 容器高 200px · 表内 30 行 · `scrollTop=0`，判据 = 「合计行底 − 容器底」）：
       `td` 写法 = **+792.5px**（合计行在屏幕外，**必须滚到底才看得见**）vs `tr` 写法 = **−1px**（吸附生效）。
       ⚠️ 它**不报错、不崩、只是不生效** ⇒ 只能靠实测抓出来；`_smoke` 的 N27 断言已按此收紧。
   ⚠️ `border-collapse:collapse` 下吸附行的**边框会丢** ⇒ 用 `box-shadow` 补上边线（故 `>td` 那条仍要保留）；
   ⚠️ 吸附行**必须有不透明底色**（否则数据行会透出来）⇒ 底色统一取 `var(--sf2)`（与既有合计行同色）。
   ⚠️ **分组表**（`MOD-07` 焊材/气体提取）不置底 —— 分组合计要紧贴本组，两行同 sticky 会重叠（由 `sumRowOf` 的 `sticky:false` 控制）。
       ⚠️ **不吸附 ≠ 不置底**：`sticky:false` 时合计行仍带 `data-pin`、仍钉在表尾、仍不参与排序。 */
.dt tbody tr.sumrow{position:sticky;bottom:0;z-index:2}
.dt tbody tr.sumrow>td{background:var(--sf2);box-shadow:inset 0 1px 0 var(--bd)}
.dt td{border-bottom:1px solid var(--bd2);padding:5px 8px;vertical-align:middle}
/* 分段竖线（`.vsep`）：`MOD-06` 表①② 按「总求和（本表）」的四段做**视觉分隔**（2026-09-13 用户口径）。
   ⚠️ 只加 `border-left`、颜色走 token（不写死色值 —— 内联样式无硬编码色值的断言对 class 同样成立）。 */
.dt th.vsep,.dt td.vsep{border-left:2px solid var(--bd)}
.dt tbody tr:hover{background:#fafbfc}
.dt tbody tr.hl{background:var(--wn-l)}
.dt tbody tr.hl:hover{background:#fef3c7}
.dt tbody tr.ex{color:var(--mut);background:#fafafa}
.dt tbody tr.ex td{text-decoration:line-through;text-decoration-color:#d4d4d4}
/* ⭐ i8 已撤单行（§4.2.7）：与「剔除」同行样式（.ex），但**左侧加一道警示竖条**，
   并把删除线关掉 —— 撤单不等于"作废的错数据"，它是"源单被删、保留可查"，故只加标识不划掉。
   ⚠️ 有牵涉（ntVoidJoint）时该行**仍算有效**（留在统计里），故本类只表达"来源"，不表达"退出统计"。 */
.dt tbody tr.ntvoid{box-shadow:inset 3px 0 0 var(--wn);background:#fffbf5}
.dt tbody tr.ntvoid:hover{background:#fef3c7}
.dt tbody tr.ntvoid td{text-decoration:none}
.dt tbody tr.ntvoid .fl{background:#fffbf5}
.dt tbody tr.pick{background:var(--pri-l)}
.dt tbody tr.pick:hover{background:#dbeafe}
.dt tbody tr.sel{background:#e0e7ff}
.dt .num{text-align:right;font-family:var(--fm);font-size:12px;white-space:nowrap}
.dt .ctr{text-align:center}
.dt .now{white-space:nowrap}
.dt.cond td,.dt.cond th{padding:4.5px 7px;font-size:12px}
.fl{position:sticky;left:0;background:var(--sf);z-index:1}
.dt tbody tr:hover .fl{background:#fafbfc}
.dt tbody tr.hl .fl{background:var(--wn-l)}
.dt tbody tr.ex .fl{background:#fafafa}

/* 标签 */
.tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;line-height:1.55;white-space:nowrap;border:1px solid transparent}
.t-pri{background:var(--pri-l);color:#1d4ed8;border-color:#dbeafe}
.t-ok{background:var(--ok-l);color:#15803d;border-color:#bbf7d0}
.t-wn{background:var(--wn-l);color:#b45309;border-color:#fde68a}
.t-dg{background:var(--dg-l);color:#b91c1c;border-color:#fecaca}
.t-in{background:var(--in-l);color:#475569;border-color:#e2e8f0}
.t-vi{background:var(--vi-l);color:#6d28d9;border-color:#ddd6fe}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.d-ok{background:var(--ok)}.d-wn{background:var(--wn)}.d-dg{background:var(--dg)}.d-in{background:var(--in)}.d-pri{background:var(--pri)}.d-vi{background:var(--vi)}

/* 表单/行内编辑 */
select.inp,input.inp,textarea.inp{font-family:var(--fs);font-size:12px;padding:3px 6px;border:1px solid var(--bd);border-radius:5px;background:#fff;color:var(--tx);width:100%}
input.inp.num{text-align:right;font-family:var(--fm)}
input.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px #dbeafe}
input.inp[readonly]{background:var(--sf2);color:var(--tx2);border-style:dashed;cursor:not-allowed}
.ed{background:#fffbeb!important;border-color:#fcd34d!important}
.plain{border:1px solid transparent;background:transparent}
.plain:hover{border-color:var(--bd);background:#fff}
/* ---------- 活动大表手填项（MOD-07 · OPEN-05「上次值带入」）----------
   带入态 = 输入框黄底（复用 .ed）+ 左上角「↺07月」来源标记；本月已录入则白底无标记。 */
.dt td.bigc{position:relative}
.dt td.bigc .ctag{position:absolute;left:5px;top:2px;font-size:9.5px;font-style:normal;color:var(--wn);pointer-events:none}
.dt td.bigc .inp{padding-left:28px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:10px 13px;border-bottom:1px solid var(--bd2);background:var(--sf2)}
.fbar .fi{display:flex;flex-direction:column;gap:3px}
.fbar .fi>label{font-size:10.5px;color:var(--mut)}
.fbar .fi input,.fbar .fi select{min-width:112px;width:auto}
.chk{width:13px;height:13px;cursor:pointer;vertical-align:-2px}
/* ---------- 表头点击排序（数据列表，见 applySorts）----------
   三态：升序 ▲ → 降序 ▼ → 原序 ↕（可反复切换，同一时刻只有一列生效）。
   当前排序列常显且用主色；其余可排序列淡灰，鼠标移上去变深。 */
.dt th.srt{cursor:pointer;-webkit-user-select:none;user-select:none}
.dt th.srt:hover{background:#e9eef5;color:var(--tx)}
.dt th.srt .sind{font-size:10.5px;color:#c9d0da;margin-left:3px}
.dt th.srt:hover .sind{color:var(--mut)}
.dt th.srt.on,.dt th.srt.on .sind{color:var(--pri)}
/* 无障碍焦点框的**唯一出口**：凡「非按钮但可点」的元素，一律 加 `data-act` + `role="button"` + `tabindex="0"`，
   由这一条规则统一给焦点框、由文件末的 keydown 委托统一给「回车 / 空格」—— 两处都只写一遍。 */
[data-act][role="button"]:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px}
.kpi .k{font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:4px}
.kpi .v{font-size:19px;font-weight:500;font-family:var(--fm);margin-top:3px;letter-spacing:-.3px}
.kpi .s{font-size:11px;color:var(--mut);margin-top:2px}
.kpi.dg .v{color:var(--dg)}
.kpi.wn .v{color:var(--wn)}
.kpi.ok .v{color:var(--ok)}
.kpi.pri .v{color:var(--pri)}

/* 选中汇总条（付款通知书页：选中上下文指标 + 主操作合并为一条） */
.selbar{position:sticky;top:0;z-index:25;display:flex;align-items:center;background:var(--sf);
  border:1px solid var(--bd);border-radius:var(--r);padding:0 8px 0 15px;min-height:50px;margin-bottom:12px;
  box-shadow:0 1px 2px #0f172a12}
.selbar .m{display:flex;flex-direction:column;gap:2px}
.selbar .m .k{font-size:11px;color:var(--mut);line-height:1.15;white-space:nowrap}
.selbar .m .v{font-family:var(--fm);font-size:14.5px;font-weight:500;line-height:1.2;letter-spacing:-.2px;white-space:nowrap}
.selbar .dv{width:1px;height:26px;background:var(--bd2);margin:0 16px}
.selbar .act{margin-left:auto;display:flex;align-items:center;gap:10px}

/* 迷你条 */
.bars{display:flex;flex-direction:column;gap:6px}
.bars .br{display:flex;align-items:center;gap:9px;font-size:12px}
/* 迷你条标签 = **项目名**（看板仓库条 / 按项目看欠款 / 付款统计按项目）⇒ 与表格列同一条规则：
   **一律不截断**（超宽换行）。⚠️ 该截断只发生在 CSS 里 —— DOM 的文本始终是全文，
   行为式断言**测不出来**，所以 `_smoke` 另有一条"实现标记"断言直接扫整份文件。 */
.bars .br .nm{flex:0 0 176px;white-space:normal;overflow-wrap:anywhere;line-height:1.35;color:var(--tx2)}
.bars .br .tk{flex:1;height:13px;background:var(--sf2);border-radius:3px;overflow:hidden}
.bars .br .tk i{display:block;height:100%;background:var(--pri);border-radius:3px}
.bars .br .tk i.g{background:var(--ok)}.bars .br .tk i.r{background:var(--dg)}.bars .br .tk i.o{background:var(--wn)}.bars .br .tk i.v{background:var(--vi)}
.bars .br .vl{flex:0 0 108px;text-align:right;font-family:var(--fm);font-size:12px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:#0f172a66;display:flex;align-items:center;justify-content:center;z-index:90;padding:24px}
.modal{background:#fff;border-radius:10px;box-shadow:0 12px 32px #0f172a2e;width:100%;max-width:640px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide{max-width:940px}
.modal h3{padding:12px 16px;border-bottom:1px solid var(--bd);font-size:13.5px;font-weight:500;display:flex;align-items:center}
.modal h3 .x{margin-left:auto;cursor:pointer;color:var(--mut);font-size:17px;line-height:1;padding:0 3px}
.modal h3 .x:hover{color:var(--dg)}
.modal .mb{padding:14px 16px;overflow-y:auto}
.modal .mf{padding:10px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;background:var(--sf2)}
.fld{margin-bottom:11px}
.fld>label{display:block;font-size:11.5px;color:var(--tx2);margin-bottom:4px}
.fld>label b{color:var(--dg);font-weight:400}
.fld .hint{font-size:11px;color:var(--mut);margin-top:3px;line-height:1.6}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:112px 1fr;gap:6px 10px;font-size:12px}
.kv dt{color:var(--mut)}
.kv dd{font-family:var(--fm)}

/* 提示条 */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:9px 18px;border-radius:8px;font-size:12.5px;z-index:120;box-shadow:0 8px 22px #0f172a3d;max-width:70vw;line-height:1.5}
.toast b{color:#93c5fd;font-weight:500}

/* 其他 */
.mut{color:var(--mut)}.sm{font-size:11.5px}.fc{font-family:var(--fm)}
.hr{height:1px;background:var(--bd2);margin:11px 0}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:2px 9px;font-size:11.5px;color:var(--tx2)}
.steps{display:flex;gap:0;margin:4px 0 12px}
.steps .st{flex:1;padding:7px 10px;background:var(--sf2);border:1px solid var(--bd);border-right:0;font-size:11.5px;color:var(--tx2);text-align:center}
.steps .st:first-child{border-radius:6px 0 0 6px}
.steps .st:last-child{border-radius:0 6px 6px 0;border-right:1px solid var(--bd)}
.steps .st.on{background:var(--pri-l);color:#1d4ed8;font-weight:500;border-color:#bfdbfe}
.steps .st.dn{background:var(--ok-l);color:#15803d}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);padding:0 13px;background:var(--sf2)}
.tabs .tb2{padding:8px 14px;font-size:12.5px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs .tb2:hover{color:var(--tx)}
.tabs .tb2.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:500}
.tabs .tb2 .n{font-family:var(--fm);font-size:10.5px;color:var(--mut);margin-left:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1180px){.grid2,.grid3{grid-template-columns:1fr}}
.flowline{font-family:var(--fm);font-size:11.5px;line-height:1.85;background:var(--sf2);border:1px solid var(--bd2);border-radius:6px;padding:10px 13px;white-space:pre;overflow-x:auto;color:#334155}
.link{color:var(--pri);cursor:pointer;text-decoration:none;border-bottom:1px dashed #93c5fd}
.link:hover{color:#1d4ed8;border-bottom-style:solid}

</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="sb-brand">
      <b>材料报表自动化工作台</b>
      <span>交互原型 · 全模拟数据</span>
    </div>
    <div id="nav"></div>
    <div class="sb-foot">
      数据全部为虚构模拟值<br>仅用于确认交互与口径<br><span style="color:#475569">口径来源：《材料科业务全流程说明书》</span>
    </div>
  </aside>
  <main>
    <div class="tb">
      <h1 id="ttl">—</h1>
      <div class="sp">
        <span class="pill" id="who"></span>
      </div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>
<script>
/* =====================================================================
   0. 全局说明

function _colType(vals){
  let n=0,d=0,t=0;
  vals.forEach(v=>{ if(v==='')return; t++; if(_date(v)) d++; else if(_num(v)!==null) n++; });
  if(!t) return 'text';
  if(d/t>=0.7) return 'date';
  if(n/t>=0.7) return 'num';
  return 'text';
}
function _cmp(a,b,t,dir){
  const ea=(a===''), eb=(b==='');
  if(ea&&eb) return 0;
  if(ea) return 1;                                      /* 空值恒排最后，不随升降序翻转 */
  if(eb) return -1;
  let r;
  if(t==='num'){const x=_num(a),y=_num(b); r=(x===null?0:x)-(y===null?0:y);}
  else if(t==='date') r=(a<b?-1:(a>b?1:0));
  else r=String(a).localeCompare(String(b),'zh-Hans-CN');
  return dir*r;
}
/* 主函数：scope 用于给表编稳定键（同一视图同一位置 = 同一张表） */
function applySorts(html,scope){
  let n=0;
  return String(html).replace(/<table\b[^>]*>[\s\S]*?<\/table>/gi,tbl=>{
    const open=tbl.match(/^<table\b[^>]*>/i); if(!open) return tbl;
    if(!/\sdata-sort[\s>]/.test(open[0])) return tbl;   /* ⚠️ 必须**精确匹配 `data-sort` 属性本身**：原来的 `\bdata-sort\b`
                                                           会把 `data-sort-key` 也算成"可排"（`-` 是词边界）⇒ 只声明 key 想表达
                                                           "可排但用稳定键"会被误判；而**刻意不可排**的表（如 `MOD-07` 焊材/气体提取的
                                                           分组表）只写 key 就会被注入排序入口、合计行还会被 pin 到表尾。 */
    const body=tbl.slice(open[0].length, tbl.lastIndexOf('</table>'));
    if(/<table\b/i.test(body)) return tbl;                        /* 嵌套表跳过，避免误伤 */
    const thead=body.match(/<thead\b[^>]*>[\s\S]*?<\/thead>/i);
    const tbody=body.match(/<tbody\b[^>]*>[\s\S]*?<\/tbody>/i);
    if(!thead||!tbody) return tbl;
    const idx=n++;
    /* 表的**身份**优先取它自己声明的 `data-sort-key`（稳定 · 与表在页面里的位置无关）；
       没声明才回退「scope + 出现次序」—— 回退键会随表的位置漂移（加一张表就把后面的键全冲掉），
       因此**新表一律声明 `data-sort-key`**，回退分支只为兼容保留。
       ⚠️ 别混用两个名字：`data-sort-key`（**表**声明 · 输入）≠ `data-tk`（th 上的运行时键 · 输出）。 */
    const decl=open[0].match(/\bdata-sort-key="([^"]*)"/i);
    const key=decl?decl[1]:(scope+'#'+idx);
    const ths=[...thead[0].matchAll(/<th\b([^>]*)>([\s\S]*?)<\/th>/gi)];
    if(ths.length<2) return tbl;
    const can=ths.map(th=>(/\bdata-nosort\b/.test(th[1])||/<input\b/i.test(th[2]))?false:!NOSORT_COL[_plain(th[2])]);
    const st=SORT[key]||(SORT[key]={i:-1,d:0});
    const tbOpen=tbody[0].match(/^<tbody\b[^>]*>/i)[0];
    const tbInner=tbody[0].slice(tbOpen.length, tbody[0].lastIndexOf('</tbody>'));
    const rows=tbInner.match(/<tr\b[^>]*>[\s\S]*?<\/tr>/gi)||[];
    const pin=[],data=[];
    rows.forEach(r=>{
      const tdc=(r.match(/<td\b/gi)||[]).length;
      /* ⭐ 2026-09-13 增行模式：草稿行（`tr.draftrow`）与「合计行 / 跨列行」走**同一条 pin 通道** ——
         钉表尾、不参与排序、不参与取值。
         ⚠️ 必须**锚在行首那个 `<tr>` 标签的 class 上**，不能靠"`<td>` 数 < 表头列数" ——
            `MOD-03` 的草稿行是**列对齐行**（`<td>` 数 = 列数），那条判据**保不住它**（实测推演）。 */
      const openTag=(r.match(/^<tr\b[^>]*>/i)||[''])[0];
      if(/\bdraftrow\b/.test(openTag)||/合计|总计|小计/.test(_plain(r))||tdc<ths.length) pin.push(r); else data.push(r);
    });
    let out=data;
    if(st.i>=0&&st.d!==0&&can[st.i]&&data.length>1){
      const vals=data.map(r=>_cellRaw((r.match(/<td\b[^>]*>[\s\S]*?<\/td>/gi)||[])[st.i]));
      const tp=_colType(vals);
      out=data.map((r,k)=>({r,v:vals[k]})).sort((a,b)=>_cmp(a.v,b.v,tp,st.d)).map(o=>o.r);
    }
    /* 表头：注入 class / 点击动作 / 排序指示器 */
    const newTh=ths.map((th,k)=>{
      if(!can[k]) return '<th'+th[1]+'>'+th[2]+'</th>';
      const on=(st.i===k&&st.d!==0);
      let a=th[1];
      a=/\bclass="/.test(a)?a.replace(/\bclass="([^"]*)"/,(m,c)=>'class="'+c+' srt'+(on?' on':'')+'"'):a+' class="srt'+(on?' on':'')+'"';
      a+=' data-act="headSort" data-tk="'+key+'" data-i="'+k+'" tabindex="0" role="button" title="点击排序：升序 → 降序 → 原序"';
      return '<th'+a+'>'+th[2]+'<span class="sind">'+(on?(st.d>0?'▲':'▼'):'↕')+'</span></th>';
    }).join('');
    const newHead=thead[0].match(/^<thead\b[^>]*>/i)[0]
      +(thead[0].match(/<tr\b[^>]*>/i)||['<tr>'])[0]+newTh+'</tr></thead>';
    return open[0]+newHead+tbOpen+out.concat(pin).join('\n')+'</tbody>'+tbl.slice(tbl.lastIndexOf('</tbody>')+8);
  });
}

const tmBtn=(id,cfg)=>`<div class="mpwrap" style="position:relative;display:inline-block">

const tmParse=v=>{ v=String(v==null?'':v);

  if(/^\d{4}-\d{2}~\d{4}-\d{2}$/.test(v)) return {mode:'跨月',y:+v.slice(0,4),a:v.slice(0,7),b:v.slice(8,15)};
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return {mode:'周',y:+v.slice(0,4),mon:v};

const tp2=n=>String(n).padStart(2,'0');

const tmQof=d=>{ const t=new Date(d+'T00:00:00'); return t.getFullYear()+'Q'+(Math.floor(t.getMonth()/3)+1); };

      ${md==='季度'?D('mpPick',{id:id,scope:sc,val:tmQNow(),m:'季度'},'','本季'):''}
      ${md==='周'?D('mpPick',{id:id,scope:sc,val:wkMon(SYS_TODAY),m:'周'},'','本周'):''}

/* ---------- 自定义排序（2026-09-13 用户口径）----------
   排序主体 = **档案行**（说"项目排序"其实是**仓库排序**：仓库名 = 唯一标识，§9.8-4）。
   ⇒ **全名 / 仓库名 / 展示名**只是同一条档案行的三种叫法，统一按"该值定位到的档案行的 ord"排。
   优先级：**归档后置** > **ord** > （ord 相同则保持原顺序，`Array#sort` 稳定）。 */
const ORD_MAX=99999;
const ordOf=p=>{ const n=Number(p&&p.ord); return isFinite(n)?n:ORD_MAX; };
/* 按值定位档案行：全名 / 仓库名 / 展示名 任一命中；壳全名优先命中**壳**那一行（不是它的小微） */
const pjRowByVal=v=>PJs.find(p=>p.type==='shell'&&p.full===v)||PJs.find(p=>p.full===v||p.name===v||p.disp===v)||null;
const pjRowOf=x=>{ if(x==null) return null;
  if(typeof x==='string') return pjRowByVal(x);
  if(PJs.indexOf(x)>=0) return x;                                  /* 本身就是档案行 */
  return pjRowByVal(x.full)||pjRowByVal(x.name)||pjRowByVal(x.disp)||null; };   /* 仓库表这类"带名字但不是档案行"的对象 */
const cmpPj=(a,b)=>{ const ra=pjRowOf(a), rb=pjRowOf(b);
  const d=(ra&&arcOf(ra)?1:0)-(rb&&arcOf(rb)?1:0); if(d) return d;
  return ordOf(ra)-ordOf(rb); };
const pjSort=arr=>arr.slice().sort(cmpPj);
/* 重编号：按当前顺序（归档后置 → ord → 稳定）重新赋 1..N，保证**连续无重复** */
const pjSortedAll=()=>PJs.slice().sort(cmpPj);
const renumberPj=()=>{ let i=1; pjSortedAll().forEach(p=>{ p.ord=i++; }); };
const ARC_TEXT='（已归档）';   /* <select> 的 option 里只能用纯文本 */
const arcTag=()=>'<span class="tag t-in" title="该项目已归档：仍可被选中（数据不锁、状态随时可改回在建），只是各处默认筛选不显示它">已归档</span>';

/* ===== 项目候选的「键」与「显示」—— **全站唯一出口**（2026-09-13 用户口径）=====
   ⭐ **键 = 仓库名**（`ENT-01.name`：**唯一、不允许人工修改**，§9.8-4「仓库名不可人工修改」）
      —— **不得用「项目全名」当候选键**：全名**可人工修改**、且**壳与具体小微共用同一全名**（§2.2）。
   ⭐ **显示 = 展示名**（`pjDisp`：展示名 → 仓库名 → 空）。
   ⚠️ **小微壳没有仓库 ⇒ 不进任何项目候选**（与「壳本身没有付款单据」同一条链）；
       **未判定归属的行落不到任何仓库名 ⇒ 只在「全部项目」下可见**
       （真实系统里不会出现：归属未走完 ⇒ **整批不入库**，《设计规则》§四-7 · 《实施计划》§三 链路 C）。
   ⚠️ **写库一律仍按档案 id**（§9.8-5「按 id 不按名」）—— 「键 = 仓库名」管的是**给人选 / 给人筛**这一层，
      两者不冲突：仓库名可人工改？**不可以**（§9.8-4），但 id 更硬、且弹窗回传用 id 更安全。 */
const pjKey=p=>(p&&p.name)||'';                                  /* 档案行 → 候选键（仓库名）；壳 → '' */
const pjLabel=v=>{ const p=pjRowOf(v); return p?pjDisp(p):String(v==null?'':v); };   /* 候选键 → 显示文字（展示名） */
const pjKeysOfRows=rows=>pjSort([...new Set(rows.map(r=>pjKey(r)).filter(Boolean))]); /* 档案行集合 → 去重排序的候选键 */
const pjRowsWithKey=rows=>pjSort(rows.filter(p=>pjKey(p)));      /* 剔除壳（无仓库名）后按 归档后置 > ord 排 */
const matchKids=(full,doc)=>{ const sh=shellOf(full); if(!sh) return [];
  return kidsAll(sh.id).filter(p=>kwList(p.kw).some(w=>doc.indexOf(w)>=0)); };
/* 取归属（只读、无副作用）：已指定 > 普通项目全名唯一 > 壳下唯一命中 > null（待指定） */
const ownOf=n=>{
  if(!n) return null;
  if(OWN[n.id]){ const p=PJs.find(x=>x.id===OWN[n.id]); if(p) return p; }
  if(!isShellFull(n.proj)) return PJs.find(p=>p.full===n.proj)||null;
  const hit=matchKids(n.proj,n.doc); return hit.length===1?hit[0]:null;
};
/* 弹窗候选 = 该壳下的**全部**小微（**含归档**、归档排最后）—— 与自动归集**同一份清单**（`kidsAll`） */
const ownCands=n=>{ const sh=shellOf(n.proj); return sh?kidsAll(sh.id):[]; };
/* 关键词去重追加（决策 3/4）：词已存在则不重复追加 */
const addKw=(pid,w)=>{ const p=PJs.find(x=>x.id===pid); if(!p) return false;
  w=(w||'').trim(); if(!w) return false;
  const cur=kwList(p.kw); if(cur.indexOf(w)>=0) return false;
  p.kw='|'+cur.concat([w]).join('|')+'|'; return true; };

/* 展示名解析：**优先按【归属 id】取**；取不到才回退（禁止按全名反查猜） */
function dispCell(full,n){
  const ow=ownOf(n);
  if(ow) return esc(pjDispOr(ow,'—'));
  const m=projMatches(full);
  if(!m.length) return '<span class="tag t-dg" title="档案里没有该全名 → 触发自动建档（链路 A）">未建档</span>';
  if(m.length===1) return esc(pjDispOr(m[0],'—'));
  /* 壳全名 + 归属未判定 → 「待指定」：**可点**去指定（无行上下文时只提示、不可点） */
  if(!n) return `<span class="tag t-wn" title="该全名对应 ${m.length} 条档案（1 个壳 + ${m.length-1} 个具体小微共享同一全名）。系统禁止用全名反查，写操作一律按 id 定位，需先指定具体小微">壳下 ${m.length-1} 个小微 · 待指定</span>`;
  return `<span class="tag t-wn" data-act="ownOpen" data-id="${n.id}" tabindex="0" role="button" style="cursor:pointer" title="该全名对应 ${m.length} 条档案（1 个壳 + ${m.length-1} 个具体小微共享同一全名）→ 点此指定它属于哪个具体小微">壳下 ${m.length-1} 个小微 · 待指定</span>`;
}
/* 项目筛选候选项 = **能定位到仓库的项目（含归档）**；归档项排最后并标注（2026-09-13 用户口径）。
   ⭐ **键 = 仓库名**（§2.7.4）：由「归属档案行」取 `name` ⇒ **壳不进候选**（没有仓库名）、
      **未判定归属的行也落不进来**（真实系统里本就不存在这种行：归属未走完 ⇒ 整批不入库）。
      未建档的全名同样不列。 */
const PROJ_LIST=()=>pjKeysOfRows(uniqBy(NO,n=>ownOf(n)));
/* 集采台账「项目」筛选的候选（2026-09-13 新增）—— = 集采合同 `proj` 去重（**键 = 仓库名**，§2.7.4）。
   ⚠️ 候选取自**合同自己带的值**、不取全站项目档案 —— 筛选要筛的是"这批合同里出现过的项目"，
      与 `PROJ_LIST()`（按通知书的归属档案行）是**不同的筛选条件**（§ 上方【候选来源索引】的既定做法）。
   ⚠️ 合同必有项目 ⇒ **不需要"未指定"档**。 */
const JC_PROJ_LIST=()=>pjSort(uniqBy(JCs,j=>j.proj));
/* 面板宽度 = 内容自适应（max-content）：既不留下大片空白，也不会把项目名截断。
   行内一律 nowrap，不做省略号 —— 名字必须完整可读。 */
/* 通用「项目面板」：MOD-03 / MOD-04 / **MOD-06** **共用一份实现**，cfg 决定
   项目列表 / 已选集合 / 动作名 / **标签怎么显示（meta）** / **能不能多选（`single`）**。
   ⭐ **三个调用点的候选键一律是「仓库名」**（§2.7.4），meta 一律用 `PROJ_META_KEY`
      ——「仓库名 → 展示名」这件事**只有这一处**要写。
   ⭐ `single` 是**由调用点声明**的能力开关（与 `tmBtn` 的 `modes` 同一套思路）：
      单选时渲染 `radio`（不是 checkbox）、**不渲染「全选 / 清空」**（多选才需要），
      并且**面板内不出现 `scope===xxx` 之类的分支**。
   选中值一律走 `data-pj`（含义 = 该面板的筛选键 = **仓库名**）。 */
const PROJ_META_KEY=v=>{ const p=pjRowOf(v);
  return { nm:p?pjDisp(p):'未建档', warn:!p, arc:arcOf(p), title:'仓库名：'+v }; };
const PROJ_META_FULL=v=>{ const m=projMatches(v);
  return { nm:m.length===1?pjDisp(m[0]):(m.length>1?`${m.length-1} 个小微（同一壳）`:'未建档'),
           warn:m.length!==1, arc:arcOfFull(v), title:'项目全名：'+v }; };
const projPanel=c=>{ const meta=c.meta||PROJ_META_FULL, single=!!c.single;
  return `<div style="position:absolute;z-index:80;top:calc(100% + 5px);left:0;width:max-content;min-width:178px;max-width:340px;max-height:264px;overflow-y:auto;overflow-x:hidden;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px #0f172a26;padding:5px">
  <div style="display:flex;gap:6px;align-items:center;padding:2px 4px 6px">
    ${single?'':`<button class="btn sm" data-act="${c.allAct}">全选</button><button class="btn sm" data-act="${c.noneAct}">清空</button>`}
    <span class="mut" style="font-size:11px;margin-left:4px;white-space:nowrap">${single?'单选 · ':''}已选 ${c.selected().length}/${c.list().length}</span>
  </div>
  ${c.list().map(v=>{const on=c.selected().includes(v), mt=meta(v);
    return `<label title="${esc(mt.title)}" style="display:flex;gap:7px;align-items:center;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:12px;white-space:nowrap">
      <input type="${single?'radio':'checkbox'}"${single?' name="projPanelSingle"':''} class="chk" style="flex:0 0 auto" data-act="${c.pickAct}" data-pj="${esc(v)}" ${on?'checked':''}>
      <span${mt.warn?' style="color:var(--wn)"':''}>${esc(mt.nm)}</span>${mt.arc?' '+arcTag():''}</label>`}).join('')}
</div>`; };
const pjPanel=()=>projPanel({list:PROJ_LIST,selected:()=>fNt.projs,allAct:'pjAll',noneAct:'pjNone',pickAct:'pjPick',meta:PROJ_META_KEY});

/* 筛选条件：选择器即时生效（不设独立的「应用筛选」按钮） */
let fNt={month:bjMonth(),cat:'全部',astat:'全部',stat:'未付清',projs:[]};   /* 年月默认「北京时间当月」；付款状态默认「未付清」 */
/* —— 「手动新增 / 编辑付款通知书」弹窗（2026-09-12 用户口径）——
   用途：付「期初占位行」的款 —— 那笔钱没有 i8 单据，只能手工补一行通知书。
   `naD` 是弹窗的**草稿层**：弹窗里的年月组件一改动就要重建弹窗，
   没有草稿层则重建时其它已填字段会被清空（本原型的既定教训，同 payDraft）。 */
let naD={};              /* 弹窗草稿：字段名 → 值（键与 NT_COLS 同名，另加 pid = 选中项目档案 id） */
let naEditId='';         /* '' = 新增；否则 = 正在编辑的手动行 id */
/* 纯函数：按筛选条件取命中行（供视图与自检共用）
   口径：年月 → 当月 1 号至末日、闭区间；项目可多选（空数组 = 全部项目）
   分类筛选的选项 = 辅材 / 机械 / 集采 / 剔除：
     · 「剔除」是标记不是业务分类（§4.2.2 标记保留、可筛选、不销毁数据），在筛选器里单列一项
     · 剔除行【默认不显示】—— 只有把分类显式切到「剔除」才看得到
       （§4.2.3：只有剔除后剩余的通知书才参与分类，故分类=全部时也不含剔除行）
     · ⭐「分类 = 剔除」= 「看剔除记录」的专用视图：**不受审批状态 / 付款状态筛选约束**
       （否则默认「付款状态 = 未付清」会把剔除行全部挡掉 → 切了也看不到，等于该视图失效） */
/* 项目筛选：候选键 = **仓库名**（§2.7.4），按**归属**命中（壳全名下的行拆到各自小微） */
const ntHit=f=>{ const ex=f.cat==='剔除';
  /* ⭐ 「分类 = 剔除」= 「看剔除记录」的专用视图，**同时承载两类行、按来源分档**：
     · 剔除行（`n.excl`）
     · **i8 已撤单行**（`ntVoid`）—— 用户口径 2026-09-14：撤单行**默认隐藏**，
       藏处 = 并进本视图（**不新增分类枚举值**），渲染时按来源给不同标签，两者不相混。 */
  const arch=n=>ex?(n.excl||ntVoid(n)):ntLive(n);
  return NO.filter(n=>tmIn(f.month,n.date)
    &&(!f.projs||!f.projs.length||f.projs.includes(ntProjKey(n)))
    &&arch(n)
    &&(ex||f.cat==='全部'||n.cat===f.cat)
    &&(ex||f.astat==='全部'||n.astat===f.astat)
    &&(ex||f.stat==='全部'||statOf(n)===f.stat)); };
/* 筛选变化后清理「已勾选」里不可见的行，避免出现选不中/看不见却被计入的幽灵勾选 */
const prunePick=()=>{ const vis=new Set(ntHit(fNt).map(n=>n.id)); [...pickSet].forEach(i=>{ if(!vis.has(i)) pickSet.delete(i); }); };

/* ---------- 手动新增 / 编辑付款通知书（2026-09-12 用户口径）----------
   场景：付「期初占位行」的款 —— 系统上线前那笔欠款**没有 i8 单据**，只能手工补一行通知书。
   用户拍板：① 行内一切信息都可手改（「编辑」走同一个弹窗）② 项目候选 = **全部已建档项目（含归档）**
   ③ 审批金额可改、默认 0 ④ **只对手动行**开放删除 ⑤ **统计结算金额恒 0 且只读** ⑥ 录入人 = 当前登录用户（§1.5.1）
   ⚠️ 全站口径「统计两金额 ≤ 审批金额」对手动行**同样有效**：要付 5 万，就把审批金额也填到 5 万
      （手动行没有 i8 结算，审批金额由人定；否则会被拦截）。 */
const ntPjList=()=>pjRowsWithKey(pjNoShell());   /* 壳本身没有付款单据（§六-9）⇒ 不进候选；一律走共性出口（归档后置 + ord 排序） */
const naNum=v=>{ const raw=String(v==null?'':v).trim(); return raw===''?0:N2(parseFloat(raw)); };
/* 单据日期默认 = 界面当前年月的 1 号（界面在「全部月份」时取北京时间当月）。日期用 `type="date"`，
   与既有 `ACT.jcAdd` 的「合同日期」同款 —— 需要的是**完整日期**（归月按它的 YYYY-MM），不是"选年月"。 */
const naDefDate=()=>tmStart(fNt.month)+'-01';
const ntBlank=()=>{ const L=ntPjList(), cur=ledCur();     /* 默认项目 = 欠款台账当前选中的项目（键 = 仓库名） */
  const pid=(L.find(p=>pjKey(p)===cur)||L[0]||{}).id||'';
  return {date:naDefDate(), code:'', pid, doc:'', biz:'', recv:'',
    cat:'辅材', astat:'已批', approve:'0', sp:'0', sup:''}; };
/* 「付款项目」候选：**值 = 仓库名**（§2.7.4）、**显示 = 展示名**；写库仍按档案 id（§9.8-5） */
const ntOpts=()=>pjSort(ntPjList()).map(p=>`<option value="${esc(p.name)}" ${naD.pid===p.id?'selected':''}>${esc(pjDisp(p))}${pjArcMark(p,1)}</option>`).join('');
/* ---------- 增行模式（2026-09-13 用户口径：**取消「手动新增 / 编辑」弹窗**，改**表内增行**）----------
   甲案（用户 2026-09-13 拍板）：**草稿行不落 `NO`**，只存**草稿层 `naD`**；`naEditId` 三态 =
     `''` = 无草稿 · `NT_NEW_ID`（哨兵 `'@new'`）= **新增中的草稿** · 真实 id = 正在**原地**编辑该手动行。
   ⇒ `NT_COLS` 一字不动 · 既有 `n.manual` 判据（6 处）不动 · 欠款 / 台账 / 合计 / 导出 / 全选可见集
     **全部天然不受影响**（它们只认 `NO`）。
   ⚠️ 草稿行是**列对齐行**（18 个 `<td>`）⇒ `applySorts` 原来的"`<td>` 数 < 表头列数"判据**保不住它**
      ⇒ 已给 `applySorts` 补一条 **`.draftrow` → 钉表尾**（与"合计行"同通道），见该函数。 */
const NT_NEW_ID='@new';                     /* 哨兵 id：新增中的草稿行（**不是** `NO` 的行） */
const ntDraftOn=()=>naEditId!=='';          /* 是否处于增行态（渲染草稿行的唯一判据） */
/* ⭐ 「点新增就把筛选放宽到能看见」—— 2026-09-13 用户口径：**从"保存后"前移到"点新增时"**。
   原逻辑在落库后才切年月 + 放宽三档；改增行后必须在**进入增行态**就放宽，否则用户填了一半
   才发现这一行在筛选之外看不见。⚠️ 「项目」筛选**一律不动**（既有口径）。
   ⚠️ 另有第二重保障：草稿行**无条件渲染**（不走 `ntHit`），即使筛选把它挡在外面也看得见。 */
const ntReveal=()=>{ fNt.month=String(naD.date||naDefDate()).slice(0,7);
  fNt.cat='全部'; fNt.astat='全部'; fNt.stat='全部'; prunePick(); };
/* 草稿行（**列对齐** 18 格 —— 逐列与 `NT_THEAD` 对齐；值取草稿层，不是 `NO` 的行） */
const ntDraftRow=()=>{ const d=naD, cat=d.cat||'辅材', isJc=cat==='集采';
  return `<tr class="draftrow">
    <td class="ctr"><span class="tag t-in" title="尚未保存 —— 填完点本行右侧「保存」落库；「取消」丢弃（草稿不入库，与弹窗的「取消」等价）">新增</span></td>
    <td><input class="inp" type="date" data-act="ntRowSet" data-k="date" value="${esc(d.date||'')}" title="单据日期（决定归月）"></td>
    <td><input class="inp" style="min-width:104px" data-act="ntRowSet" data-k="code" value="${esc(d.code||'')}" placeholder="单据编码"></td>
    <td><select class="inp" style="min-width:150px" data-act="ntRowSet" data-k="pid" title="付款项目（已建档项目 · 含归档、不含壳，§六-9）">${ntOpts()}</select></td>
    <td class="ctr"><select class="inp plain" style="width:auto" data-act="ntRowSet" data-k="cat">${optsOf(enumVals('cat'),cat)}</select></td>
    <td><input class="inp" style="min-width:120px" data-act="ntRowSet" data-k="doc" value="${esc(d.doc||'')}" placeholder="单据名称"></td>
    <td><input class="inp" style="min-width:96px" data-act="ntRowSet" data-k="biz" value="${esc(d.biz||'')}" placeholder="业务类型"></td>
    <td><input class="inp" style="min-width:110px" data-act="ntRowSet" data-k="recv" value="${esc(d.recv||'')}" placeholder="收款单位"></td>
    <td><input class="inp plain" style="min-width:132px" data-act="ntRowSet" data-k="sup" value="${esc(d.sup||'')}" placeholder="${isJc?'人工录入':'仅集采可填'}" ${isJc?'':'readonly'}></td>
    <td class="sm">${esc(CUR.name)}</td>

/* ===== 列定义 → 表头 / 空态跨列数（阶段 4 · **试点：只接 m03**）=====
   原先"表头 / 每行 `<td>` / 空态行 `colspan`"三处各写一遍 ⇒ **加一列要改三处**。
   其中 `colspan` 是最阴的一处：它是**写死的数字副本**，漏改不会有任何检查器报红，
   只会表现为"空态那一行没铺满表格"（视觉 bug，没人测）。
   ⇒ 把**表头抽成唯一出处**（`NT_THEAD`），**跨列数由它算**（`thCount`）—— 加列时不可能忘记改 colspan。
   ⚠️ 每行的 `<td>` 仍逐行写：值各不相同，收不了（这是**数据**，不是结构）。
   ⚠️ 表头 HTML **一字不改**（只搬进常量）—— `applySorts` 靠表头文本判列类型与可排性，改一个空格都可能改行为。 */
const thCount=h=>(String(h).match(/<th\b/g)||[]).length;   /* 一张表有几列 —— 从表头数出来，不写死 */
/* ⚠️ **表头有几「列」**（不是有几个 `<th>`）—— **两行表头**时两者不等：活动大表 `<th>` 共 23 个，而**列数是 20**
   （`rowspan` / `colspan` 各只占 1 个 `<th>`）⇒ `thCount` 会把列数**多算**、合计行就会多出几个空 `<td>`，
   而"列对齐"断言**跳过含「合计」的行** ⇒ **完全静默**（2026-09-13 迁移大表时实测踩到，靠新断言才抓出）。
   正确算法 = **首行表头的 `colspan` 累加**（与 §六「列对齐」断言同一套）。 */
const thCols=h=>{ const s=String(h);
  const th=((s.match(/<thead\b[^>]*>([\s\S]*?)<\/thead>/i)||['',s])[1]);
  const row=((th.match(/<tr\b[^>]*>[\s\S]*?<\/tr>/i)||[th])[0]);
  return (row.match(/<th\b[^>]*>[\s\S]*?<\/th>/gi)||[]).reduce((a,x)=>a+(+((x.match(/colspan="(\d+)"/)||[0,1])[1])),0); };

/* —— 「表内合计行」的**唯一出口**（2026-09-13 用户口径：求和一律落在**表内**、与所有表同款）——
   声明式：`sums` = { 列下标: 取值函数 } 或 { 列下标: [取值函数, 格式化函数] }；列数从**表头常量**派生（`thCount`）
   ⇒ 合计行的 `<td>` 数恒 = 表头列数（不可求和的列给空 `<td>`，与空态行同一个列数出口）。
   行首格写 `lead`（默认「合计」）⇒ `applySorts` 会把含「合计」的行**钉在表尾**，天然不被排序卷走。
   `opt` 一览（⚠️ **每一项都有真实调用点，不是预留** —— 2026-09-13 把 10 处既有合计行迁进来时定的）：
     · `lead` 首格内容（**可含 HTML**；默认 `合计`）
     · `leadSpan` 首格 `colspan`（默认 1）—— `MOD-05` 台账 / 流水、`MOD-07` 大表 用它把标签压在前置列上
     · `leadCls` 首格 class（默认无）—— `MOD-05` 两处合计的标签是**居中**（`ctr`）
     · `cells` { 列下标: **整格 HTML** }：非数值格（如收发结存末列的「校验」状态 tag）；与 `sums` 互斥使用
     · `style` 行内样式（默认 `background:var(--sf2);font-weight:500`；`MOD-05` 两处与集采子表传自己的）
     · `tip` 首格 `title`
     · `sticky` 是否带**置底**标记（默认 `true`）—— **分组表**（`MOD-07` 焊材/气体提取）传 `false`
       （分组合计要紧贴本组；两行同时 sticky 会重叠）
   ⚠️ **不要在视图里内联求和**；要加合计就调这里（与 `thCount` / `pjDisp` 同一套「唯一出口」思路）。 */
const sumRowOf=(thead,rows,sums,opt={})=>{
  const n=thCols(thead), span=Math.max(1,opt.leadSpan||1), cells=opt.cells||{};
  const lead=opt.lead===undefined?'合计':opt.lead;
  const style=opt.style===undefined?'background:var(--sf2);font-weight:500':opt.style;
  const tds=[];
  for(let i=0;i<n;){
    if(i===0){ tds.push(`<td${span>1?` colspan="${span}"`:''}${opt.leadCls?` class="${opt.leadCls}"`:''}${opt.tip?` title="${esc(opt.tip)}"`:''}>${lead}</td>`); i=span; continue; }
    if(cells[i]!=null){ tds.push(cells[i]); i++; continue; }
    const s=sums[i];
    if(s==null){ tds.push('<td></td>'); i++; continue; }
    const f=Array.isArray(s)?s[0]:s, fmt=Array.isArray(s)?(s[1]||M):M;
    tds.push(`<td class="num">${fmt(f(rows))}</td>`); i++;
  }
  return `<tr${opt.sticky===false?'':' class="sumrow"'}${style?` style="${style}"`:''}>${tds.join('')}</tr>`;
};

const jcLinkCands=n=>{ const k=ntProjKey(n), cur=jcRefOf(n.id), sup=String(n.sup||'').trim();
  let list=JCs.filter(j=>j.proj===k);
  if(sup) list=list.filter(j=>String(j.supplier||'').trim()===sup);
  return (cur&&list.indexOf(cur)<0)?list.concat([cur]):list; };
/* MOD-03「集采实际供应商」列内的关联区（入口就近放该列 —— 它本就是这行集采单据的专属格） */
const jcLinkCell=n=>{ const j=jcRefOf(n.id);

/* ===== 集采供应商自动匹配（§6.6.3 · `DEV-J-01` 2026-09-14 改裁）=====
   ⚠️ **反着匹配**：不是"先从单据名里切出简称、再拿去比全名"，而是 **拿候选池去探测单据名** ——
      因为单据名格式不受约束，**"简称在哪、多长"事先不可知**，只能反过来试。
   候选池 = 本项目（仓库名 = 该行归属档案行，`ntProjKey`）集采合同的「供应商」去重（按全名）。
   探测等级（先长后短，取**命中的最高等级**那一批）：① 全名整体 ② 4 字片段 ③ 3 字片段 ④ 2 字片段。
   ⚠️ 准确**不靠算法**、靠"多命中必须问人"这道闸 —— 假阳性的代价只是**多问一次**，不会填错。 */
const SUP_LVL_NAME=['','全名','4 字片段','3 字片段','2 字片段'];
/* 候选池：本项目已有供应商（按**全名去重** —— 同一供应商多份合同不重复计数，否则一家被数成多家） */
const supPool=n=>{ const k=ntProjKey(n); const seen=new Set(); const out=[];
  JCs.forEach(j=>{ if(j.proj===k){ const s=String(j.supplier||'').trim(); if(s&&!seen.has(s)){ seen.add(s); out.push(s); } } });
  return out; };
/* 全名 → 该等级的连续片段（level=1 全名整体；否则**定长滑窗**：②4 字 · ③3 字 · ④2 字）
   ⚠️ **片段长度 = 6 − level**（2→4 / 3→3 / 4→2）—— 写错这里会**静默改变等级语义**
   （曾写成 `level+2` ⇒ ③ 变 5 字、④ 变 6 字，等级越高片段越长 ⇒ 探测顺序失去意义）。
   长度不足（全名比片段还短）⇒ 返回空，该等级天然不可能命中。 */
const supFrags=(full,lvl)=>{ if(lvl===1) return [full];
  const len=6-lvl; if(full.length<len) return [];
  const out=[]; for(let i=0;i+len<=full.length;i++) out.push(full.slice(i,i+len)); return out; };
/* 探测单据名：返回命中集（按命中等级最高的一批）；`lvl` = 该批次等级，`cands` = 该批供应商全名 */
const supMatch=n=>{ const doc=String(n.doc||''); if(!doc) return {lvl:0,cands:[]};
  const pool=supPool(n);
  for(let lvl=1;lvl<=4;lvl++){
    const hit=pool.filter(full=>supFrags(full,lvl).some(f=>doc.indexOf(f)>=0));
    if(hit.length) return {lvl,cands:hit};               /* 先长后短：高等级一命中就返回，低等级一律不看 */
  }
  return {lvl:0,cands:[]}; };
/* 待确认标记（**不静默落库**）：id → 自动预填值。点「确认」才转正式值；改一次、重抓、改分类都清 */
const SUP_SUG={};
/* MOD-03 自动化入口按钮（放在「集采实际供应商」列内，与关联区同格） */
const supAutoCell=n=>{ const s=SUP_SUG[n.id];

const supHas=n=>Object.prototype.hasOwnProperty.call(SUP_SUG,n.id);

/* ===== 再次导入的合并策略（§4.2.7 · 2026-09-14 用户拍板「方案乙」）=====
   问题：i8 导入后单据被改动（审批金额改了 / 单据撤了），再次导入会发生什么？
   ⚠️ 先纠正一个易错读法：§4.2.5 里「审批金额 / 付款金额（源）—— ✗ 不被覆盖（源数据）」
      **真实含义是"不被人工改覆盖"，不是"不被 i8 覆盖"** —— i8 的新值必须落到这两个源字段上，
      否则再次导入就等于没抓（用户会以为系统坏了）。
   ⇒ 于是**真正的风险不在源字段，而在"跟着源字段长的旁路字段"**：
      「统计结算金额 / 统计付款金额」的上限 = 审批金额（全站铁律「统计两金额 ≤ 审批金额」），
      一旦审批金额被 i8 **调小**，人工填过的统计值就可能**越界** —— 而这条铁律的拦截
      只发生在"**手改时**"，**拦不住"上限自己掉下来"**。

   ⭐ 方案乙 = **「未手改的跟随、手改过的保留」**（判据 = 留痕，不新增状态位）：
      `hasT(n,'统计结算金额')` / `hasT(n,'统计付款金额')` 即为「这条人工改过没有」的**唯一事实来源**
      —— 复用既有留痕，**不为"是否手改"另开一个字段**（那会是一份必然静默过期的副本）。
      ① 未手改 ⇒ **跟随**新审批金额（重算为新上限）； ⇒ 解决"审批被改小后越界"
      ② 已手改 ⇒ **保留**人工值，**但若越界则挂提醒**（`IMP_WARN`），让人来定 ——
         **绝不自动改写人工判断**（油卡抵扣那类值改掉就是丢业务数据）。
      ③ 审批金额「被改大」时也**不无脑跟随**：已手改的照样保留（否则凭空生出欠款，见下）。
   ⚠️ 欠款的连锁：审批金额调大而统计值跟随 ⇒ 台账里**突然多出欠款，但没多付一分钱**。
      这正是"保留人工值"要保护的东西 ⇒ 方案乙的 ② 顺带把这一坑堵掉。

   ⭐ 「i8 已撤单」：i8 那边**删掉整张单据**（撤单）时，本轮**不硬删** —— 标 `IMP_GONE` 保留可查，
      但**退出全部统计**（与「剔除」同思路：保留标记、不销毁数据）。
      ✅ 口径已定案（2026-09-14）⇒ **有牵涉则硬拦**（见下 `ntVoidJoint`），**不做「删除付款通知书」按钮**。

   ⚠️ 本模块只做**判定与提醒**，不落库 —— 原型里用 `IMP_WARN` / `IMP_GONE` 两个明面表承载，
      由 `fetchNtOk`（= 用户点「按 X 月抓取」）驱动；`rollback` 里清空。 */
const IMP_WARN={};   /* nid → [{field, why}]：再次导入时**人工值越界**的提醒（未改，只提醒） */
const IMP_GONE={};   /* nid → {date,code,doc}：i8 已撤单（本轮不再抓到的行）—— 标记保留、不销毁 */
const impHasWarn=n=>Object.prototype.hasOwnProperty.call(IMP_WARN,n.id);
const impHasGone=n=>Object.prototype.hasOwnProperty.call(IMP_GONE,n.id);
/* ⭐ i8 撤单行的「退出全部统计」唯一出口（2026-09-14 用户口径 · 见《说明书》§4.2.7）——
   口径：i8 侧**真删了**该单据 ⇒ 标「i8 已撤单」保留可查，但**退出全部统计**（与「剔除」同思路）。
   ⚠️ **不可复原（终态）**：单据号必变 ⇒ 不做"下次抓回来自动认回同一行"。
   ⚠️ **有牵涉则硬拦**：该行若已挂付款流水 / 集采关联 ⇒ **不允许静默退出统计**

      否则新增"撤单"这一档时，会有十几处统计出口漏掉它（正是本项目反复踩的"同一事实多处写"）。 */

const ntVoid=n=>!!n.revoked||impHasGone(n);

const ntVoidJoint=n=>ntVoid(n)&&(paidOf(n.id)>0||!!jcRefOf(n.id));
/* 统计口径下的"有效行"：未剔除 且 未撤单（撤单行一旦有牵涉则**仍算有效**，直到人处理完） */
const ntLive=n=>!n.excl&&(!ntVoid(n)||ntVoidJoint(n));
const ntLiveRows=()=>NO.filter(ntLive);
/* ⭐⭐ 「可进入**付款批次**的候选行」唯一出口（2026-09-14 用户裁定 · 甲案）——
   = **未剔除 且 未撤单**。
   ⚠️ **与 `ntLive` 有意不同、不要合并**：`ntLive` 把「撤单但有牵涉」的行**仍算有效**
      （它**仍进统计**，不许静默丢账，§4.2.7）；但这类行**绝不允许进付款批次** ——
      它的单据在 i8 侧**已被删除**，给它付款 = **把牵涉加深**，与 §4.2.7 给的出路
      （「**请先撤销付款 / 解绑关联**」）方向相反。
   ⚠️ 凡「**勾选 → 付款**」这条链上的准入判据（全选 / 按计划勾选 / 全选框状态回显 /
      付款窗口取行 / 付款提交）**一律走本出口**，不要再手写 `!n.excl` 或 `ntLive` ——
      漏一个出口 = 一条把「已作废的单」送进付款的路（2026-09-14 实测就是这么漏的）。 */
const ntPayCand=n=>ntLive(n)&&!ntVoid(n);
/* ⭐ 列表「分类」列 / 行样式的**唯一分档出口**（2026-09-14 用户口径：按来源分档、两者不相混）：

   · 正常行 → 空（分类下拉照旧）

const ntArchTag=n=>n.excl?tag('剔除','dg'):(ntVoid(n)?tag('i8 已撤单','wn'):'');

const impManSS=n=>hasT(n,'统计结算金额');
const impManSP=n=>hasT(n,'统计付款金额');
/* ⭐ 合并一条：`src` = 本次抓回来的 i8 源值（审批金额 / 付款金额(源)）。
   返回要写进 toast 的提醒文案数组（空 = 无事）。
   ⚠️ 只在**值真的变了**时才动 —— 值没变就什么都不做（否则每次抓取都"重算"一遍，假动作一堆）。 */
const impMerge=(n,src)=>{
  const oldAp=N2(n.approve), newAp=N2(src.approve);
  const msgs=[];
  if(newAp!==oldAp){
    /* ① 源字段：无条件跟随 i8 新值（"不被覆盖"只针对人工改，不针对 i8） */
    n.approve=newAp; n.pay=N2(src.pay);
    /* ② 旁路字段：未手改 ⇒ 跟随；已手改 ⇒ 保留 + 越界则挂提醒 */
    [['ss',impManSS(n),'统计结算金额'],['sp',impManSP(n),'统计付款金额']].forEach(([k,man,label])=>{
      if(man){                                              /* 手改过 ⇒ 保留人工值 */

      } else { n[k]=newAp; }                                /* 未手改 ⇒ 跟随新上限 */
    });

  }

  return null; };/* ⚠️ **列头一律只写列名**（2026-09-13 用户口径：列名里的括号注释**全部删除**）——

const ntHasFlow=n=>N2(paidOf(n.id))>0;
const ntHasLink=n=>!!jcRefOf(n.id);
const ntActCell=n=>{

  const vis=ntHit(fNt).filter(ntPayCand).map(n=>n.id), hit=vis.filter(i=>pickSet.has(i)).length;

/* 筛选 / 多选状态（2026-09-12 新增）。
   ⚠️ 复位一律【原地改字段 / 清空】，不要整体重新赋值 —— 外部（自检）持有的是对象引用。 */
let plf={ym:bjMonth(),projs:[],review:'全部'};
let plPick=new Set();
let plPjOpen=false;
let plImportM=bjMonth();          /* 「导入付款计划」弹窗里选定的年月（导入后本批数据全归该月） */
/* ---------- 「按付款计划勾选」的生效窗口（2026-09-12 定案） ----------
   用户口径：**付款计划每月 10 号生效 → 月末**（§4.3.2：8 号前上报 / 8 号前审核 / 临近 10 号整理 /
   10 号截止 / 10 号→月底随时可能付款）。⇒ 勾选按钮**只在该窗口内可点**，窗口外先禁用（R14）。
   月份来源 = **北京时间当月**（`bjMonth()`），**不可自选**。 */
function plWin(){ const d=Number(SYS_TODAY.slice(8,10)), last=Number(monthEnd(bjMonth()).slice(8,10));
  return { open: d>=10&&d<=last, day:d, from:10, to:last, ym:bjMonth() }; }
/* ---------- 付款计划「审查引擎」：拿计划表与 i8 付款通知书**逐笔比对**（取数口径见 §4.3.4） ----------
   ① 比对键 = 单据号；② 「该流程金额」↔ 通知书「审批金额」；③ 「本月预付款金额」↔ 未付金额（审批 − 已付）；
   ④ 同月同一单据号出现 ≥2 次 ⇒ 重复上报（**跨月不算**；**空单据号不参与判重**）。 */
/* ⭐⭐ **审查结果的唯一出口 = 后端**（D18：判定与落库一律后端）。
   原型原先在**前端实时派生**（查 `NO` + 重复检测）；接线后改为**读后端算好的 `result`**
   （`mod04_plan/domain.py::audit_rows` —— 与判据同一份纯函数）⇒ 前端**不再有第二份判定**。
   ⚠️ 保留签名 `(p, all)`：`V.m04` 里各处调用**一行都不用改**（第 2 个参数留着不读）。 */
const plRev=(p)=>String((p&&p.result)||'').trim()||'—';
/* 按单据号命中的 i8 通知书（供「已付款金额 / 剩余付款金额」两列取数）；查不到 → null */
const plHit=p=>{ const c=String(p.docNo||'').trim(); return c?(NO.find(x=>x.code===c)||null):null; };
/* 审查结果的**筛选归并**（2026-09-12）：判定仍是 §4.3.4 的 6 种，筛选下拉只给
   「完全匹配 / 未匹配」两档 —— 「未匹配」= 除「完全匹配」以外的全部判定。 */
const revIs=(rv,f)=> f==='全部' || (f==='未匹配' ? rv!=='完全匹配' : rv===f);
/* ---------- 付款计划的「项目」列 = 用户导入前手工填的**展示名或仓库名**（2026-09-12 用户口径） ----------
   ⚠️ **不是全名** —— 用户不会填全名：太长，而且全名里可能带「小微」字样（壳与具体小微共用全名）。
   ⇒ 系统按 `disp`（展示名）或 `name`（仓库名）**唯一匹配**项目档案：
       命中 1 条 → 正常；命中 0 条 → 「未匹配」（提示核对项目名或先建档）；命中多条 → 「重名」（需人工核对）。
   ⇒ 壳没有展示名也没有仓库名，所以**不会**再出现「壳下 N 个小微 · 待指定」这种提示（那是全名反查的产物）。 */
const plProjHit=v=>{ const s=String(v==null?'':v).trim(); if(!s) return [];
  return PJs.filter(p=>p.type!=='shell'&&(p.name===s||p.disp===s)); };
const plProjOne=v=>{ const h=plProjHit(v); return h.length===1?h[0]:null; };
/* 「项目」筛选的归并键 = 匹配到的项目**展示名** —— 同项目无论填展示名还是仓库名都归到一处；
   匹配不到的填法不产生归并键（只在「全部项目」下可见）。 */
const plProjKey=v=>{ const p=plProjOne(v); return pjKey(p); };   /* 筛选键 = **仓库名**（§2.7.4） */
/* 候选项目 = 计划行里**能匹配到**的项目（**键 = 仓库名**，去重）；**含归档**，归档靠后并标注
   （2026-09-13 用户口径：所有项目候选都含归档；原「只列在建」已作废。与付款通知书页同口径） */
const PL_PROJ_LIST=()=>pjKeysOfRows(uniqBy(PLs,p=>plProjOne(p.proj)));
/* 「项目」列的展示：匹配到 → 显示规范展示名（悬停给出填报值与仓库名）；未匹配 / 重名 → 明示 */
const plProjCell=v=>{ const h=plProjHit(v), raw=esc(String(v==null?'':v))||'—';
  if(h.length===1){ const p=h[0];
    return `<span class="fc" title="填报：${raw} ｜ 匹配到：${esc(pjDisp(p))}（仓库名 ${esc(p.name)} · ${esc(p.status)}）">${esc(pjDisp(p))}</span>`; }
  if(!h.length) return `<span class="fc">${raw}</span> <span class="tag t-dg" title="档案里没有这个展示名 / 仓库名 —— 请核对项目名，或先到「项目档案」建档">未匹配</span>`;
  return `<span class="fc">${raw}</span> <span class="tag t-wn" title="有 ${h.length} 条档案的展示名 / 仓库名相同，需人工核对">重名 ${h.length} 条</span>`; };
/* 当前筛选结果 —— 页面、全选框回显、多选删除共用同一份口径（审查结果按**实时派生值**筛） */
const plVisible=()=>PLs.filter(p=>tmIn(plf.ym,p.ym)&&(!plf.projs.length||plf.projs.includes(plProjKey(p.proj)))&&revIs(plRev(p,PLs),plf.review));
/* 勾选集合裁剪到当前可见范围（筛选变化后调用，避免删掉看不见的行） */
const prunePlPick=()=>{ const vis=new Set(plVisible().map(p=>p.id)); [...plPick].forEach(id=>{ if(!vis.has(id)) plPick.delete(id); }); };
/* 与 MOD-03 / MOD-06 共用同一个 projPanel 实现（同一份实现、多个 cfg）——
   候选键一律是**仓库名**（§2.7.4），meta 一律 `PROJ_META_KEY`（仓库名 → 展示名） */
const plPjPanel=()=>projPanel({list:PL_PROJ_LIST,selected:()=>plf.projs,allAct:'plPjAll',noneAct:'plPjNone',pickAct:'plPjPick',meta:PROJ_META_KEY});
/* ---------- 付款计划「手动行」= **表内增行模式**（§4.3.3.1 · 2026-09-16 用户口述新增 · 用户同日追认细节 6 项）----------
   形态**照抄 MOD-03 的既有约定**（`ntRowAdd` / `ntRowSet` / `ntRowSave` / `ntRowCancel`）：
   **不用弹窗**，草稿行插在**表尾**；「编辑」= 该行**原地变草稿行**（不新增行）。
   ⭐ 手动行与导入行**同住一表、走同一条审查链路** —— 判定一律 `plRev()` 按行**实时派生、不看来源**
      （6 种判定 / 同月同单据号判重 / 两档筛选 / KPI 计数 / 表内合计，全都不因"来源是手动"被跳过）。
   ⚠️ **导入不清理它**（§9.5：导入只清并重写自动行）；**只有手动行可编辑**；**删除所有行都有**（§4.3.6 —— 与
      付款通知书「i8 抓取行永不删」**不同，不得照抄**）。 */
const PL_NEW_ID='@new';                    /* 哨兵 id：新增中的草稿行（**不是** `PLs` 里的行）
                                              渲染时插在**表尾**（`applySorts` 会把它钉住、不参与排序；不进合计 / 不进勾选）
                                              ⚠️ 这句注释必须留在**模板字面量之外** —— 写在 `${}` 里会连同注释一起渲染出去 */
let plRowEditId='';                        /* ''=未在编辑；'@new'=新增中；<id>=**原地编辑**该手动行 */
let plD={};                                /* 草稿层（键与 `PL_COLS` 同名 —— "改一格不冲掉别的格"） */
const plRowOn=()=>plRowEditId!=='';        /* 是否处于增行态（渲染草稿行的唯一判据） */
const plBlank=()=>({ym:plf.ym, proj:'', docNo:'', flowAmt:'', monthAmt:'', date:'', method:'现汇', remark:''});
/* 生成 k 个**连续可用**的编号（**从「当前最大编号 + 1」起算**，**不看数组长度**）。
   ⚠️ **为什么不能数长度**：原实现用 `PLs.length+1` ⇒ **删过行之后再导入就会与既有 id 撞号**
      ⇒ `PLs.find(id)` 会**命中错行**（删除 / 编辑 / 勾选 / 再次匹配 / 点选**全按 id 定位**）。2026-09-16 修。
   ⚠️ **导入与手动新增共用这一个出口**（两个入口都别自己拼编号）。 */
const plNextIds=(pfx,k=1)=>{ let mx=0;
  PLs.forEach(p=>{ const s=String(p.id||''); if(!s.startsWith(pfx)) return;
    const n=Number(s.slice(pfx.length)); if(Number.isFinite(n)) mx=Math.max(mx,n); });
  return Array.from({length:k},(_,i)=>pfx+String(mx+1+i).padStart(2,'0')); };
/* 草稿行的「项目」下拉：候选 = **全部已建档项目（含归档、不含壳）**，键 = 仓库名（§2.7.4），
   落库记**项目 id**（§9.8-5 按 id 不按名）；归档标注走共性出口 `pjArcMark(p,true)`（纯文本档）。
   ⚠️ 这里**有意不用共用面板 `projPanel`** —— 草稿行在 `.tw`（滚动容器）**内部**，浮层面板会被裁掉
      （与「弹窗内 3 个项目下拉」同族的既有例外，已在设计规则里登记）。 */
const plProjOptions=cur=>{ const list=PL_PROJ_LIST();
  const opts=list.map(k=>{ const p=pjRowOf(k), arc=pjArcMark(p,true);
    return `<option value="${esc(k)}"${String(cur||'')===String(k)?' selected':''}>${esc(pjDisp(p))}${arc?`（${esc(arc)}）`:''}</option>`; }).join('');
  return `<option value=""${cur?'':' selected'}>（请选择项目）</option>${opts}`; };
/* 草稿行（**列对齐 15 格** —— 逐列与 `PL_THEAD` 对齐；值取草稿层，不是 `PLs` 的行）

const plDraftRow=()=>{ const d=plD, isNew=(plRowEditId===PL_NEW_ID);
  return `<tr class="draftrow">
    <td class="ctr"></td>
    <td class="fc">${isNew
      ? '<span class="tag t-in" title="尚未保存 —— 填完点本行右侧「保存」落库；「取消」丢弃（草稿不入库）">手动 · 新增</span>'
      : '<span class="tag t-in" title="正在原地编辑这条手动行 —— 点「保存」落库、点「取消」保持原样（不新增行）">手动 · 编辑</span>'}</td>
    <td><input class="inp now" type="month" style="min-width:104px" data-act="plRowSet" data-k="ym" value="${esc(d.ym||'')}" title="年月 = 归月依据（必填 · 月度形态）；保存后按它归月归档"></td>
    <td><select class="inp" style="min-width:180px" data-act="plRowSet" data-k="proj" title="归属项目（已建档项目 · 含归档、不含壳）—— 落库记项目 id">${plProjOptions(d.proj)}</select></td>
    <td><input class="inp plain" style="min-width:134px" data-act="plRowSet" data-k="docNo" value="${esc(d.docNo||'')}" placeholder="可空" title="单据号允许为空（与导入行同）；保存后按 §4.3.4 实时出审查结果"></td>
    <td class="num"><input class="inp num" style="width:96px" data-act="plRowSet" data-k="flowAmt" value="${esc(d.flowAmt||'0.00')}" title="该流程金额（比对 i8 通知书的审批金额）"></td>
    <td class="num"><span class="mut" title="保存后按命中的 i8 通知书派生（= 该单据已付金额）；单据号未命中 → 显示「—」">—</span></td>
    <td class="num"><span class="mut" title="同上（= 审批金额 − 已付金额 = 未付金额）">—</span></td>
    <td class="num"><input class="inp num" style="width:96px" data-act="plRowSet" data-k="monthAmt" value="${esc(d.monthAmt||'0.00')}" title="本月预付款金额（比对未付金额：超过则判「超过未付」）"></td>

    <td><select class="inp" data-act="plRowSet" data-k="method">${optsOf(enumVals('payMethod'),d.method||'现汇')}</select></td>
    <td><input class="inp" style="min-width:128px" data-act="plRowSet" data-k="remark" value="${esc(d.remark||'')}" placeholder="—"></td>
    <td><span class="mut sm" title="保存后按 §4.3.4 实时判定 —— 手动行与导入行走同一条链路，不因来源被跳过">保存后判定</span></td>

  </tr>`; };
V.m04=()=>{
  const order=['完全匹配','金额不符','单据号查不到','无单据号','重复上报','超过未付'];
  /* 同款筛选（2026-09-12）：①单据年月（**不要**「对应单据日期」）②项目（可多选）③审查结果（默认全部）
     ⭐ 审查结果**筛选**只给「完全匹配 / 未匹配」两档；**判定**仍是 §4.3.4 的 6 种（见表格列与上方卡片）。 */
  const scoped=PLs.filter(p=>tmIn(plf.ym,p.ym));

  const picked=list.filter(p=>plPick.has(p.id)).length;
  return `

      <li>本表支持<b>逐行删除</b>（每行「删除」按钮，删除前确认并说明影响范围）与<b>行多选 + 多选删除</b>（按月复查、清掉报错批次时用）。</li>

/* =====================================================================
   6.1 逐月欠款台账（按项目 · 按月一行）—— 2026-09-12 用户口径
   =====================================================================
   用户在用的 Excel 台账「〈项目〉辅材欠款」原样落地：第 1 行 = **期初占位行**（截止 YYYY 年 M 月底），
   其后**每月 1 行**（从期初的**次月**起；**空月也出行**、三列记 0）。
   列 = 序号 / 月份 / 其他支出金额 / 付款 / 欠款 / 备注。

   取数（欠款口径见 §4.5.1）：
     · 其他支出金额   辅材：Σ 该月 · 该项目 · 分类=辅材 的**统计结算金额**（`NT.ss`）
                      机械：**派生只读** = 该月「外租零租含税 ＋ 外租包月含税」（`machExtRent`）
                      —— 2026-09-13 起**不再手填**（源头 = 过程资料机械 6 列，`MACHM` 已删除），
                         **只改 `ledSettle` 那一行**即可换口径
     · 付款           辅材 / 机械**同构**：Σ 该月 · 该项目 · 同分类 的**统计付款金额**（`NT.sp`）
     · 欠款           **派生** = 其他支出金额 − 付款（**不存字段**）；注意这是**当月新增欠款**，**不是累计**
     · 备注           人工录入（`LEDNOTE`，键 = 口径|项目键|月）
   归月依据 = 通知书的**单据日期**（`NT.date` 的 YYYY-MM）—— 与抓取 / 筛选同一条时间轴。
   项目归集 = **归属** → **仓库名**（`ntProjKey`，§2.7.4），与「按项目看欠款」同口径。
   期初行   = 该项目在期初占位行里那一条（其余额 = 人工录入；**按分类取**，故两个口径各带各的）。
   ⭐ 2026-09-12 用户口径（第 2 版）：台账**从中间劈开** —— **左 = 辅材、右 = 机械**（两张卡、同一行）；
      **不再有「辅材 / 机械」切换按钮**；两侧**共用同一个「项目」选择器**（同一项目左右对照看），
      各自带「＋ 录入期初占位行 / 导出 Excel」（录入弹窗的「分类」按所在侧预选，仍可改）。 */
let ledProj='';                            /* 台账当前选中的项目（**仓库名** = 候选键，§2.7.4）—— **两侧共用**；显示走 `pjLabel` */
let lgCut=bjMonth(-1);                     /* 「录入期初占位行」里选的**截止年月**（＝台账起点，台账从其次月起） */
let lgCat='辅材';                          /* 「录入期初占位行」里选的**分类**（辅材 / 机械） */
/* ⭐ 期初占位行的**草稿层**（2026-09-13 用户要求）：展开区里改「分类」/ 选「截止年月」都会重绘，
   必须保住已填的金额与备注 —— 否则重绘一次就把刚填的数冲成 0.00。
   写入 = 三个 `CHG` 动作（lgS / lgP / lgR）；读取 = 展开区渲染；**保存 / 取消后复位**。
   ⭐ 2026-09-13 增行模式（用户拍板 C-1/C-7）：**「录入期初占位行」弹窗取消** ⇒ 改为**栏内展开区**，
      且渲染在 `.tw` **之外**（表格上方的独立条带）—— 这样其内的「项目」共用面板不会被滚动容器裁掉。 */
const LG_R_DEF='系统上线前已发生，无付款通知书';
let lgD={s:'0.00',p:'0.00',r:LG_R_DEF};
let lgPjName='';                           /* 展开区里选的**项目键（仓库名）**（打开时默认＝台账当前项目） */
let lgOn=false;                            /* 增行态开关：展开区是否打开（取代原弹窗的"是否开着"） */
let lgPjOpen=false;                        /* 展开区里「项目」共用面板是否展开（真实浮层 —— 在 .tw 之外，不会被裁） */
const LEDNOTE={};                          /* { '口径|项目键|月': 文本 } —— 逐月台账备注（手填；不在 §9.3 留痕范围） */

   `ntProjName` 只在**给人看**时用（展示名）。 */
const ntProjKey=n=>pjKey(ownOf(n));
const ntProjName=n=>{ const k=ntProjKey(n); return k?pjLabel(k):(isShellFull(n.proj)?'（待指定归属）':n.proj); };
const ntYm=n=>String(n.date||'').slice(0,7);
/* 期初占位行存的是**项目全名** → 归一到**仓库名**（候选键，§2.7.4），才能与台账的项目键对上 */
const lgProjKeyOf=v=>pjKey(pjRowOf(v));
const nextYm=m=>{ const [y,mm]=String(m).split('-').map(Number); const t=new Date(y,mm,1);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'); };
const prevYm=m=>{ const [y,mm]=String(m).split('-').map(Number); const t=new Date(y,mm-2,1);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0'); };
/* ---------- 「录入期初占位行」的两个默认值（2026-09-12 口径 + 2026-09-13 细化）----------
   ① 项目默认 = **欠款台账当前选中的项目**（同屏已有上下文，不必再选一遍）
   ② 截止年月默认 = **该项目「该分类」已有数据的最早月的前一月**（期初＝上线前的余额 ⇒ 落在第一笔账之前）
   ⭐ 2026-09-13 用户口径：**辅材与机械各自独立计算**（同一项目的两个分类完全可能落在不同月份）。
      「已有数据」按**该分类**取：辅材 = 未剔除辅材通知书（按归属归集）；机械 = 机械 6 列的月份
      —— 与台账月行的数据源同一份。
   该分类完全没有数据 → 回退到原默认「上月」。 */
/* 期初占位行的项目候选（与该弹窗下拉**同一集合**）：**含归档**、归档靠后（2026-09-13 用户口径）。
   候选键 = **仓库名**（`pjRowsWithKey` 已把壳剔除 —— 壳没有仓库名） */
const lgPjList=()=>pjRowsWithKey(pjNoShell());
const lgDefPjName=()=>{ const L=lgPjList(), cur=ledCur();
  const hit=L.find(p=>pjKey(p)===cur||pjDisp(p)===cur);
  return (hit||L[0]||{}).name||''; };
const lgEarliest=(key,cat)=>{ const ms=[];
  NO.filter(n=>ntLive(n)&&n.cat===cat&&ntProjKey(n)===key).forEach(n=>ms.push(ntYm(n)));
  if(cat==='机械') Object.keys(MACH6[key]||{}).forEach(k=>ms.push(k));
  return ms.filter(Boolean).sort()[0]||''; };
const lgCutFor=(v,cat)=>{ const e=lgEarliest(pjKey(pjRowOf(v)),cat); return e?prevYm(e):bjMonth(-1); };
const ledCutLabel=m=>/^\d{4}-\d{2}$/.test(String(m||''))?`截止 ${m.slice(0,4)} 年 ${Number(m.slice(5,7))} 月底`:'截止时间未填';
/* 台账可选项目 = 该口径下**有数据**的项目（通知书；机械结算源未接线 ⇒ 暂不计）+ **该口径的**期初占位行。**键 = 仓库名**
   ⚠️ 原第 2 行按**演示** `MACH6` 的键补候选 —— 那是演示数据 ⇒ 会往选择器里塞**幻影项目**（真库里没有的仓库名）。
      机械结算源（过程资料机械 6 列）接线时，这里应改成读**后端的机械结算口**。 */
const LED_PROJS=sc=>{ const s=new Set();
  NO.filter(n=>ntLive(n)&&n.cat===sc).forEach(n=>s.add(ntProjKey(n)));
  LGs.filter(l=>l.cat===sc).forEach(l=>s.add(lgProjKeyOf(l.proj)));
  s.delete('');                                        /* 未归属的行落不到任何项目上（真系统里不会有） */
  return [...s].sort(); };
/* 该月的「其他支出金额」 */
const ledSettle=(sc,proj,ym)=> sc==='辅材'

      `uniqBy(IVs,…)` 一次性求值，取数回来时它早已定死成空数组（**静默失去候选**，不报错）。 */
let PROC_PJS=[];
/* procTab 默认 = 1（**表② 调整后表**）；procPjOpen = 「项目」单选面板的开合（用户口径 2026-09-13） */
let procPj='', procTab=1, procPjOpen=false;   /* 初值同理由 `reloadInv()` 落定（不能取加载时的 `PROC_PJS[0]`） */
/* 该项目的**核算月**清单（升序）= 库存单据里出现过的月份 —— 这就是「过程资料 = 每项目每月一份」
   的月份维度。⚠️ 月份**只从库存单据来**，不新立口径。 */
const procMonths=proj=>[...new Set(IVs.filter(iv=>iv.wh===proj).map(iv=>String(iv.dd).slice(0,7)))].sort();
/* 聚合的**唯一出口**：传 `ym` = 只算该核算月；**不传 `ym` = 全月合计**（自检用的就是后者 ⇒ 语义不变）。
   ⚠️ `proj` = **仓库名**（§2.7.4）。机械 6 列同样按核算月取（`mach6Arr`），全月合计时**逐列相加**。 */
function procAgg(proj,adjusted,ym){
  const g=IVs.filter(iv=>iv.wh===proj&&(!ym||String(iv.dd).slice(0,7)===ym)), inC={}, outC={};
  IVC5.forEach(c=>{ const pick=d=>g.filter(iv=>iv.dir===d&&iv.c5===c);
    inC[c]=N2(pick('入库').reduce((a,iv)=>a+(adjusted?amtOf(iv):iv.amt),0));
    outC[c]=N2(pick('出库').reduce((a,iv)=>a+(adjusted?amtOf(iv):iv.amt),0)); });
  const m = ym ? mach6Arr(proj,ym)
               : MACH6_Z.map((_,i)=>N2(Object.keys(MACH6[proj]||{}).reduce((a,k)=>a+MACH6[proj][k][i],0)));
  return {inC,outC,m};
}

  const SEG=[1,6,11,15];

  /* ⭐ 求和（2026-09-13 用户口径）：
     ① **每个数据列下方**加「合计」行 —— 入库 5 类 / 出库 5 类 / 机械 6 列**逐列垂直求和**；
     ② 另加「总求和」行 —— **入库 / 出库 / 机械** 三组各一个横向总计（用户要的"额外的总求和"）。

  const cur = procTab===1 ? rows1 : rows0;

  /* 机械 6 列**分两段**（列序：0 租分公司设备 · 1 内租设备 · 2 外租零租含税 · 3 外租包月含税 ·

     用户 2026-09-13 明确：不含税两列**单独求和**，不并入左 4 列那一段。 */
  const MACH_TAX_N = 4;

  const sumRow = `<tr class="sumrow" style="background:var(--sf2);font-weight:500"><td class="fl">合计</td>`

    + a0.m.map((_,i)=>`<td class="num${vsc(11+i)}">${M(sumM(i))}</td>`).join('') + `</tr>`;
  /* 总求和行：四段各占一段（`colspan` = 该段列数）⇒ 行内单元格数之和恒等于表头列数。
     ⚠️ 行标签带「（本表）」是**刻意消歧**：卡片 kv 区那三个「入库合计 / 出库合计 / 机械合计（手填）」
        取的是**全月 · 原始**值，与本行（**当前显示的那批**）**同名不同义**。 */
  const totRow = `<tr style="background:var(--sf2);font-weight:500"><td class="fl">总求和（本表）</td>`

    + `<td class="num vsep" colspan="${a0.m.length - MACH_TAX_N}">不含税合计 ${M(totMNoTax)}</td></tr>`;

        <td class="sm">${esc(a.remark)}</td><td class="sm">${esc(a.op)}</td><td class="fc sm">${a.time}</td>

        /* ⭐ 差异表也在数据列下方加合计（用户口径：表①②③都加）—— 可求和的只有「原值 / 调整后 / 差额」3 列 */
        + `<tr class="sumrow" style="background:var(--sf2);font-weight:500"><td class="fl" colspan="4">合计</td>`
          + `<td class="num">${M(N2(adjs.reduce((s,iv)=>s+iv.amt,0)))}</td>`
          + `<td class="num">${M(N2(adjs.reduce((s,iv)=>s+adjOf(iv).newAmt,0)))}</td>`
          + `<td class="num">${SIG(N2(adjs.reduce((s,iv)=>s+N2(adjOf(iv).newAmt-iv.amt),0)))}</td><td colspan="4"></td></tr>`

/* =====================================================================
   10. MOD-07 收发结存与活动大表

/* ⭐ 活动大表的**项目集合与顺序**（2026-09-13 用户口径：从「在建」项目里**多选** + **大表自己的顺序**）。
   候选 = 项目档案里 `status==='在建'` 且**非壳**的行（`pjNoShell`），键 = **仓库名**（§2.7.4）。
   `BIGSET` = 有序数组，是这份集合的**唯一存储**；改动只走选题动作（`ACT.*`）。 */
const bigCands = () => pjKeysOfRows(pjNoShell().filter(p=>p.status==='在建'));   /* 候选 = 在建 · 非壳（实时算） */
let BIGSET = [];   /* ⭐ 已接后端：由 `reloadM07()` 从 `/api/m07/big` 的 `selected` 原地填充（行序 = 大表自己的顺序；未选题时后端给「全部候选」，与原型同款） */
let BIGDRAFT = null;         /* 选题弹窗的**草稿**（「确定」前的临时顺序） */
/* ⭐ 大表每一格的取数（**唯一出口**：页面渲染 / 导出共用）。
   `ym` = 核算月（默认 `bjMonth(-1)`，§9.2 材料报表类）。
   · 焊材 / 三气：取自**收发结存提取**（`EXTM`）—— 当月走 `extMon`、累计走 `extTotal`（全部月份之和）。
   · 外租机械 = **外租零租含税 ＋ 外租包月含税**（= 进结算那两列）⇒ 当月复用 `machExtRent`、累计复用 `machSettleOf`。
   · 设备租赁（含内租）= **内租设备**（机械 6 列的第 1 列）。
   · **合计 = 外租机械开工累计 ＋ 设备租赁开工累计**（用户口径；已按模板图逐行核对）。
   ⚠️ **「租分公司设备」与两个「不含税」列不进本表**（用户口径）。 */
const bigRent     = (wh,ym) => machExtRent(wh, ym);
const bigRentCum  = wh => machSettleOf(wh);
const bigLease    = (wh,ym) => N2(mach6Arr(wh,ym)[1]);
const bigLeaseCum = wh => N2(Object.keys(MACH6[wh]||{}).reduce((a,k)=>a+bigLease(wh,k),0));
const bigTotalCum = wh => N2(bigRentCum(wh) + bigLeaseCum(wh));
const bigHWCum = wh => extTotal('焊材', wh), bigQTCum = wh => extTotal('气体', wh);
/* ⭐ **主材累计（含税）** 的**取数唯一出口**（2026-09-13 用户裁定：由手填改为**派生**）——
   口径 = **按项目取「集采台账结算」额**：= 该项目集采合同**结算金额之和**（§5.7.1）。
     · 结算口径本身**照搬** `jcSettle`（有贸易公司 → 贸易公司发票子表合计；无 → 供应商发票子表合计，§6.4.1），
       **不另立算法**；
     · ⭐ **只计「纳入台账」的合同**（用户 2026-09-13 裁定「甲」）—— 与 `MOD-11` 的「Σ 结算金额」KPI **同口径**；
     · 键 = 仓库名（§2.7.4）；项目恒有值 ⇒ 不需要"未指定"档。
   ⚠️ 视图 / 导出**一律走本出口**，不要在渲染里内联求和。 */
/* ⚠️ 「主材累计（含税）」的取数口**集采台账属 M5**：未接入时给 `null`（页面显「—」），⛔ 不写 0 冒充「确实没有」（`TAIL-25`；口径 = 后端 `mat_available`）。 */
const bigMatCum = wh => MAT_OK ? N2(JCs.filter(j => j.tag === '纳入台账' && j.proj === wh).reduce((a, j) => a + jcSettle(j), 0)) : null;
/* （原 `TOK` / `pickExtra` 已废：大表不再按"项目全名关键词"匹配，改按**仓库名**走上面的出口。） */
/* ---------- 焊材 / 气体提取的**取数出口**（2026-09-13） ----------
   · `extWhs(kind)` = 该类别下出现过的仓库（**排序走共性出口 `pjSort`**）。
   · `extMon(kind, wh, m)` = 某仓库某月的金额（缺省 0）；`extMons()` = 有数据的月份（升序）。
   · `extSum(kind, wh)` = **「金额」列** = 所选**月份范围**内的金额（`fExt.ym` 走 `tmIn`：月 / 连续月 / 年 / 全部）。
   · `extTotal(kind, wh)` = **「总金额」列** = 全部月份的累计（**不随月份筛选变**）。
   · `extVisible(kind)` = 按「项目状态」过滤后的行（状态取自**项目档案行** `pjRowOf(仓库名).status`）。 */
let fExt = { status: '在建', ym: bjMonth(-1) };   /* 项目状态默认「在建」（用户口径）；月份默认上月（§9.2） */
const extMons = () => Object.keys(EXTM).sort();
const extMon = (kind, wh, m) => { const h = ((EXTM[m] || {})[kind] || []).find(x => x[0] === wh); return h ? h[1] : 0; };
const extWhs = kind => { const s = new Set(); extMons().forEach(m => (EXTM[m][kind] || []).forEach(x => s.add(x[0]))); return pjSort([...s]); };
const extStatusOf = wh => { const p = pjRowOf(wh); return p ? p.status : ''; };
const extVisible = kind => extWhs(kind).filter(w => fExt.status === '全部' || extStatusOf(w) === fExt.status);
const extSum = (kind, wh) => N2(extMons().reduce((a, m) => a + (tmIn(fExt.ym, m) ? extMon(kind, wh, m) : 0), 0));
const extTotal = (kind, wh) => N2(extMons().reduce((a, m) => a + extMon(kind, wh, m), 0));
/* 提取表的一「块」= 该类别的数据行 + **紧贴其后的合计行**（用户口径：焊材的求和要贴着焊材数据行）。
   空（被筛没了）时给提示行；跨列数由 `thCount(EXT_THEAD)` 派生。页面与导出**共用**这一份取数。 */
function extBlock(kind){
  const list = extVisible(kind), tagCls = kind === '焊材' ? 't-wn' : 't-pri';
  if (!list.length) return `<tr><td colspan="${thCount(EXT_THEAD)}" class="ctr mut" style="padding:14px">当前筛选条件下没有${kind}数据 —— 换个「项目状态」或月份</td></tr>`;
  /* 结余格 = **点格即改**（`ACT.extBal`）：未录入 ⇒ 空 + 「待填」占位（⛔ 不写 0）；`0` 照写 `0`（合法值）。 */
  const balCell = w => { const v = extBalOf(kind, w);
    return `<td class="num"><input class="inp num" data-act="extBal" data-k="${esc(kind)}" data-p="${esc(w)}" value="${v == null ? '' : esc(String(v))}" placeholder="待填" title="${esc(EXT_BAL_NOTE)}"></td>`; };
  const rows = list.map(w => `<tr><td><span class="tag ${tagCls}">${kind}</span></td><td class="sm">${esc(w)}</td>${balCell(w)}<td class="num">${M(extTotal(kind, w))}</td><td class="num">${M(extSum(kind, w))}</td></tr>`).join('');
  return rows + sumRowOf(EXT_THEAD, list, {3:rs=>N2(rs.reduce((a,w)=>a+extTotal(kind,w),0)),4:rs=>N2(rs.reduce((a,w)=>a+extSum(kind,w),0))}, {lead:kind+'合计',sticky:false});
}
/* 手填值解析（OPEN-05）：当月已录入 → 用当月值（无标记）；否则向更早月份取「最近一次录入值」带入（标来源月）。
   注意用 != null 判断：0 是合法录入值，不能被当作「未录入」。 */
const bigOwn=(wh,m,i)=>{ const r=BIGVAL[m]&&BIGVAL[m][wh]; return (r&&r[i]!=null)?r[i]:null; };
/* 某一格的值：本月已录 → 直接取；否则**向前取最近一次录入值**（带入 · OPEN-05），并标出来源月。 */
function bigCell(wh,month,i){
  const own=bigOwn(wh,month,i);
  if(own!=null) return {v:own,from:null};
  const earlier=Object.keys(BIGVAL).filter(m=>m<month).sort().reverse();   /* 由近及远，实现「最近一次」 */
  for(const m of earlier){ const h=bigOwn(wh,m,i); if(h!=null) return {v:h,from:m}; }
  return {v:null,from:null};
}
/* 大表完整行（页面渲染、导出**共用**，保证「所见即所印」）—— 行序 = `BIGSET`（大表自己的顺序）。 */
function bigRows(month){
  return BIGSET.map(wh=>{ const p=pjRowOf(wh);
    const cells=BIGCOLS.map((c,i)=>bigCell(wh,month,i));

 /* 行内可改列：付款时间 / 付款方式 / 备注 / （仅未匹配行的）单据号
    ⚠️ 改动**立刻写回数据**（不是草稿层）—— 全量重渲染后 value 仍由数据生成，所以不会冲掉；
       持久性口径：**落库 + 不被导入覆盖 + 不留痕**（与「统计两金额」那类旁路字段同族，但**不留痕**）。 */
 /* ⭐ 已接后端：`POST /api/m04/plans/{id}/cell` —— §4.3.3 **立刻落库 · 不被导入覆盖 · 不留痕**。
    ⚠️ 可改范围**由后端判**（单据号只对「未匹配」行开放）⇒ 前端不再自己把关。 */
 plCell:t=>{ const p=PLs.find(x=>x.id===t.dataset.id); if(!p) return;
    const f=t.dataset.f, F={docNo:'单据号',date:'付款时间',method:'付款方式',remark:'备注'};
    if(!F[f]) return;
    const v=String(t.value==null?'':t.value).trim();
    plAct(()=>API.plCell(p.id, PL_COL_API[f], v),
      `<b>${p.id}</b> 的${F[f]}已改为 <b>${esc(v)||'（空）'}</b>${f==='docNo'?' —— 点该行「再次匹配」重新比对 i8 通知书':''}`); },
 /* 再次匹配：审查结果是实时派生的，按当前单据号重跑一次即可（并给出新的审查结果） */
 /* ⭐ 已接后端：`POST /api/m04/plans/{id}/re-match` —— 重跑**同一个审查引擎**（§4.3.3） */
 plRematch:t=>{ const p=PLs.find(x=>x.id===t.dataset.id); if(!p) return;
    const code=esc(String(p.docNo||'').trim())||'（空）';
    plAct(()=>API.plRematch(p.id), ()=>{
      const rv=plRev(PLs.find(x=>x.id===p.id)||p);
      return `<b>${p.id}</b> 已按单据号 <b>${code}</b> 重新比对 → 审查结果：<b>${rv}</b>${rv==='完全匹配'?'（该行转入「无需处理」）':''}`;
    }); },
 /* 逐行删除：与批量删除同款确认（删除前列影响范围）；删掉的 id 同时从勾选集合里移除 */
 /* 按付款计划勾选：入口在付款通知书页（勾选与付款在同一处）。**2026-09-12 定案**：
   · **只在付款计划生效窗口（当月 10 号 → 月末，§4.3.2）内可点**；窗口外按钮先禁用（R14）
   · 月份来源 = **北京时间当月**（不可自选）
   · 计划行指向的通知书**可能落在别的月份**（当月计划里混着上月/更早的通知书）
     ⇒ 做法：把**视图参数**（单据年月 / 分类 / 审批状态 / 付款状态）放宽到「全部月份 + 未付清」，
       使当月计划命中的通知书**全部落在当前筛选结果内**，再一次性勾选 ——
       这样「只勾当前筛选结果内的行」（§4.3.5）**依然成立**，且勾中的行都能在页面上看到、逐步核对。
   · ⚠️ **「项目」筛选一律不动**（用户口径 2026-09-12）—— 它是用户表达的业务范围，
       勾选范围**尊重已选项目**；因此被项目筛选挡掉的行会跳过并在提示里报数。
   · 剔除行 / **撤单行一律不勾**（判据 = 付款候选 `ntPayCand`；撤单的单据 i8 已删，不许再产生付款）；未命中的计划行在提示里说明。 */
 planPick:()=>{ const win=plWin();
   if(!win.open){ toast(`<b>付款计划 ${win.from} 号起生效、月末截止</b>（§4.3.2）—— 模拟今天 <b>${SYS_TODAY}</b>，不在付款窗口内，暂不可勾选`,4800); return; }
   const ym=win.ym;
   /* ⚠️ 只放宽「视图参数」；**不碰 fNt.projs**（项目筛选是用户选定的业务范围） */
   fNt.month='全部'; fNt.cat='全部'; fNt.astat='全部'; fNt.stat='未付清'; pjOpen=false; mp.open=null;
   pickSet.clear();
   const plan=PLs.filter(p=>p.ym===ym);
   let hit=0, miss=0;
   plan.forEach(p=>{ const c=String(p.docNo||'').trim();
     const n=c?NO.find(x=>x.code===c&&ntPayCand(x)):null;
     if(!n){ miss++; return; }
     hit++; pickSet.add(n.id); });
   const before=pickSet.size;
   VIEW='m03'; prunePick(); render();
   const cut=before-pickSet.size;                 /* 被「项目」筛选等挡掉、未能勾上的条数 */
   const months={}; [...pickSet].forEach(i=>{ const m=NO.find(n=>n.id===i).date.slice(0,7); months[m]=(months[m]||0)+1; });
   const other=Object.keys(months).filter(m=>m!==ym).sort();
   const cx=other.reduce((a,m)=>a+months[m],0);
   toast(`已按 <b>${ym}</b> 付款计划勾选 <b>${pickSet.size}</b> 条（计划命中 <b>${hit}</b> 条${miss?`，另 <b>${miss}</b> 行无单据号 / 编号查不到`:''}${cut?`；<b>${cut}</b> 条不在你选定的「项目」范围内，已跳过`:''}${cx?`；含<b>跨月 ${cx}</b> 条（${other.map(m=>`${m} ×${months[m]}`).join('、')}）`:''}）<br><b>「项目」筛选未被改动</b>；已放宽「单据年月 / 分类 / 审批状态」并把付款状态置为「未付清」，便于逐条核对 —— <b>实际付什么、付多少由用户自行修改</b>`,7000); },

 /* —— MOD-03 · 手动新增 / 编辑付款通知书 = **表内增行模式**（2026-09-13 用户口径）——
    用途不变：付「期初占位行」的款 —— 那笔钱没有 i8 单据，只能手工补一行。
    ⭐ 2026-09-13 用户拍板：「手动新增 / 编辑」**弹窗取消**，改为**表内增行**（甲案：草稿行不落 `NO`）。
    草稿层仍是 `naD`（键与 `NT_COLS` 同名，另加 `pid`）⇒ "改一格不会冲掉别的格"这条老教训照旧成立。 */
 ntRowAdd:()=>{ naEditId=NT_NEW_ID; naD=ntBlank(); ntReveal(); render();
   toast('已在表尾生成<b>一行草稿</b>（尚未保存）—— 填完点该行「保存」落库、点「取消」丢弃<br>已放宽「单据年月 / 分类 / 审批状态 / 付款状态」以便看见草稿行；<b>「项目」筛选未改动</b>',5600); },
 /* 草稿层写入口：输入即记录（表单元素走 `change`，已登记在 `CHG`）；
    ⚠️ 只有「分类」变了需要重绘（它决定「集采实际供应商」是否可填）—— 其余字段不重绘，
       免得每改一格就把焦点丢掉。 */
 ntRowSet:t=>{ const k=t.dataset.k, v=t.value;
   /* 「付款项目」的候选值是**仓库名**（§2.7.4）⇒ 落草稿前解析成**档案 id**（§9.8-5 按 id 不按名）。
      宽容输入：直接给 id 也认（先按 id 找，再按 仓库名 / 展示名 / 全名 解析）。 */
   naD[k]=(k==='pid')?((PJs.find(x=>x.id===v)||pjRowOf(v)||{}).id||''):v;
   if(k==='cat') render(); },
 ntRowCancel:()=>{ const was=(naEditId&&naEditId!==NT_NEW_ID)?naEditId:''; naEditId=''; naD={}; render();
   toast(was?`已放弃对 <b>${esc(was)}</b> 的修改 —— 该行<b>保持原样</b>（草稿未落库）`:'已取消新增 —— 草稿行丢弃，<b>未写入任何数据</b>'); },
 /* 「编辑」= 该行**原地变草稿行**（不新增行；文案/校验与新增共用 `ntRowSave`） */
 ntEdit:t=>{ const n=NO.find(x=>x.id===t.dataset.id); if(!n||!n.manual) return;
   naEditId=n.id;
   naD={date:n.date, code:n.code, pid:((ownOf(n)||{}).id)||'',
     doc:n.doc, biz:n.biz, recv:n.recv, cat:n.cat, astat:n.astat,
     approve:String(n.approve), sp:String(n.sp), sup:n.sup||''};
   ntReveal(); render();
   toast(`正在<b>原地编辑</b>手动行 <b>${esc(n.id)}</b> —— 该行已变为草稿态；点「保存」落库、点「取消」保持原样`,5200); },
 /* 保存 = 原弹窗的「确认新增 / 保存修改」——校验链**一字未改**（项目必选 → badMoney → overCap 拦截并保留原值） */
 ntRowSave:()=>{ const pj=PJs.find(p=>p.id===naD.pid);
   if(!pj){ toast('<b>请先选「付款项目」</b>：候选 = 全部已建档项目（含归档；壳除外，§六-9）'); return; }
   const ap=naNum(naD.approve), sp=naNum(naD.sp);
   if(badMoney(ap)){ toast(badMoneyMsg('审批金额')); return; }
   if(badMoney(sp)){ toast(badMoneyMsg('统计付款金额')); return; }
   if(overCap(sp,ap)){ toast(`<b>统计付款金额超上限</b>：全站口径「按发票走、只能少不能多」⇒ 上限 = 审批金额 <b>${M(ap)}</b>。<br>要付 <b>${M(sp)}</b> 就把<b>审批金额</b>也填到 <b>${M(sp)}</b>（手动行没有 i8 结算、审批金额由你定），已保留原值`,7000); return; }
   const cat=naD.cat||'辅材';
   const dt=/^\d{4}-\d{2}-\d{2}$/.test(String(naD.date||''))?naD.date:naDefDate();
   const f={date:dt, code:String(naD.code||'').trim(), doc:String(naD.doc||'').trim(), biz:String(naD.biz||'').trim(),
     recv:String(naD.recv||'').trim(), cat, astat:naD.astat||'已批', approve:ap, sp,
     sup:(cat==='集采')?String(naD.sup||'').trim():''};
   if(naEditId&&naEditId!==NT_NEW_ID){ const n=NO.find(x=>x.id===naEditId); if(!n) return;
     Object.assign(n,f); n.proj=pj.full; n.ss=0; OWN[n.id]=pj.id;      /* 归属按【档案 id】写死，不按全名反查 */
     naEditId=''; naD={}; render();       /* 增行模式：保存 = 草稿层复位（不再有弹窗可关） */
     toast(`手动行 <b>${n.id}</b> 已更新（${esc(pjDisp(pj))} · ${n.date} · 审批 ${M(ap)} · 统计付款 ${M(sp)}）—— 欠款与台账已重算`); return; }
   const id='MN'+String(NO.filter(x=>/^MN/.test(x.id)).length+1).padStart(2,'0');
   const n=O([id,f.date,f.code,pj.full,f.doc,f.biz,f.recv,CUR.name,f.approve,0,0,f.sp,f.cat,f.astat,false,'',f.sup,[],'',true],NT_COLS);
   NO.push(n); OWN[id]=pj.id;
   /* 新增后**保证看得见**（同「按付款计划勾选」的做法）：切到该行年月 + 放宽三档筛选；「项目」筛选一律不动 */
   fNt.month=String(n.date).slice(0,7); fNt.cat='全部'; fNt.astat='全部'; fNt.stat='全部'; prunePick();
   naEditId=''; naD={}; render();         /* 增行模式：保存 = 草稿层复位（不再有弹窗可关） */
   toast(`已手动新增付款通知书 <b>${id}</b>（${esc(pjDisp(pj))} · ${n.date}）—— <b>统计结算金额恒 0</b>、统计付款金额 <b>${M(sp)}</b> 已计入台账当月「付款」<br>已切到 <b>${fNt.month}</b> 并放宽分类 / 状态筛选；若被「项目」筛选挡着，清一下项目筛选即可见`,7000); },
 /* 手动行的「审批金额」表内可改（i8 抓取行该列仍只读） */
 editApprove:t=>{ const n=NO.find(x=>x.id===t.dataset.id); if(!n||!n.manual) return;
   const v=naNum(t.value);
   if(badMoney(v)){ toast(badMoneyMsg('审批金额')+` ${M(n.approve)}`); render(); return; }
   if(overCap(n.sp,v)){ toast(`<b>审批金额不能低于「统计付款金额」</b>：全站口径「统计两金额 ≤ 审批金额」⇒ 至少 <b>${M(n.sp)}</b>（先把统计付款金额调小，或把审批金额填大），已保留原值 ${M(n.approve)}`,6000); render(); return; }
   n.approve=v; render();
   toast(`手动行 <b>${n.id}</b> 审批金额已改为 <b>${M(v)}</b> —— 「付款金额（本次应付）」与付款状态已实时重判`); },
 ntDel:t=>{ const n=NO.find(x=>x.id===t.dataset.id); if(!n||!n.manual) return;
   modal({title:'删除确认 · 手动新增付款通知书',body:`<div class="tip dg" style="margin-bottom:10px"><b>⚠️ 删除前必须列出影响范围</b>（关联数据、统计影响）—— §7.2 / §9.4。</div>
     ${kvBlock([['单据',`<span class="fc">${esc(n.id)} · ${esc(n.code||'（未填编码）')}</span>`],['项目',`<span style="font-size:11.5px">${esc(n.proj)}</span>`],['单据日期',`<span class="fc">${esc(n.date)}</span>`],['统计结算金额','<span class="fc">0.00</span>（恒 0）'],['统计付款金额',`<span class="fc">${M(n.sp)}</span>`],['已付金额（流水）',`<span class="fc">${M(paidOf(n.id))}</span>`]])}
     <div class="tip" style="margin:0">删除后：该行的<b>统计付款金额 ${M(n.sp)}</b> 退出「逐月欠款台账」当月「付款」列（欠款<b>回增</b> ${M(n.sp)}）；<b>已付金额不受影响</b>。<br>该行是<b>人工补录</b>的记录，删除即移出列表、<b>不做软删</b>。</div>`,
     footer:`<button class="btn" data-act="closeModal">取消</button><button class="btn dg" data-act="ntDelOk" data-id="${n.id}">确认删除</button>`}); },
 ntDelOk:t=>{ const i=NO.findIndex(x=>x.id===t.dataset.id); if(i<0) return; const id=NO[i].id;
   NO.splice(i,1); delete OWN[id]; pickSet.delete(id); if(naEditId===id) naEditId='';
   closeModal(); render(); toast(`手动新增的通知书 <b>${id}</b> 已删除 —— 欠款与逐月台账已重算（该行无 i8 单据、不做软删）`); },

 /* ⭐ 撤销付款（2026-09-14 新增）：**付款通知书页的就近入口** —— 把 §4.4.5 的能力搬到用户发现问题的位置。
   ⚠️ **不新开口径**：撤销逻辑与「付款流水与欠款统计」页的 `revDlg` / `revOk` **完全同一套**
      （原因必填 + 留痕 + 已付金额回退 + 按审批金额重判）⇒ 这里只负责"找到该撤哪条 / 分流到哪"。
   ① 该行**只有 1 条生效流水** ⇒ 直接开撤销弹窗（省一次跳转；复用 `revDlg`）。
   ② 该行**有多条生效流水** ⇒ 跳「付款流水与欠款统计」页并**只筛出这一单**（`ntFlows` 落筛选）——
      不做"一次撤全部"（撤销是**逐条**留痕的动作，批量撤会让每条的原因被糊成一个）。
   ③ 该行**没有生效流水**（理论上不会走到，按钮只在 `paidOf>0` 时出现）⇒ 提示并返回。 */
 ntRevoke:t=>{ const n=NO.find(x=>x.id===t.dataset.id); if(!n) return;
   const live=FLs.filter(f=>f.nid===n.id&&!f.voided);
   if(!live.length){ toast('这行通知书当前<b>没有生效的付款流水</b> —— 无需撤销'); render(); return; }
   if(live.length===1) return ACT.revDlg({ dataset:{fid:live[0].id}, tagName:'BUTTON' });
   /* 多条：跳到流水页并只筛这一单（流水页有"关键词"筛选，用它把单据编码填进去） */
   flf.ym=fNt.month; flf.projs=[]; flf.method='全部'; flf.state='全部'; flf.q=n.code||'';
   flPjOpen=false;   /* 面板收起（变量名是 `flPjOpen`，交互路径与 `rollback` 都用它） */
   go('m05');   /* `go` 内部已 render + 滚动到顶；离开 m03 它会自动 clear pickSet */
   toast(`该行有 <b>${live.length}</b> 条生效流水 —— 已跳到「付款流水与欠款统计」并筛出 <b>${esc(n.code||n.id)}</b><br>请逐条点「撤销」并分别填写原因（撤销是<b>逐条留痕</b>的动作，不做一次撤全部）`,6800); },

 /* ⭐ 查看关联（2026-09-14 新增）：**纯只读** —— 从通知书反查"这笔钱付到哪去了"。
   内容两块：① 集采合同关联（`jcRefOf`，写的是集采合同付款子表那份记录）；
             ② 已登记付款流水（生效 + 已撤销都列，撤销的显示原因 —— 这才是"去向"的完整视图）。
   ⚠️ 零口径风险：不写任何数据、不改任何状态；两个弹窗按钮一律「关闭」。 */
 ntTrace:t=>{ const n=NO.find(x=>x.id===t.dataset.id); if(!n) return;
   const j=jcRefOf(n.id);
   const flows=FLs.filter(f=>f.nid===n.id);
   const live=flows.filter(f=>!f.voided), voided=flows.filter(f=>f.voided);
   const amtLive=N2(live.reduce((a,f)=>a+f.amt,0));
   const jcRow=j?`${esc(j.id)} · ${esc(j.material||'')} · ${esc(j.supplier||'')} · 欠款 <span class="fc">${M(jcDebt(j))}</span>`:'<span class="mut">未关联集采合同（仅「集采」分类的行可关联）</span>';
   const flRow=flows.length
     ? `<div class="tw" style="max-height:34vh"><table class="dt cond"><thead><tr><th>流水号</th><th>付款日期</th><th>金额</th><th>方式</th><th>操作人</th><th>状态</th></tr></thead><tbody>`
       + flows.map(f=>`<tr class="${f.voided?'ex':''}"><td class="fc">${f.id}</td><td class="now">${f.date}</td><td class="num">${M(f.amt)}</td><td>${enumTag('payMethod',f.method)}</td><td class="sm">${esc(f.op)}</td><td>${f.voided?enumTag('flowState','已撤销')+' <span class="mut sm">'+esc(f.reason)+'</span>':enumTag('flowState','生效')}</td></tr>`).join('')
       + `</tbody></table></div>`
     : '<div class="tip" style="margin:0">这行通知书<b>还没有付款流水</b> —— 尚未付款（或流水已全被撤销）。</div>';
   modal({title:`查看关联 · ${n.code||n.id}`,body:
     `<div class="tip" style="margin-bottom:10px"><b>只读视图</b> —— 看这行通知书的<b>关联与去向</b>：关联了哪张集采合同、已产生哪些付款流水。<b>不改任何数据</b>。</div>
      ${kvBlock([['单据',`<span class="fc">${esc(n.id)} · ${esc(n.code||'（未填编码）')}</span>`],
        ['付款项目',`<span style="font-size:11.5px">${esc(n.proj)}</span>`],
        ['单据名称',`<span style="font-size:11.5px">${esc(n.doc||'—')}</span>`],
        ['分类 / 审批状态',`${ntArchTag(n)||esc(n.cat)} ｜ ${astatTag(n.astat)}`],
        ['集采实际供应商',n.sup?`<span class="fc">${esc(n.sup)}</span>`+(supHas(n)?' '+tag('自动匹配 · 待确认','wn'):''):'<span class="mut">—</span>'],
        ['集采合同关联',jcRow],
        ['审批金额',`<span class="fc">${M(n.approve)}</span>`],
        ['已付金额（生效流水合计）',`<span class="fc">${M(amtLive)}</span>${voided.length?`<span class="mut sm">（另有 ${voided.length} 条已撤销，不计入）</span>`:''}`],
        ['付款状态',stTag(statOf(n))]])}

    改为卡头**一个**导出入口（`ledExpToggle` → 展开区多选项目 → `ledExpOk`）：
    导出形态 = **每个项目一个工作簿**（3 个工作表：辅材欠款 / 机械欠款 / 特殊费用月报表）；≥2 个项目打 zip。 */

 /* ⭐ 接线（`TAIL-04` 路径① · 片 4b）：**活动大表**成品由**后端模板填充**生成 ——
   **一份**（全项目在一张表里：⛔ 不是每项目一份、⛔ 无 zip）· `Sheet1` 20 列（三级表头 ＋ 合计行）。
   ⚠️ 失败时后端回 **JSON 200 ＋ `ok:false` ＋ 中文原因**（**一行都没有** · 模板缺失/损坏 ·
      **显示区对账不过**）⇒ 据 `content-type` 分流：JSON ⇒ 弹原因；否则当文件下载。
   ⚠️ 月份**原样带给后端**（`bjMonth(-1)` = 材料报表类默认 = 上月，§9.2）—— ⛔ 不在前端另算。
   ⛔ 前端不自己拼文件名（命名规则的主人在后端，经 `X-Export-Filename` 带出）。 */
 bigExport:async ()=>{
   const url='/api/m07/big/export?period='+encodeURIComponent(bjMonth(-1));
   let r;
   try{ r=await fetch(url); }
   catch(e){ return toast(`<b>导出没能完成</b>：${esc(String((e&&e.message)||e))}`,8000); }
   const ct=r.headers.get('content-type')||'';
   if(ct.includes('application/json')){
     let d={}; try{ d=await r.json(); }catch(e){}
     return toast(`<b>导出没能完成</b>：${esc(d.message||'后端没给原因')}`,9600);
   }
   if(!r.ok) return toast(`<b>导出没能完成</b>：HTTP ${r.status}`,8000);
   const fn=decodeURIComponent(r.headers.get('x-export-filename')||'')||'经济活动分析大表.xlsx';
   const blob=await r.blob(), a=document.createElement('a');
   a.href=URL.createObjectURL(blob); a.download=fn;
   document.body.appendChild(a); a.click(); a.remove();
   setTimeout(()=>URL.revokeObjectURL(a.href),5000);
   toast(`已导出 <b>${esc(fn)}</b>：一份（全项目一张表）· <b>20 列</b>（三级表头 ＋ 合计行）；`
     + `派生列与合计**已算成数值**（⛔ 不留公式）`,8600); },

 /* —— 集采三张子表的录入 = **表内增行**（2026-09-13 用户口径：发票子表录入要填日期；**取代原先那种浏览器原生输入小窗**）——

 jcSubAdd:t=>{ const j=JCs.find(x=>x.id===t.dataset.id), kind=t.dataset.kind; if(!j||!JCSUB_KIND[kind]) return;
   jcSubKind=kind; jcSubId=j.id; jcSubD={date:(kind==='pay'?SYS_TODAY:''),amt:''};
   jcSubDlg(kind,j.id);
   toast(`已在子表末尾生成<b>一行草稿</b>（尚未保存）—— ${kind==='pay'?'付款日期默认取系统当日，可改':'<b>发票日期必填</b>'}；填完点「保存」落库、点「取消」丢弃`,5600); },
 jcSubSet:t=>{ if(!jcSubKind) return; jcSubD[t.dataset.k]=t.value; },   /* 写草稿层，**不重绘**（避免每改一格就把焦点丢掉） */
 jcSubCancel:()=>{ const k=jcSubKind, id=jcSubId; if(!k) return; jcSubReset(); jcSubDlg(k,id);
   toast('已取消 —— 草稿行丢弃，<b>未写入任何数据</b>'); },
 jcSubSave:()=>{ const j=JCs.find(x=>x.id===jcSubId), kind=jcSubKind; if(!j||!kind) return jcSubReset();
   const dt=String(jcSubD.date||'').trim(), nm=(kind==='pay'?'付款金额':'发票金额'), dn=(kind==='pay'?'付款日期':'发票日期');
   if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)) return toast(`<b>请先填「${dn}」</b>：本子表录入<b>必须填日期</b>（草稿行第一个框）`);
   const v=numOf(jcSubD.amt); if(badMoney(v,{positive:1})) return toast(badMoneyMsg(nm,{positive:1}));
   /* 金额**不设上限**（2026-09-13 用户口径）—— 这里**刻意不接** `overCap`（与「统计两金额 ≤ 审批金额」那条无关）。 */

   else if(kind==='tinv'){ if(!j.tradeInvoices) j.tradeInvoices=[]; j.tradeInvoices.push([dt,v]); }
   else { if(!j.invoices) j.invoices=[]; j.invoices.push([dt,v]); }
   jcSubReset(); render(); jcSubDlg(kind,j.id);
   if(kind==='pay') toast(`已录入付款 <b>${M(v)}</b>（${dt}）→ 欠款 ${M(jcDebt(j))}`);
   else if(kind==='tinv') toast(`已增加贸易公司发票 <b>${M(v)}</b>（${dt}）→ 结算金额 ${M(jcSettle(j))}`);
   else toast(`已增加发票 <b>${M(v)}</b>（${dt}）→ 发票合计 ${M(jcInvSum(j))}`); },

 jcTInvDel:t=>{ const j=JCs.find(x=>x.id===t.dataset.id); (j.tradeInvoices||[]).splice(+t.dataset.i,1); render(); ACT.jcTInvDlg({dataset:{id:j.id}}); },
 jcPayDel:t=>{ const j=JCs.find(x=>x.id===t.dataset.id); j.payments.splice(+t.dataset.i,1); render(); ACT.jcPayDlg({dataset:{id:j.id}}); },
 /* 从付款域引用（R8）：**不做任何自动匹配**（DEV-J-01 已否掉标题 / 名字匹配）→ 纯人工选择；
    且**同一笔通知书只能引用一次**（去重，防付款重复计入） */
 jcPayRef:t=>{ const j=JCs.find(x=>x.id===t.dataset.id);
   /* ⚠️ 去重范围 = **全库**（§6.6.2「同一笔付款通知书只能被引用一次」）—— 原实现只按**单个合同**去重，
      会让同一笔被两个合同各引一次、**付款重复计入** ⇒ 2026-09-13 收敛到全库。 */
   const used=jcUsedNids();

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const nm=t.tagName.toLowerCase();
  if(nm==='input'||nm==='select'||nm==='textarea') return;   /* 表单元素交给 change */

  if(a==='maskBg'){ ACT.maskBg(t,e); return; }
  e.preventDefault(); ACT[a](t,e);
});

document.addEventListener('keydown',e=>{
  /* 「非按钮但可点」元素的键盘等价操作 —— **通用一条，不逐个点名**：
     元素只要声明 `data-act` + `role="button"` + `tabindex="0"`，回车 / 空格即等价于点击
     （焦点框样式见样式表里的 `[data-act][role="button"]:focus-visible`）。
     ⚠️ 真实 `<button>` **不需要**这条（浏览器原生支持回车 / 空格）⇒ 只认带 `role="button"` 的元素，
        否则会与原生行为重复触发。新增可点元素时的做法 = 补那三个属性，**不要再来这里加选择器**。 */
  if(e.key==='Enter'||e.key===' '){
    const t=e.target&&e.target.closest&&e.target.closest('[data-act][role="button"]');
    if(t&&ACT[t.dataset.act]){ e.preventDefault(); ACT[t.dataset.act](t,e); return; }
  }
  if(e.key!=='Escape') return;
  if(pjOpen||plPjOpen||flPjOpen||ledPjOpen||procPjOpen||jcPjOpen||invWhOpen||awfPjOpen||lgPjOpen||jcNPjOpen||ledExpPjOpen||procExpPjOpen||invColOpen!==''||mp.open!==null){ pjOpen=false; plPjOpen=false; flPjOpen=false; ledPjOpen=false; procPjOpen=false; jcPjOpen=false; invWhOpen=false; awfPjOpen=false; lgPjOpen=false; jcNPjOpen=false; ledExpPjOpen=false; procExpPjOpen=false; invColOpen=''; mp.open=null; render(); }
  closeModal(); });

/* =====================================================================
   ⭐⭐ 后端适配层（前端壳）—— 「**原型直接接数据**」的唯一出入口。
   ⛔ 前端**不做任何业务判定**：改分类 / 剔除 / 恢复 一律 POST 给后端，
      由后端**同一批纯函数**（`notice_actions`）判定并落库 —— 一份内容只许一个主人。
   ⚠️ 前端保留的只有**显示逻辑**（筛选 / 排序 / 合计 / 勾选态），它与后端判定**不重叠**。
   ===================================================================== */
/* ⚠️ 分类的**内部值**是英文（`material` / `mechanical` / `jc`），中文只是**显示名** ——
   界面上传下来的是中文 ⇒ 在**这一处**转（映射只写一份，别在动作里各转一遍）。 */
const CAT_API = { '辅材': 'material', '机械': 'mechanical', '集采': 'jc' };

const API = {
  async get(url) {
    const r = await fetch(url, { headers: { Accept: 'application/json' } });
    if (!r.ok) throw new Error(`GET ${url} → HTTP ${r.status}`);
    return r.json();
  },
  async post(url, body) {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    if (!r.ok) throw new Error(`POST ${url} → HTTP ${r.status}`);
    return r.json();              /* ⚠️ 恒 HTTP 200 —— 成败看 `ok` 标志（见 notice_api_router） */
  },
  /* ⭐ `PUT` 等其余方法走这个 —— ⚠️ **失败时把后端的 `message` 原样抛出**：
     `MOD-01` 的状态不变式是「拦了就讲清**为什么 + 怎么解决**」（§2.7.2），
     若只抛 `HTTP 400`，那句"壳下还有 3 个在建小微：A、B、C"就丢了 ⇒ 用户只看到"保存失败"。
     ⛔ 由 `core/errors.py::AppError` 统一转成 `{code, message}` + 对应状态码。 */
  async send(method, url, body) {
    const r = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body || {}),
    });
    const text = await r.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
    if (!r.ok) throw new Error((data && (data.message || data.detail)) || text || `HTTP ${r.status}`);
    return data;
  },
  /* `period=""` ⇒ **全量**（口径见后端 `notice_filters`）—— 筛选用前端 `ntHit` 原样做 */
