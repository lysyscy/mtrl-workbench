<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>材料报表自动化工作台</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
/* ⭐⭐ 2026-09-27（`TAIL-129` 界面大小 · 用户裁定走**方案 B**）：**字号与间距的倍率**（1 = 标准）。
   本页所有 `font-size` / `padding` / `margin` / `gap` 都写成 `calc(Npx * var(--fscale))`，
   壳按**当前用户**的档位在 `documentElement` 上**内联覆盖**这个变量（⛔ 不碰 `theme.css`：
   那里 `--fs` 已用作**字体族**，两个名字只差一个字母，别混）。
   ⚠️⚠️ **这一行默认值绝不能省**：`var()` 取不到值时，`calc(13px * var(--fscale))` 整条**无效**
      ⇒ 字号回落成浏览器默认（16px）⇒ 界面全乱。有了它，**JS 一个字都没跑**时仍是标准档。 */
html{--fscale:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--fs);font-size:calc(13px * var(--fscale));color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;overflow:visible}

/* ---------- 侧栏 ---------- */
/* ⚠️ 侧栏宽度**两处要一起缩**（`width` ＋ `flex` 底宽）：只缩一个 ⇒ flex 那张更"硬"，
   实际宽度**不跟着变**，而两者数值又不一致（自相矛盾 · 2026-09-27 `TAIL-129` 抽查时抓到）。 */
.sb{width:calc(238px * var(--fscale));flex:0 0 calc(238px * var(--fscale));background:var(--sb);color:var(--sb-tx);display:flex;flex-direction:column;overflow-y:auto}
.sb::-webkit-scrollbar{width:calc(8px * var(--fscale))}
.sb::-webkit-scrollbar-track{background:none}
.sb::-webkit-scrollbar-thumb{background:var(--sb-bd);border-radius:4px}
.sb-brand{padding:calc(14px * var(--fscale)) calc(16px * var(--fscale)) calc(12px * var(--fscale));border-bottom:1px solid var(--sb-bd)}
/* ⚠️ 侧栏的**三档文字**各用各的角色（2026-09-21 修）：品牌/悬停 = `--sb-hd`、普通项 = `--sb-tx`、
   次要（编号/分组/页脚）= `--sb-mut`。⛔ **别再借 `--on`**（它是"主色**之上**的前景"）——
   原来 `.sb-brand b` 与 `.sb-i:hover` 用 `--on`，在深色套里 `--on` 是**黑** ⇒ 黑字压深面板。 */
.sb-brand b{display:block;color:var(--sb-hd);font-size:calc(13.5px * var(--fscale));font-weight:500;letter-spacing:.2px}
.sb-brand span{display:block;color:var(--sb-mut);font-size:calc(11px * var(--fscale));margin-top:calc(3px * var(--fscale))}
.sb-g{padding:10px 0 2px}
.sb-g>h5{padding:0 16px 6px;font-size:calc(11px * var(--fscale));color:var(--sb-mut);font-weight:400;letter-spacing:.6px}
.sb-i{display:flex;align-items:center;gap:calc(8px * var(--fscale));padding:calc(6.5px * var(--fscale)) calc(16px * var(--fscale));cursor:pointer;font-size:calc(12.5px * var(--fscale));border-left:2.5px solid transparent;line-height:1.35}
.sb-i:hover{background:var(--sb-hover);color:var(--sb-hd)}
/* 选中项：底 = **主色本尊**（`--sb-on`），字 = `--on`（"主色之上的前景"）⇒ 语义正好、深浅两族都读得清；
   左侧亮边用 `--on`（若仍用 `--pri` 就与底同色、等于看不见）。 */
.sb-i.on{background:var(--sb-on);color:var(--on);border-left-color:var(--on);font-weight:600}
.sb-i .c{font-family:var(--fm);font-size:calc(10.5px * var(--fscale));color:var(--sb-mut);flex:0 0 46px}
.sb-i.on .c{color:var(--sb-on-hl)}
.sb-i.dis{color:var(--sb-dis)}   /* 「暂缓」= 语义标注，不是禁用：该项仍可点进 MOD-10 查看说明页 ⇒ 光标保持 pointer（不用 not-allowed，免得"看着点不动、其实能点"） */
.sb-i.dis:hover{background:none;color:var(--sb-dis)}
.sb-i .m{margin-left:auto;font-size:calc(10px * var(--fscale));color:var(--sb-mut)}
.sb-foot{margin-top:auto;padding:calc(10px * var(--fscale)) calc(16px * var(--fscale));border-top:1px solid var(--sb-bd);font-size:calc(10.5px * var(--fscale));color:var(--sb-mut);line-height:1.6}

/* ---------- 主体 ---------- */
main{flex:1;display:flex;flex-direction:column;min-width:0}
.tb{height:calc(54px * var(--fscale));flex:0 0 54px;background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:calc(14px * var(--fscale));padding:0 18px}
.tb h1{font-size:calc(14.5px * var(--fscale));font-weight:500}
.tb h1 em{font-style:normal;font-family:var(--fm);font-size:calc(11px * var(--fscale));color:var(--mut);margin-left:calc(8px * var(--fscale));font-weight:400}
.tb .sp{margin-left:auto;display:flex;align-items:center;gap:calc(10px * var(--fscale));font-size:calc(12px * var(--fscale));color:var(--tx2)}
.view{flex:1;overflow-y:auto;padding:calc(14px * var(--fscale)) calc(18px * var(--fscale)) calc(40px * var(--fscale))}

/* ---------- 通用件 ---------- */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:calc(12px * var(--fscale));overflow:hidden}
.card>h4{padding:calc(9px * var(--fscale)) calc(13px * var(--fscale));border-bottom:1px solid var(--bd2);font-size:calc(12.5px * var(--fscale));font-weight:500;display:flex;align-items:center;gap:calc(8px * var(--fscale));background:var(--sf2)}
.card>h4 .sp{margin-left:auto;display:flex;gap:calc(6px * var(--fscale));align-items:center;font-weight:400}
.card .bd{padding:calc(12px * var(--fscale)) calc(13px * var(--fscale))}
.card .bd.np{padding:0}
.tip{background:var(--pri-l);border:1px solid var(--pri-bd);border-left:3px solid var(--pri);border-radius:6px;padding:calc(8px * var(--fscale)) calc(11px * var(--fscale));font-size:calc(12px * var(--fscale));color:var(--pri-d);line-height:1.65;margin-bottom:calc(10px * var(--fscale))}
.tip.wn{background:var(--wn-l);border-color:var(--wn-bd);border-left-color:var(--wn);color:var(--wn-d)}
.tip.dg{background:var(--dg-l);border-color:var(--dg-bd);border-left-color:var(--dg);color:var(--dg-d)}
.tip.ok{background:var(--ok-l);border-color:var(--ok-bd);border-left-color:var(--ok);color:var(--ok-d)}
.tip b{font-weight:500}
.tip code{font-family:var(--fm);font-size:calc(11px * var(--fscale));background:var(--code-bg);padding:calc(1px * var(--fscale)) calc(4px * var(--fscale));border-radius:3px}
/* 可折叠的口径说明：默认收起，把纵向空间让给数据 */
details.tip>summary{cursor:pointer;font-weight:500;outline:none;list-style:none}
details.tip>summary::-webkit-details-marker{display:none}
details.tip>summary::before{content:'▸ ';color:var(--pri);font-size:calc(11px * var(--fscale))}
details.tip[open]>summary::before{content:'▾ '}

/* 按钮 */
.btn{font-family:var(--fs);font-size:calc(12px * var(--fscale));padding:calc(4.5px * var(--fscale)) calc(11px * var(--fscale));border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:6px;cursor:pointer;line-height:1.4;white-space:nowrap}
.btn:hover{border-color:var(--bd3);background:var(--sf2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on)}
.btn.pri:hover{background:var(--pri-d)}
.btn.dg{color:var(--dg-d);border-color:var(--dg-bd)}
.btn.dg:hover{background:var(--dg-l)}
.btn.sm{padding:calc(2.5px * var(--fscale)) calc(7px * var(--fscale));font-size:calc(11.5px * var(--fscale))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.gost{border-style:dashed;color:var(--mut)}
/* ⭐ 2026-09-28（`TAIL-142`）：「**已展开 / 已设置**」的按钮态 —— token 与 `.steps .st.on` / `.tabs .tb2.on` **同一套**
   （`--pri-l` / `--pri-bd` / `--pri-d`），⛔ 不为同一个状态另造视觉语言（守则 §4.5）。
   用途：卡头那两个"点开会展开东西"的按钮（`ledPjToggle` / `ledExpToggle`）原来**点开自己不变样**
   ⇒ 用户看不出"到底点上了没有"（守则 §5.5 看着能点必须有反馈 · §4.2 状态必须真实）。 */
.btn.on{background:var(--pri-l);border-color:var(--pri-bd);color:var(--pri-d)}

/* 表格 */
/* 表格滚动容器：必须有高度上限，sticky 表头才「贴得住」。
   否则容器不滚动、整页滚动，表头会跟着一起滚走 —— 表现为「往下拖表头没了」。 */
.tw{overflow:auto;max-height:calc(100vh - 330px);min-height:calc(260px * var(--fscale))}
table.dt{width:100%;border-collapse:collapse;font-size:calc(12.5px * var(--fscale))}
.dt th{position:sticky;top:0;z-index:2;background:var(--sf2);border-bottom:1px solid var(--bd);padding:calc(6px * var(--fscale)) calc(8px * var(--fscale));text-align:left;font-weight:500;color:var(--tx2);white-space:nowrap;font-size:calc(11.5px * var(--fscale))}
/* 「合计」行**统一置底**（2026-09-13 用户口径）：表头贴顶、合计行贴底 ⇒ 数据量大时不用滚到底才看得到（`sumRowOf` 产出的行带 `sumrow` 类）。
   ⭐⭐ **`position:sticky` 必须落在 `<tr>` 上 —— 写在 `>td` 上永不生效**（2026-09-16 修正）：
       `sticky` 作用在 `<td>` 时，它的**包含块是表格行**（行高 = 单元格高）⇒ **没有可位移的空间**。
       实测（真实浏览器 · 容器高 200px · 表内 30 行 · `scrollTop=0`，判据 = 「合计行底 − 容器底」）：
       `td` 写法 = **+792.5px**（合计行在屏幕外，**必须滚到底才看得见**）vs `tr` 写法 = **−1px**（吸附生效）。
       ⚠️ 它**不报错、不崩、只是不生效** ⇒ 只能靠实测抓出来；`_smoke` 的 N27 断言已按此收紧。
   ⚠️ `border-collapse:collapse` 下吸附行的**边框会丢** ⇒ 用 `box-shadow` 补上边线（故 `>td` 那条仍要保留）；
   ⚠️ 吸附行**必须有不透明底色**（否则数据行会透出来）⇒ 底色统一取 `var(--sf2)`（与既有合计行同色）。
   ⚠️ **分组表**（`MOD-07` 焊材/气体提取）不置底 —— 分组合计要紧贴本组，两行同 sticky 会重叠（由 `sumRowOf` 的 `sticky:false` 控制）。
       ⚠️ **不吸附 ≠ 不置底**：`sticky:false` 时合计行仍带 `data-pin`、仍钉在表尾、仍不参与排序。 */
.dt tbody tr.sumrow{position:sticky;bottom:0;z-index:2}
.dt tbody tr.sumrow>td{background:var(--sf2);box-shadow:inset 0 1px 0 var(--bd)}
.dt td{border-bottom:1px solid var(--bd2);padding:calc(5px * var(--fscale)) calc(8px * var(--fscale));vertical-align:middle}
/* 分段竖线（`.vsep`）：`MOD-06` 表①② 按「总求和（本表）」的四段做**视觉分隔**（2026-09-13 用户口径）。
   ⚠️ 只加 `border-left`、颜色走 token（不写死色值 —— 内联样式无硬编码色值的断言对 class 同样成立）。 */
.dt th.vsep,.dt td.vsep{border-left:2px solid var(--bd)}
.dt tbody tr:hover{background:var(--row-hover)}
.dt tbody tr.hl{background:var(--wn-l)}
.dt tbody tr.hl:hover{background:var(--hl-hover)}
.dt tbody tr.ex{color:var(--mut);background:var(--ex-bg)}
.dt tbody tr.ex td{text-decoration:line-through;text-decoration-color:var(--del-line)}
/* ⭐ i8 已撤单行（§4.2.7）：与「剔除」同行样式（.ex），但**左侧加一道警示竖条**，
   并把删除线关掉 —— 撤单不等于"作废的错数据"，它是"源单被删、保留可查"，故只加标识不划掉。
   ⚠️ 有牵涉（ntVoidJoint）时该行**仍算有效**（留在统计里），故本类只表达"来源"，不表达"退出统计"。 */
.dt tbody tr.ntvoid{box-shadow:inset 3px 0 0 var(--wn);background:var(--void-bg)}
.dt tbody tr.ntvoid:hover{background:var(--hl-hover)}
.dt tbody tr.ntvoid td{text-decoration:none}
.dt tbody tr.ntvoid .fl{background:var(--void-bg)}
/* ⭐⭐ 行级「**不会写入**」标记（2026-09-26 用户报障 · 原话：「**这些不会落库的行，要在行上直接标**，
   比如给一个浅色底，或者其他明确提示，这才叫好的前端设计，而不是还要**抬头去看文字说明**」；
   ⛔ 通用导入页都要这么做）。用于 ③ 预览表里域自报 `skipped` 的行 ⇒ **标记落在行上**，
   不是只写在卡片底下的一段话里（那段话要求读者自己把"有 7 行"对上具体的行 —— 做不到）。
   ⚠️ 视觉语言与「i8 已撤单行」`.ntvoid` **同源**（`inset` 左边一道警示竖条 ＋ 浅底），
      ⛔ 别为"又一种状态"另造一套（守则 §4.5 颜色只承担语义 / §4.4 相似元素不制造歧义）。 */
.dt tbody tr.skiprow{box-shadow:inset 3px 0 0 var(--wn);background:var(--wn-l)}
.dt tbody tr.skiprow:hover{background:var(--hl-hover)}
.dt tbody tr.skiprow .fl{background:var(--wn-l)}
/* ⭐⭐ 2026-09-27（用户报障：「**请将所有不写入输出的行也进行标注**」· 他截图里红框的是第 33 行
   「小计」/ 第 34 行「合计」）：**「本来就跳过」**的行（合计/小计 · 说明 · 空行）**也要标**，
   但⛔ **不是警示色** —— 它们没问题、不用用户改（守则 §2.8：**要你处理的** 与 **本来就跳过的**
   必须一眼分得开，混成一种颜色/一个词 ⇒ 用户以为"合计行也要我去改"）。
   ⇒ 同一套视觉语言（浅底），换**中性灰**、并**去掉左侧警示竖条**：
      读成"这行不参与"（同 `.ex` 剔除行的灰），而不是"这行有毛病"。 */
.dt tbody tr.skiprow.plain{box-shadow:none;background:var(--ex-bg)}
.dt tbody tr.skiprow.plain .fl{background:var(--ex-bg)}
/* 「不导入」那枚**中性标签**（灰底、不用警示色 —— 同上）。簇里其余颜色都已有语义，⛔ 别新造色。 */
.tag.t-mut{background:var(--ex-bg);color:var(--mut);border-color:var(--bd)}
.dt tbody tr.pick{background:var(--pri-l)}
.dt tbody tr.pick:hover{background:var(--pri-bd)}
.dt tbody tr.sel{background:var(--sel)}
.dt .num{text-align:right;font-family:var(--fm);font-size:calc(12px * var(--fscale));white-space:nowrap}
.dt .ctr{text-align:center}
.dt .now{white-space:nowrap}
.dt.cond td,.dt.cond th{padding:calc(4.5px * var(--fscale)) calc(7px * var(--fscale));font-size:calc(12px * var(--fscale))}
.fl{position:sticky;left:0;background:var(--sf);z-index:1}
.dt tbody tr:hover .fl{background:var(--row-hover)}
.dt tbody tr.hl .fl{background:var(--wn-l)}
.dt tbody tr.ex .fl{background:var(--ex-bg)}
/* ⭐⭐ `TAIL-175`（2026-09-29 · 用户裁定 `A`）：**月度会大表的首列区**（序号 ＋ 项目名称）两列一起钉 ——
   大表 `min-width:1620px`（20 列横表），往右填「机械费测算 / 合同价 / 产值累计」（手填 6 列正好在最右）
   时首列区会跟着滚走 ⇒ **看不见自己在给哪个项目填**（会填错行）⇒ 守则 §5.9「核心数据一眼可见」。
   ⚠️ 为什么只有这一条（其余全在 `.fl` 里）：房内先例（`m06` / `m03` / `m04` / `m11`）都是**一行**表头，
      首格 `left:0` 就够了；本表是**两行**表头 —— 第 1 行的「序号 / 项目名称」`rowspan="2"` 自己跨两行，
      而第 2 行里**没有**这两列 ⇒ 表头不必另算 `top` 偏移（`.dt th{top:0}` 照旧管）；**只有第 2 列
      要让开第 1 列的宽**，那一条就是下面这行。
   ⚠️ 偏移为什么能写成静态算式（⛔ 别改成"量出来的那个数"）：真机实测（`tools/oneoff/_a175_measure.py`）
      「序号」列宽 = `padding 8×2 ＋「序号」两个汉字 11.5×2 = 39px`，**随 `--fscale` 线性缩放**
      ⇒ 1440 / 1920 / 2560 视口 × 1 / 1.4 档 **六种组合偏差全为 0**（表被拉宽时多出来的宽都给了别的列）。
      ⚠️ 改动「序号」这两个字 / `.dt th` 的字号或内边距 ⇒ 这里必须同批改（真机那支探针会当场红）。
   ⚠️ 合计行首格是 `colspan="2"`（`sumRowOf` 的 `leadSpan:2`）⇒ 它**一格就盖住这两列**，
      ⛔ 别再给它后面那一格挂 `.fl`（那就多钉一列了）。 */
.dt[data-sort-key="m07:bigtable"] .fl + .fl{left:calc(39px * var(--fscale))}

/* 标签 */
.tag{display:inline-block;padding:calc(1px * var(--fscale)) calc(6px * var(--fscale));border-radius:4px;font-size:calc(11px * var(--fscale));line-height:1.55;white-space:nowrap;border:1px solid transparent}
.t-pri{background:var(--pri-l);color:var(--pri-d);border-color:var(--pri-bd)}
.t-ok{background:var(--ok-l);color:var(--ok-d);border-color:var(--ok-bd)}
.t-wn{background:var(--wn-l);color:var(--wn-d);border-color:var(--wn-bd)}
.t-dg{background:var(--dg-l);color:var(--dg-d);border-color:var(--dg-bd)}
.t-in{background:var(--in-l);color:var(--in-d);border-color:var(--in-bd)}
.t-vi{background:var(--vi-l);color:var(--vi-d);border-color:var(--vi-bd)}
.dot{display:inline-block;width:calc(6px * var(--fscale));height:calc(6px * var(--fscale));border-radius:50%;margin-right:calc(5px * var(--fscale));vertical-align:1px}
.d-ok{background:var(--ok)}.d-wn{background:var(--wn)}.d-dg{background:var(--dg)}.d-in{background:var(--in)}.d-pri{background:var(--pri)}.d-vi{background:var(--vi)}

/* 表单/行内编辑 */
select.inp,input.inp,textarea.inp{font-family:var(--fs);font-size:calc(12px * var(--fscale));padding:calc(3px * var(--fscale)) calc(6px * var(--fscale));border:1px solid var(--bd);border-radius:5px;background:var(--sf);color:var(--tx);width:100%}
input.inp.num{text-align:right;font-family:var(--fm)}
input.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-bd)}
input.inp[readonly]{background:var(--sf2);color:var(--tx2);border-style:dashed;cursor:not-allowed}
.ed{background:var(--edit-l)!important;border-color:var(--edit-bd)!important}
.plain{border:1px solid transparent;background:transparent}
.plain:hover{border-color:var(--bd);background:var(--sf)}
/* ---------- 月度会大表手填项（MOD-07 · OPEN-05「上次值带入」）----------
   带入态 = 输入框黄底（复用 .ed）+ 左上角「↺07月」来源标记；本月已录入则白底无标记。 */
.dt td.bigc{position:relative}
.dt td.bigc .ctag{position:absolute;left:5px;top:2px;font-size:calc(9.5px * var(--fscale));font-style:normal;color:var(--wn-d);pointer-events:none}
.dt td.bigc .inp{padding-left:calc(28px * var(--fscale))}
.fbar{display:flex;flex-wrap:wrap;gap:calc(8px * var(--fscale));align-items:flex-end;padding:calc(10px * var(--fscale)) calc(13px * var(--fscale));border-bottom:1px solid var(--bd2);background:var(--sf2)}

/* ⭐ P1-a（2026-09-28）：展开区**外框/间距的四个变体** —— 原先是 9 处**各写一遍内联 style**；
   声明**原样搬过来**（⛔ 一个值都没改）⇒ 外观逐像素不变，只是不再散落在 9 处模板里。
   「.strip」＋「.mb6」= **同一个外观、只差下边距**（⛔ 不并为一条：并了要动值 = 改外观）。 */
.fbar.pane{border:1px solid var(--bd);border-radius:var(--r)}
.fbar.strip{margin:0 0 calc(8px * var(--fscale));border:1px solid var(--bd);border-radius:6px;background:var(--sf2);padding:calc(8px * var(--fscale)) calc(10px * var(--fscale))}

/* ---------- 表头点击排序（数据列表，见 applySorts）----------
   三态：升序 ▲ → 降序 ▼ → 原序 ↕（可反复切换，同一时刻只有一列生效）。
   当前排序列常显且用主色；其余可排序列淡灰，鼠标移上去变深。 */

/* 无障碍焦点框的**唯一出口**：凡「非按钮但可点」的元素，一律 加 `data-act` + `role="button"` + `tabindex="0"`，
   由这一条规则统一给焦点框、由文件末的 keydown 委托统一给「回车 / 空格」—— 两处都只写一遍。 */
[data-act][role="button"]:focus-visible{outline:2px solid var(--pri);outline-offset:-2px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:calc(10px * var(--fscale));margin-bottom:calc(12px * var(--fscale))}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:calc(10px * var(--fscale)) calc(12px * var(--fscale))}

.kpi .v{font-size:calc(19px * var(--fscale));font-weight:500;font-family:var(--fm);margin-top:calc(3px * var(--fscale));letter-spacing:-.3px}
.kpi .s{font-size:calc(11px * var(--fscale));color:var(--mut);margin-top:calc(2px * var(--fscale))}
/* ⭐ 金额 KPI 的单位小字（2026-09-27 · `TAIL-117` 批次 4）：大数字后面跟一个"元"——
   守则 §2.3「关键数字带单位与口径」；⚠️ 用**小字**（大数字旁边再排一个同样大的"元"会抢视线）。 */
.kpi .v .u{font-size:calc(12px * var(--fscale));font-weight:400;color:var(--mut);margin-left:calc(2px * var(--fscale));letter-spacing:0}
/* ⭐ 2026-09-29（`A2` 逐页）：`MONEY` 现在也用在 `.kpi` **之外**了（`m03` 勾选汇总条 · `m05` 台账标题行）
   —— 那些地方**没有单位规则** ⇒ 「元」会跟大数字一样大（而裁定要的是"**小字**"，见上一条注释）。
   ⇒ 补一条**按上下文缩放**的兜底（`em` 相对父级字号，三处各按自己的基准缩）。
   ⚠️ 专指度比 `.kpi .v .u` **低** ⇒ KPI 那处的渲染**一个字都没变**（⛔ 别改成 `.kpi` 那一条的写法）。
   ⚠️ `class="u"` 全仓**只有 `MONEY` 一个出口**用它（实测过）⇒ 加这条不会波及其它元素。 */
.u{font-size:.72em;font-weight:400;color:var(--mut);margin-left:calc(2px * var(--fscale));letter-spacing:0}
.kpi.dg .v{color:var(--dg-d)}
.kpi.wn .v{color:var(--wn-d)}
.kpi.ok .v{color:var(--ok-d)}
.kpi.pri .v{color:var(--pri)}

/* 选中汇总条（付款通知书页：选中上下文指标 + 主操作合并为一条） */

/* ⚠️ `pointer-events:none`（2026-09-26 真机段 ㉑ 量出来的真缺陷）：提示条是**纯提示**、没人给它挂点击，

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--on);padding:calc(9px * var(--fscale)) calc(18px * var(--fscale));border-radius:8px;font-size:calc(12.5px * var(--fscale));z-index:120;box-shadow:0 8px 22px var(--shadow-toast);max-width:70vw;line-height:1.5;pointer-events:none}

/* 按月录入的行标签仅横向固定，表头在垂直滚动时保持可读。 */

<script>
/* =====================================================================
   0. 全局说明
   ⚠️ 本文件内所有项目名 / 供应商 / 人名 / 金额 均为虚构模拟值，仅用于确认交互与口径。
   口径来源：《材料科业务全流程说明书》（§2/§4/§5/§6/§7/§9 + 附录 E/F）
   ⚠️ 局限（如实说明）：本原型是纯前端演示，金额用 Number 计算；正式实现须按 §9.1 用
      Decimal + ROUND_HALF_UP + 判定容差 0（此处只做到「2 位小数 + 远离零的四舍五入」）。
   ===================================================================== */
/* =====================================================================
   📑 目录 —— 改这个文件时「找落点」用。
   ⚠️ **刻意不写行号**：行号会随编辑漂移，那是"副本"、必静默过期；下面给的都是**关键字**，搜一下就能跳过去。
   ── ① 全域与工具层：`0. 全局说明` · `1. 工具层`（UI 原子 / 枚举单出口 `ENUMS` / 表头排序 `applySorts` /
      通用时间选择器 `tmBtn` / 共用项目面板 `projPanel` / 金额出口 `numOf`·`badMoney` / 列定义→表头常量）·
      `1.5 表头点击排序` · `2. 导航与路由`
   ── ② 页面视图 `V.*`（**按代码顺序**，不是导航顺序）：`V.home` 看板 · `V.m03` 付款通知书 · `V.m04` 付款计划 ·
      `V.m05` 付款流水与欠款统计 · `V.m01` 项目档案 · `V.m02` i8 接入层 · `V.m06` 过程资料 ·
      `V.m07` 收发结存与月度会大表 · `V.m08` 库存单据与调整单 · `V.m09` 特殊费用月报表 · `V.m10` 机械费 ·
      `V.m12` 差异登记 · `V.m11` 集采台账 · `V.m14` 规则配置 · `V.m15` 用户管理
   ── ③ 动作与事件：`18. 交互处理器`（`const ACT=` —— 全部交互动作都在这）· `事件委托`
     （click / change / input / keydown ＋ 点面板外收起 —— 都在 `actions.js` 尾部，**没有名单**）·
     文件最末的「启动」区块（搜 `render()` 的首次调用）
   ── ④ 演示数据（都在文件前半段）：`const JC =` 集采合同 · `const BIGVAL` 大表手填
      ⚠️ **付款通知书 / 项目档案 / 付款流水 / 付款计划 / 库存单据（含调整单）/ 收发结存（含月度会大表）/
      特殊费用手填（`AWF`）的演示数据已删除**
      —— 改由 `boot()` 或各自的 `reload*()` 从后端 API 取，见文件末尾「后端适配层」；
      **哪些页已接线看 `WIRED`**（未接线的页在侧栏与顶栏标「原型态」）。
   ── ⑤ 「改一处要顺手同步」的（漏了会**静默失效**、不报错）：`PAGE_LOAD` / `LOAD_DEP`（漏一路 ⇒ 那页拿空数）·
     `_smoke.js` 末尾的 `__X` 导出（新增 / 删除顶层变量）· `_smoke.js` 里的**交互路径数组** ·
     新增页面 / 新增面板要同步更新白名单清单（`FBAR_PAGES` / `PANELS` 之类）
     ⭐ `#2`（2026-09-26）起**没有 `CHG` 名单了**（表单类动作**不必登记** —— `change` 由委托层直呼 `ACT[a]`：
     ⛔ 别再去找那个 `const`；判据守着"名单不许回来"）。
   ── ⑥ ⭐ **留痕的两种形态（2026-09-17 追认，别再猜）**：`V.m01` 的「修改留痕」卡按**下标**读
      **六元数组** `[时间, 项目, 字段, 改前值, 改后值, 改动人]` —— **喂给它的就是数组**；
      其余地方的留痕是 `mkTrail` 产出的**对象** `{obj, field, before, after, by, at, note}`。
      ⇒ 两套形态**并存是既定口径**（不是笔误）：谁喂这张卡，谁负责转成数组
      （本壳里由适配层 `adaptTrail` 转，后端留痕本身是语义对象）。
   ===================================================================== */
/* ⚠️ 此处原有 `const MOCK_NOTE = '本页所有数据均为虚构模拟值…'` —— 2026-09-26 用户裁定去掉
   「已接真数据还挂着假话」这一类抬头文本时一并删除：它**全壳无人引用**（死代码），
   却把一句"对外假话"留在源码里 ⇒ 下一个人搜「虚构模拟值」时会以为"说明里还允许这么说"。 */

/* ---------- 「当前年月」通用取值（2026-09-12 定案） ----------
   用户口径：**取消「全局核算期」这个概念**（原设计被 AI 误判）。各表各自取
   「北京时间所处月份」作为默认筛选值，不再由顶栏统一驱动。
   ⇒ 全前端只留这一个通用函数 bjMonth(偏移月)，各表按需调用：
       · 付款通知书（含其抓取弹窗） → bjMonth(0)   北京时间当月
       · 材料报表类（收发结存等）    → bjMonth(-1)  北京时间上月
   ⚠️ 原型（`demo/`）那边是**固定时钟的演示快照**，⛔ 不去动它；
      而**本壳必须取真时间** —— 原先这里写死 2026-09，一过月全站默认年月就指到**空月份**
      （材料域取上月 ⇒ 更早空），看板「本月抓取」还会照着假月份判（`TAIL-51`）。 */
const _BJ_NOW = (function(){
  /* 北京时间（`Asia/Shanghai` · 中国无夏令时）。优先用时区库；内核不支持 `timeZone` 参数时
     退到「UTC+8 固定偏移」兜底（⛔ 不退到本机时区 —— 口径要的是北京时间，不是"这台机的时间"）。 */
  try {
    const parts = {};
    new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Shanghai',
      year:'numeric', month:'2-digit', day:'2-digit'})
      .formatToParts(new Date()).forEach(p=>{ parts[p.type]=p.value; });
    if(parts.year && parts.month && parts.day) return parts;
  } catch(e){ /* 老内核 ⇒ 走下面的兜底 */ }
  const t = new Date(Date.now() + 8*3600*1000);
  return { year:String(t.getUTCFullYear()),
           month:String(t.getUTCMonth()+1).padStart(2,'0'),
           day:String(t.getUTCDate()).padStart(2,'0') };
})();
const SYS_YM = _BJ_NOW.year + '-' + _BJ_NOW.month;
/* 「今天」（精确到日）：付款计划**每月 10 号生效 → 月末**（§4.3.2），
   「按付款计划勾选」只在窗口内可点 ⇒ 与 SYS_YM 同源取真时间。 */
let SYS_TODAY = SYS_YM + '-' + _BJ_NOW.day;
/* ⭐ **通用件（日期）**· `TAIL-67`：原先 4 处**逐字相同**地各写一份 ⇒ 抽成一个主人。
   ⚠️⚠️ **必须放在这里（`index.html` 的切片外公共层）**，⛔ 别放 `shell/core.js` ——
       `bjMonth()` 在**壳脚本初始化期**就调用它，而 `shell/*.js` 是**内联脚本之后**才加载的
       ⇒ 放那边 = `ymOf is not defined` ⇒ **整个壳白屏**（2026-09-21 实测踩到一次）。 */
const ymOf = t => t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0');
const ymdOf = t => ymOf(t) + '-' + String(t.getDate()).padStart(2, '0');
const bjMonth = (off=0)=>{ const [y,m]=SYS_YM.split('-').map(Number); const t=new Date(y, m-1+off, 1);
  return ymOf(t); };

/* ---------- 项目档案（ENT-01） MOD-01 ---------- */
/* name = 仓库名（唯一标识、不可改）；disp = 展示名（默认取仓库名、可人工改）；壳无仓库亦无展示名 */
/* ord = **自定义排序号**（2026-09-13 新增）。⚠️ 它挂在**档案行**上 —— 说"项目排序"其实是
   **仓库排序**（仓库名 = 唯一标识，§9.8-4）⇒ 不论某处列出的是**全名 / 仓库名 / 展示名**，
   只要能定位到同一条档案行，就按**同一条 ord** 排。追加在末尾，既有 9 元素的行 ord = undefined。 */
const V={}, BIND={};
/* 渲染后加工按登记顺序运行；每次重建 #view 后各跑一次。
   不捕获旧钩子、不吞异常；局部返回只结束当前步骤。 */
function addBind(view, step){ (BIND[view] ||= []).push(step); }
function runBind(view){ for(const step of BIND[view] || []) step(); }
/* ⭐⭐ **已接后端**的视图（`boot()` 拉真数据）—— 侧栏与顶栏据此标注。
   ⚠️ 必须**按页说实话**：已接线的页**不是**模拟数据，否则用户没法判断"哪一页能信"。
   接线一页就往这里加一个（与 `ADAPTED` 同步）；⛔ 不许含糊成"全部都是模拟值"。 */
/* =====================================================================
   3. 看板
   ===================================================================== */
V.home=()=>{
  const d=debts();
  /* ⭐ i8 已撤单（ntLive）—— 撤单行**退出统计**；有牵涉（付款/关联）时仍算有效，直到人处理完 */
  const nIn=NO.filter(ntLive).length, nEx=NO.filter(n=>n.excl).length, nUn=NO.filter(n=>ntLive(n)&&n.astat==='未批').length;
  const nPaid=NO.filter(n=>ntLive(n)&&statOf(n)==='已付清').length;
  const nVoid=NO.filter(ntVoid).length;
  const ph=PJs.filter(p=>p.name.startsWith('未建仓-'));               /* 占位行 = 「陌生仓库」告警的由来 */
  /* ⭐⭐ 2026-09-28（用户口径 · 看板补两项真待办）：下面两项都是**已经存在的事实**，只是原先没人报出来。
     · `nNoLink`「集采未关联合同」= **有效 且 集采 且 未关联合同 且 未付清** —— 这类**付不了款**
       （付款闸 `ntPayBlock` 的 ③ 就是它；支付路径见「补付」流程）；已付清的不必再关联，故排除。
     · `nVoidJ`「撤单但有牵涉」= i8 已撤单却**仍挂着付款流水 / 集采关联** —— 按 §4.2.7 **仍参与统计**，
       必须人先撤销付款 / 解绑关联它才退出统计（这类"账不准"是真正要处理的）。
     ⚠️ 两项一律走本域出口（`ntJcUnlinked` / `ntVoidJoint`），⛔ 本页不另写判定。 */
  const nNoLink=NO.filter(n=>ntLive(n)&&ntJcUnlinked(n)&&statOf(n)!=='已付清').length;
  const nVoidJ=NO.filter(ntVoidJoint).length;
  const mx=Math.max(...WHs.map(w=>w.rows));
  /* ---------- ⭐ 2026-09-14 看板改造：本页定位 = **待办页**（不再是概览页）----------
     8 项待办，每项一个 `.kpi` 瓦片：`data-todo`（机器把手）· `data-n`（待办数，0/1 = 有没有）
     · `.s` 里一个 `data-act="go"` 链接（点它直达对应页面）。**零新增 CSS**（复用 `.kpis` / `.link` / `.tip`）。
     ⚠️ 数字一律**实时算**、不得写死（`_smoke` 第 10f 组逐项复核：数字必须与数据源一致）。
     口径出处逐项：① §4.4.2 · ② §2.5.1 · ③ §4.3.4 · ④ §6.5.3 · ⑤ §5.8.3 · ⑥ §2.4.2 · ⑦⑬ §3.1.3 · ⑭ §4.6 */
  const nOwn=NO.filter(n=>ntLive(n)&&isShellFull(n.proj)&&!ntProjKey(n)).length;
  /* ② 是**兜底项** —— 按 §2.5.1「归属未走完 ⇒ 整批不入库」⇒ 口径上**常态为 0**（演示数据里也是 0，
     与项目档案 P12 的注释一致）；留着是为了「万一有行因数据问题没归属上，看板能亮」。 */
  const nPl =PLs.filter(p=>plRev(p,PLs)!=='完全匹配').length;   /* ③ §4.3.4 的 6 种判定，除「完全匹配」外全算未匹配 */
  const nAdj=IVs.filter(iv=>adjOf(iv)).length;                  /* ⑤ §5.8.3 差异的**载体 = 调整单** */
  /* ⑦⑬⑭ 取自**执行记录**（§3.1.3 / §4.6）—— 数一律从 `homeCounts()` 来：见它的定义处。 */
  const H=homeCounts(), hErr=!!H.err, HC=H.counts, HL=H.latest;
  const fDone=!hErr&&HC.fetchDue===0;                                       /* 本月有没有**成功**的抓取 */
  const fFail=hErr?null:HL.fetchFail;                                       /* 最近一次抓取失败 */
  const pFail=hErr?null:HL.printFail;                                       /* 打印投递失败 */
  const tN=nOwn+nPl+ph.length+nNoLink+nVoidJ+(fDone?0:1);
  /* 瓦片出口：`k` 把手 · `n` 待办数 · `cls` 语义色 · `v` 显示值 · `s` 说明（自带尾分隔）· `pg` 落点页 · `tx` 链接文字 */
  const tile=(k,n,cls,t,v,s,pg,tx)=>'<div class="kpi '+(n?cls:'todo-clear')+'" data-todo="'+k+'" data-n="'+n+'"><div class="k">'+t
    +'</div><div class="v">'+v+'</div><div class="s"><span>'+s+'</span><span class="link" data-act="go" data-k="'+pg+'" tabindex="0" role="button">'+tx+' →</span></div></div>';
  /* ⚠️ ⑦⑬⑭ 三格**依赖取数**：拿不到就**如实说**（显「—」＋原因），
     ⛔ 不拿 0 冒充"没有待办"（铁律 4：「没数据就留空 / 标待接通，不写 0 冒充」）。 */
  const runTile=(k,n,cls,t,v,s,pg,tx)=>hErr
    ? tile(k,0,'wn',t,'—','<span class="dg">⚠️ 执行记录没取到（这三项要它）</span> · ',pg,tx)
    : tile(k,n,cls,t,v,s,pg,tx);
  /* 2026-09-28（用户口径 · 看板清账）：删掉 4 个瓦片 —— <b>未审批通知书 · 差异（看调整单）·
     最近一次抓取失败 · 打印投递失败</b>（用户判「全无用」）。⛔ 别再加回来（删除已登记）。
     保留：归属待指定 / 付款计划未匹配 / 占位行待扶正 / 本月抓取；⭐ 同日**随后又加了 2 项**（集采未关联合同 / 撤单但有牵涉 —— 见上面 `nNoLink` / `nVoidJ` 那段），本行原先只写了前 4 项 ⇒ 2026-09-29（`A11` 逐页）订正。
     ⚠️ 上面那几个口径表达式（nUn / nAdj / fFail / pFail）**刻意留着** —— 它们是本域出口的留痕，
     删了会让"口径只许有一个出口"这条判据失去靶子（判据改指见 test_acc_home_todo.py）。 */
  const todoTiles=[
    tile('ownership',nOwn,'wn','归属待指定',nOwn,'尚未确定所属项目的通知书','m03','去指定归属'),
    tile('planUnmatched',nPl,'wn','付款计划未匹配',nPl,'需要核对单据号或金额的计划行','m04','去付款计划'),
    tile('placeholder',ph.length,'wn','占位行待扶正',ph.length,ph.length?('陌生仓库占位行：「'+esc(ph.map(p=>p.name).join('、'))+'」 · '):'— · ','m01','去项目档案'),
    tile('jcUnlinked',nNoLink,'wn','集采未关联合同',nNoLink,'未挂合同的集采通知书<b>付不了款</b>（已付清的不计） · ','m03','去关联合同'),
    tile('voidJoint',nVoidJ,'dg','撤单但有牵涉',nVoidJ,'i8 已撤单却仍挂着付款 / 关联 —— 仍参与统计，要先撤销付款 / 解绑 · ','m03','去处理'),
    runTile('fetchDue',fDone?0:1,fDone?'ok':'wn','本月抓取',fDone?'已抓':'未抓','本月（'+bjMonth()+'）'+(fDone?'已有成功抓取':'尚无成功抓取')+' · ','m02','去抓取任务')
  ];
  return `<div class="card"><h4>待办<span class="sp"><span class="mut sm">${tN?`共 ${tN} 项需处理`:'当前没有需要处理的事'}</span></span></h4>
    <div class="bd"><div class="todo-grid">${todoTiles.join('')}</div></div></div>`;
  /* 业务事实监测告警卡已撤（2026-09-14 看板改造）：① 事实 1 并入上方「占位行待扶正」瓦片
     —— 两者同一数据源（PJs.filter(p => p.name.startsWith('未建仓-'))）；
     ② 事实 2（档案行数 vs i8 仓库数）按 2026-09-12 用户口径「不需要这个监控相关的东西」随卡移除。 */
};

/* =====================================================================
   4. MOD-03 付款通知书
   ===================================================================== */
V.m03=()=>{
  const inM=n=>tmIn(fNt.month,n.date);
  const list=ntHit(fNt);
  const pk=[...pickSet].map(id=>NO.find(n=>n.id===id)).filter(Boolean);

V.m06=()=>{
  const rows0=procRows(procPj,false), rows1=procRows(procPj,true);
  const a0=procAgg(procPj,false);                       /* ⚠️ 现只用来取「机械 6 列」的段长度（`a0.m.length`）—— 原「卡内 kv 区」那个用途**早已不在切片里**（2026-09-29 `A4` 核实）⇒ ⛔ 别再按「供 kv 用」找它。⚠️ 改它要同批动下面两处分段求和（`totMTax` / `totMNoTax`） */
  const adjs=PROC_MATRIX[procPj]?.diffs||[], diffTotals=PROC_MATRIX[procPj]?.diff_totals||{};
  /* ⭐ 2026-09-13 用户口径：按「总求和（本表）」那**四段**，给整张表（表①/表②）做**视觉分隔** ——
     段首列加 `.vsep`（左侧 2px 竖线），**表头 / 数据行 / 合计行 / 总求和行四处一致**。
     段首列下标（0 = 核算月）：`1` 入库 · `6` 出库 · `11` 机械左 4 列 · `15` 不含税 2 列。
     ⚠️ `15` 是"机械 6 列里的第 5 列"⇒ 机械段被一分为二，正好对上总求和的第三 / 第四段。
     ⚠️ 定义必须写在 `head` **之前**（`const` 有 TDZ，模板里用到会直接抛错）。 */
  const SEG=[1,6,11,15];
  const vs=i=>SEG.indexOf(i)>=0?' class="vsep"':'';
  const vsc=i=>SEG.indexOf(i)>=0?' vsep':'';
  const head=`<th class="fl">核算月</th>${IVC5.map((c,i)=>`<th${vs(1+i)}>入库${c}</th>`).join('')}${IVC5.map((c,i)=>`<th${vs(6+i)}>出库${c}</th>`).join('')}<th${vs(11)}>租分公司设备</th><th>内租设备</th><th>外租零租含税</th><th>外租包月含税</th><th${vs(15)}>外租零租不含税</th><th>外租包月不含税</th>`;   /* ⭐ `TAIL-64` P2②（2026-09-29）：本常量**只留 `<th>`** —— 外层 `<thead><tr>` 由表格件 `TBL` 统一拼（与 `*_THEAD` 那批同一个形态）⇒ ⛔ 别把 `<tr>` 加回来（会双套）。 */
  const mH=['租分公司设备','内租设备','外租零租含税','外租包月含税','外租零租不含税','外租包月不含税'];
  const row=(a,b,isAdj)=>`<tr><td class="fl fc" style="white-space:nowrap">${a.ym}</td>${IVC5.map((c,i)=>`<td class="num${isAdj&&a.inC[c]!==b.inC[c]?' ed':''}${vsc(1+i)}">${M(a.inC[c])}</td>`).join('')}${IVC5.map((c,i)=>`<td class="num${isAdj&&a.outC[c]!==b.outC[c]?' ed':''}${vsc(6+i)}">${M(a.outC[c])}</td>`).join('')}${a.m.map((v,j)=>`<td class="num${vsc(11+j)}"><input class="inp num" style="width:100%;min-width:calc(88px * var(--fscale))" data-act="procMechSave" data-submit-act="procMechSave" data-wh="${esc(procPj)}" data-ym="${esc(a.ym)}" data-i="${j}" value="${esc(v==null?'':String(v))}" aria-label="${esc(a.ym+' '+mH[j])}"></td>`).join('')}</tr>`;
  /* 表① = 原始；表② = 调整后（**逐月**与原始比对，被改过的格标 `ed`） */
  const body = procTab===1 ? rows1.map((a,i)=>row(a,rows0[i],true))
                           : rows0.map(a=>row(a,a,false));       /* ⭐ `TAIL-64` P2②：**不在这里 `join`** —— 直接把行数组交给 `TBL` 的 `rows`（拼装是它的事）。 */
  /* ⭐ 求和（2026-09-13 用户口径）：
     ① **每个数据列下方**加「合计」行 —— 入库 5 类 / 出库 5 类 / 机械 6 列**逐列垂直求和**；
     ② 另加「总求和」行 —— **入库 / 出库 / 机械** 三组各一个横向总计（用户要的"额外的总求和"）。
     ⚠️ 机械 **6 列全部**参与（含「外租零租不含税 / 外租包月不含税」两列 —— 用户明确要求一并加）。
     ⚠️ 合计跟着**当前显示的那批**走（表① 看原始 / 表② 看调整后），不是恒取其中一批。 */
  const cur = procTab===1 ? rows1 : rows0;
  const totals = procAgg(procPj,procTab===1);
  const sumIn = c => totals.inC[c];
  const sumOut = c => totals.outC[c];
  const sumM = i => totals.m[i];
  const segments = PROC_MATRIX[procPj]?.segments?.[procTab===1?'adjusted':'raw']||[];
  const totIn = segments[0]?.total;
  const totOut = segments[1]?.total;
  /* 机械 6 列**分两段**（列序：0 租分公司设备 · 1 内租设备 · 2 外租零租含税 · 3 外租包月含税 ·
     4 外租零租不含税 · 5 外租包月不含税）：**左 4 列**一段、**不含税 2 列单独**一段 ——
     用户 2026-09-13 明确：不含税两列**单独求和**，不并入左 4 列那一段。 */
  const MACH_TAX_N = 4;
  const totMTax = segments[2]?.total;
  const totMNoTax = segments[3]?.total;
  const sumRow = `<tr class="sumrow" style="background:var(--sf2);font-weight:500"><td class="fl" title="所选项目、当前原始或调整后表的全部月份逐列合计；材料按本表有效历史段和i8取值，机械含六列，含税与不含税分段">合计</td>`
    + IVC5.map((c,i)=>`<td class="num${vsc(1+i)}">${M(sumIn(c))}</td>`).join('')
    + IVC5.map((c,i)=>`<td class="num${vsc(6+i)}">${M(sumOut(c))}</td>`).join('')
    + a0.m.map((_,i)=>`<td class="num${vsc(11+i)}">${M(sumM(i))}</td>`).join('') + `</tr>`;
  /* 总求和行：四段各占一段（`colspan` = 该段列数）⇒ 行内单元格数之和恒等于表头列数。
     ⚠️ 行标签带「（本表）」是**刻意消歧**：本行 = **当前显示的那批**（表① 原始 / 表② 调整后）；当年旁边那块「卡片 kv 区」（它那三个「入库合计 / 出库合计 / 机械合计（手填）」才是**全月 · 原始**值）**早已不在切片里**（2026-09-29 `A4` 核实）⇒ 后缀保留照旧、防再混。
     ⚠️ **本注释必须保持 2 行**：`U1` 逐行对位，多/少一行会让它后面**所有行**报漂移（本批实测 ＋2 行 ⇒ 一次 101 条）。 */
  const totRow = `<tr style="background:var(--sf2);font-weight:500"><td class="fl" style="white-space:nowrap">总求和（本表）</td>`
    + `<td class="num vsep" colspan="${IVC5.length}">入库合计 ${M(totIn)}</td>`
    + `<td class="num vsep" colspan="${IVC5.length}">出库合计 ${M(totOut)}</td>`
    + `<td class="num vsep" colspan="${MACH_TAX_N}">机械合计 ${M(totMTax)}</td>`
    + `<td class="num vsep" colspan="${a0.m.length - MACH_TAX_N}">不含税合计 ${M(totMNoTax)}</td></tr>`;
  return `
    
  <div class="card" style="margin-bottom:0">
    <h4>过程资料<span class="sp pjwrap" style="position:relative"><!-- 批量导出在同一弹窗选择项目并确认；页面筛选保持独立单选。 -->

      <button class="btn pri" data-act="exp" data-t="过程资料" data-sub="${procTabName()}" title="这一份（朴素）导出还没有落点 —— 点了会如实说明（⛔ 不假装成功）；要按模板导出请用上面的入口">导出 Excel</button>
    </span></h4>
    ${FBAR({body:`
      <div class="fi pjwrap" style="position:relative"><label>项目</label>
        ${PJB({act:'procPjToggle',panel:procPjPanel,w:210,label:`${esc(PROJ_META_KEY(procPj).nm)}`})}
        ${pjIsOpen('procPj')?procPjPanel():''}</div>
    `})}
    <div class="tabs">
      <div class="tb2 ${procTab===0?'on':''}" data-act="procTab" data-i="0" tabindex="0" role="button">表① 原始表</div>
      <div class="tb2 ${procTab===1?'on':''}" data-act="procTab" data-i="1" tabindex="0" role="button">表② 调整后表</div>
      <div class="tb2 ${procTab===2?'on':''}" data-act="procTab" data-i="2" tabindex="0" role="button">差异表<span class="n">${adjs.length}</span></div>
    </div>
    ${procTab===2?`<div class="tw">${TBL({head:DIFF_THEAD,
      rows:adjs.length?[adjs.map(a=>{return `<tr><td class="fc">${esc(a.doc_no)}</td><td class="fc">${esc(a.seq)}</td><td>${esc(a.material)}</td><td class="sm">${esc(a.warehouse)}</td>
        <td class="num">${M(a.before)}</td><td class="num ed">${M(a.after)}</td><td class="num" title="差额 = 调整后 − i8 原值；方向看符号（正 = 上调 / 负 = 下调）">${SIG(a.delta)}</td>
        <td class="sm">${esc(a.remark)}</td><td class="sm">${esc(a.operator)}</td><td class="fc sm">${esc(a.at)}</td>
        <td class="ctr"><span class="link" data-act="goInvAdj" data-wh="${esc(a.warehouse)}" data-iv="${a.id}" tabindex="0" role="button">查看原始行 →</span></td></tr>`}).join('')
        /* ⭐ 差异表也在数据列下方加合计（用户口径：表①②③都加）—— 可求和的只有「原值 / 调整后 / 差额」3 列 */
        + `<tr class="sumrow" style="background:var(--sf2);font-weight:500"><td class="fl" colspan="4">合计</td>`
          + `<td class="num">${M(diffTotals.before)}</td>`
          + `<td class="num">${M(diffTotals.after)}</td>`
          + `<td class="num">${SIG(diffTotals.delta)}</td><td colspan="4"></td></tr>`]
      :[],
      empty:EMPTYROW(thCount(DIFF_THEAD), '该项目无调整，原始表与调整后表一致', '无需处理')})}</div>`:
    `<div class="tw">${TBL({head,rows:body,sum:sumRow+totRow})}</div>`}
    
  </div>`;
};

     （月度报表做的是**上一个月**的账）。此前 MOD-08 / MOD-09 两页**没有月份入参**，

   键仍是**仓库名**（§2.7.4；一个项目只有一个仓库 ⇒ 1:1），显示名走 `PROJ_META_KEY`。 */
V.m08=()=>{
  const list=IVs.filter(iv=>tmIn(fIvYm,iv.dd)&&(!invWhs.length||invWhs.indexOf(iv.wh)>=0)&&(!invOnlyAdj||adjOf(iv))&&(fIvDir==='全部'||iv.dir===fIvDir)&&IV_FCOL.every(c=>ivColPass(iv,c.i)));
  const inS=N2(list.filter(iv=>iv.dir==='入库').reduce((a,iv)=>a+amtOf(iv),0));
  const outS=N2(list.filter(iv=>iv.dir==='出库').reduce((a,iv)=>a+amtOf(iv),0));
  const adS=N2(list.reduce((a,iv)=>a+sumAdj(iv),0));
  /* ⭐ **表内「合计」行**（2026-09-13 用户口径更正：求和一律落在**表内**，与月度会大表同款 —— 表外求和条已删）。
     走唯一出口 `sumRowOf`：列数按 `INV_THEAD` 派生（`<td>` 数 = 表头列数，不可求和的列给空 `<td>`）；
     行首写「合计」⇒ `applySorts` 把它**钉在表尾**，所以本表虽可排、合计天然不会被卷进排序。
     数据源就是 `list` ⇒ **随筛选变动**。
     ⚠️ 只求**有业务意义的 4 个数值列**（数量 / 金额 / 调整后金额 / 价税合计）——
       两个单价列（不含税单价 / 含税单价）**刻意不求和**（单位价无业务含义）⇒ 在合计行里是空 `<td>`。 */
  const invSums={6:rs=>rs.reduce((a,iv)=>a+Number(ivRaw(iv,6)),0),
                 9:rs=>N2(rs.reduce((a,iv)=>a+Number(ivRaw(iv,9)),0)),
                 10:rs=>N2(rs.reduce((a,iv)=>a+Number(ivRaw(iv,10)),0)),
                 11:rs=>N2(rs.reduce((a,iv)=>a+Number(ivRaw(iv,11)),0))};
  return `

      <div class="fi"><label>供应商</label><input class="inp" id="fSup" data-act="jcFilter" value="${esc(fJc.sup)}" placeholder="模糊搜索"></div>

      <button class="btn" data-act="jcReset">重置</button>
      ${jcProjTxt()?`<div style="font-size:calc(15px * var(--fscale));font-weight:600;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:calc(10px * var(--fscale))" title="${esc(jcProjTxt())}">${esc(jcProjTxt())}</div>`:''}

    `})}
    ${jcNewOn?jcNewStrip():''}
    <div class="tw">${TBL({head:jcThead(),key:'m11:jc',
    rows:jcRows.map(j=>{
      const nextArchive=archiveNumbers.get(j.proj)||'1';
      const cells = {
        project_seq: `<td class="fc" title="项目内动态序号，筛选不变">${j.projectSeq == null ? '—' : j.projectSeq}</td>`,
        date: `<td class="now">${j.date}</td>`,
        material: `<td><button class="btn sm" style="white-space:normal;text-align:left" data-act="jcMaterialOpen" data-id="${j.id}" title="修改材料名">${esc(j.material)||'填写材料名'}</button></td>`,
        contract_no: `<td class="fc">${esc(j.contractNo||'—')}</td>`,
        supplier: `<td class="sm">${esc(j.supplier)}</td>`,
        contract_amt: `<td class="num">${j.contractAmt?M(j.contractAmt):'<span class="mut" title="供应商合同价为空 —— 若是贸易公司合同，需从 Excel 的「供应商线」手工填进来（填完不被抓取覆盖）">— 待补</span>'}</td>`,
        inv_sum: `<td class="num" style="white-space:nowrap" title="发票金额 = 本合同供应商发票子表金额合计；不计贸易公司发票，不按发票日期截断">${M(jcInvSum(j))} <button class="btn sm" data-act="jcInvDlg" data-id="${j.id}" title="打开「供应商发票子表」（发票日期 + 金额 · 1..N 张）">子表</button></td>`,
        trade_co: `<td class="sm">${j.tradeCo?esc(j.tradeCo):'<span class="mut">—</span>'}</td>`,
        trade_contract_amt: `<td class="num">${j.tradeContractAmt?M(j.tradeContractAmt):'<span class="mut">—</span>'}</td>`,
        trade_inv_sum: `<td class="num" style="white-space:nowrap" title="贸易公司发票金额 = 本合同贸易公司发票子表金额合计；不计供应商发票，不按发票日期截断，无贸易公司显示—">${j.tradeCo?`${M(jcTradeInvSum(j))} <button class="btn sm" data-act="jcTInvDlg" data-id="${j.id}" title="打开「贸易公司发票子表」（同款 · 发票日期 + 金额）">子表</button>`:'<span class="mut">—</span>'}</td>`,
        settle: `<td class="num" title="结算金额 = 本合同发票子表金额合计；有贸易公司取贸易公司发票，无贸易公司取供应商发票，两侧不相加，不按发票日期截断"><b>${M(jcSettle(j))}</b></td>`,
        pay_sum: `<td class="num" style="white-space:nowrap" title="付款金额 = 本合同付款子表金额合计；手工和付款域引用都计入，不跨合同、不按付款日期截断"><b>${M(jcPay(j))}</b> <button class="btn sm" data-act="jcPayDlg" data-id="${j.id}" title="打开「付款子表」（手工录入 / 从付款域引用）">子表</button></td>`,
        debt: `<td class="num" style="color:${jcDebt(j)>0?'var(--dg)':'var(--ok)'}" title="欠款金额 = 本合同结算金额 − 付款子表金额合计；结算按有无贸易公司取对应发票子表，付款含手工及付款域引用，不按日期截断"><b>${M(jcDebt(j))}</b></td>`,
        method: `<td><input class="inp plain" style="min-width:110px" data-act="jcMethod" data-id="${j.id}" value="${esc(j.method)}" title="${esc(j.method)}" placeholder="自由文本"></td>`,
        remark: `<td><input class="inp" style="min-width:104px" data-act="jcRemark" data-id="${j.id}" value="${esc(j.remark)}" placeholder="可填"></td>`,
        tag: `<td class="ctr">${tagChip(j.tag)}</td>`,
        arch: `<td class="ctr">${archChip(j.arch)}</td>`,
        arch_no: `<td><input class="inp plain" style="min-width:104px" data-act="jcArchNo" data-submit-act="jcArchNoEnter" data-id="${j.id}" value="${esc(j.archNo)}" placeholder="${nextArchive}" title="本项目下一个存档号：${nextArchive}（已填最大号 + 1）；空框按两次回车填入并保存"></td>`,
        ret_date: `<td><input class="inp plain" type="date" style="min-width:134px" data-act="jcRetDate" data-id="${j.id}" value="${esc(j.retDate)}"></td>`,
        ops: `<td class="ctr now">
        ${j.tag==='不纳入'?`<button class="btn sm pri" data-act="jcTag" data-id="${j.id}" data-v="纳入台账">纳入台账</button>`
          :`<button class="btn sm" data-act="jcTag" data-id="${j.id}" data-v="不纳入">不纳入</button>`}
        <button class="btn sm" data-act="jcArch" data-id="${j.id}">推进存档</button>
      </td>`
      };
      return `<tr class="${j.tag==='不纳入'?'ex':''}">
      <td class="ctr fl"><input type="checkbox" class="chk" data-act="jcPick" data-id="${j.id}" ${jcPick.has(j.id)?'checked':''}></td>
      ${JC_COLUMNS.map(c => cells[c.key] ?? jcDefaultCell(j,c)).join('')}</tr>`;
    }),
    sum:jcRows.length?sumRowOf(jcThead(),jcRows,jcSumColumns(),
        {tip:'当前筛选结果（含「不纳入」行）的合计；「贸易公司合同金额」为空的行按 0 计'})
      :EMPTYROW(thCount(jcThead()), '当前筛选条件下没有集采合同', '换个「三态标记 / 合同存档情况 / 项目」，或清空「供应商」搜索词')})}</div>
  </div>`;
};

/* =====================================================================
   16. MOD-14 规则配置
   ===================================================================== */
V.m14=()=>`
  <div class="card"><h4>剔除规则（<b>${RULE_EX.length}</b> 类有效）<span class="sp"><button class="btn sm" data-act="ruleAdd" title="新增一条剔除规则（弹窗填「规则类别 / 命中值 / 业务含义」）">＋ 增加规则</button></span></h4>
    <div class="bd np">${TBL({head:'<th>规则类别</th><th>命中值（多个用 ｜ 分隔）</th><th>剔除的业务含义</th><th>操作</th>',rows:[
      ...RULE_EX.map((r,i)=>`<tr><td><b>${esc(r[0])}</b></td><td class="fc">${esc(r[1])}</td><td class="sm mut">${esc(r[2])}</td>
      <td class="ctr"><button class="btn sm" data-act="ruleEdit" data-i="${i}" title="改这条规则的「规则类别 / 命中值 / 业务含义」">编辑</button> <button class="btn sm dg" data-act="ruleDel" data-i="${i}" title="删除这条规则（配置类数据 = 硬删、不留痕，§9.4）">删除</button></td></tr>`)
    ]})}</div>
    <div class="bd"><div class="tip wn" style="margin:0"><b>剔除规则中不得配置「收款单位 = 资产处集中采购」</b>：集采<b>不走剔除</b>，而是参与<b>分类</b>。</div>
      </div>
  </div>
  <div class="card" style="margin-bottom:0"><h4>集采项目剔除名单（<b>${(window.JCI_ALL||[]).filter(x=>x.active).length}</b> 项在用）</h4>
    <div class="bd np">${TBL({head:'<th>项目全名</th><th>加入理由</th><th>操作人</th><th>加入时间</th><th>状态 / 操作</th>',rows:[
      ...((window.JCI_ALL||[]).length ? (window.JCI_ALL||[]).map(x=>{
        const act = x.active
          ? '<button class="btn sm dg" data-act="jciSet" data-id="'+x.id+'" data-on="0" title="停用：抓取不再剔除它（记录留在册，可随时恢复）">停用</button>'
          : '<button class="btn sm" data-act="jciSet" data-id="'+x.id+'" data-on="1" title="恢复：重新参与抓取剔除">恢复</button>';
        return '<tr'+(x.active?'':' class="mut"')+'><td>'+esc(x.name_full)+'</td>'
          +'<td class="sm mut">'+esc(x.reason||'')+'</td><td class="sm fc">'+esc(x.operator||'')+'</td>'
          +'<td class="sm fc">'+esc(x.created_at||'')+'</td>'
          +'<td class="ctr">'+(x.active?'在用 ':'已停用 ')+act+'</td></tr>';
      }) : ['<tr><td colspan="5" class="mut">名单为空 —— 目前没有「不要的项目」</td></tr>'])
    ]})}</div>
    <div class="bd">${FBAR({body:`<div class="fi"><label>加入一项（粘贴<b>项目全名</b>）</label><input class="inp" id="jciName" placeholder="例：某某项目安装工程"></div>
      <div class="fi"><label>理由（可选）</label><input class="inp" id="jciWhy" placeholder="例：老项目，款已付清"></div>
      <button class="btn pri sm" data-act="jciAdd" title="加入后：该项目从下次抓取起不再写入，也不再进「未写入」清单">加入剔除名单</button>`})}</div>
    
  </div>
  <div class="card"><h4>机械报表项目匹配（${(window.MECH_RULES||[]).length} 项）</h4>
    <div class="bd np">${TBL({head:'<th>项目</th><th>报表项目名（多个用 ｜ 分隔）</th><th>操作</th>',rows:
      (window.MECH_RULES||[]).map((r,i)=>`<tr><td>${esc(r.display)}</td><td><input class="inp" style="width:100%" id="mechRule${i}" value="${esc(r.aliases.join(' ｜ '))}" aria-label="${esc(r.display)}的报表项目名"></td><td><button class="btn sm" data-act="mechRuleSave" data-i="${i}">保存</button></td></tr>`)
    })}</div>
  </div>

`;

/* =====================================================================
   17. MOD-15 用户管理（§1.5 角色与权限）
   ===================================================================== */
V.m15=()=>{
  const on=USERS.filter(u=>u.status==='在用');
  const offN=USERS.filter(u=>u.status==='已停用').length;
  const delN=USERS.filter(u=>u.status==='已删除').length;
  const admins=USERS.filter(u=>u.role==='admin'&&u.status==='在用');
  const iAmAdmin=CUR.role==='admin';
  /* 防锁死：**最后一个「在用管理员」**不能停用 / 删除（其余账号随便动） */
  const lockAdmin=u=>u.role==='admin'&&u.status==='在用'&&admins.length<=1;
  return `
    
  <div class="card" style="margin-bottom:0"><h4>账号列表
    <span class="sp"><span class="mut sm">当前登录 <b>${esc(CUR.name)}</b>（${iAmAdmin?'管理员':'普通用户'}）· 在用 <b>${on.length}</b> · 停用 <b>${offN}</b> · 已删除 <b>${delN}</b></span>
    ${iAmAdmin?`<button class="btn" data-act="userTransfer">转让管理员</button>`:''}
    <button class="btn pri" data-act="userAdd" ${iAmAdmin?'':'disabled'} title="${iAmAdmin?'':'只有管理员可管理账号'}">＋ 新增账号</button>
    <button class="btn" data-act="logout">登出</button></span></h4>
    <div class="tw">${TBL({head:'<th>登录账号</th><th>姓名</th><th>角色</th><th>状态</th><th>最近登录</th><th>操作</th>',key:'m15:users',rows:[
    ...USERS.map(u=>`<tr class="${u.status==='在用'?'':'ex'}">
      <td class="fc">${esc(u.acc)}</td>
      <td>${esc(u.name)}${u.id===CUR.id?' <span class="mut sm">（当前登录）</span>':''}</td>
      <td>${u.role==='admin'?tag('管理员','vi'):tag('普通用户','in')}</td>
      <td>${u.status==='在用'?tag('在用','ok'):u.status==='已停用'?tag('已停用','wn'):tag('已删除','dg')}</td>
      <td class="now sm mut">${u.last?esc(u.last):'<span class="mut">从未登录</span>'}</td>
      <td class="ctr now">${u.status==='已删除'
        ? `<button class="btn sm" data-act="userRestore" data-id="${u.id}" ${iAmAdmin?'':'disabled'} title="恢复该账号；只有管理员能管理账号（不是管理员时置灰）">恢复</button>`
        : `<button class="btn sm" data-act="userPwd" data-id="${u.id}" ${(iAmAdmin||u.id===CUR.id)?'':'disabled'} title="${u.id===CUR.id?'改我自己的密码（⛔ 不用找管理员）':'改别人的密码要管理员（你自己的密码在你自己那一行点「改密」）'}">改密</button><button class="btn sm" data-act="userPwdView" data-id="${u.id}" ${iAmAdmin?'':'disabled'} title="查看明文密码（§1.5.1 明文裁定的显式出口）">看密码</button>
           <button class="btn sm" data-act="userToggle" data-id="${u.id}" ${(iAmAdmin&&!(u.status==='在用'&&lockAdmin(u)))?'':'disabled'} title="${lockAdmin(u)?'不能停用最后一个管理员':''}">${u.status==='在用'?'停用':'启用'}</button>
           ${u.id===CUR.id?'':`<button class="btn sm dg" data-act="userDel" data-id="${u.id}" ${(iAmAdmin&&!lockAdmin(u))?'':'disabled'} title="${lockAdmin(u)?'不能删除最后一个管理员':''}">删除</button>`}`}</td>
    </tr>`)]})}</div>
    
  </div>`;
};

</script>

  <script src="/static/shell/base.js"></script>
  <script src="/static/shell/view.js"></script>
  <script src="/static/shell/ui.js"></script>
  <script src="/static/shell/proj.js"></script>
  <script src="/static/shell/pages-a.js"></script>
  <script src="/static/shell/pages-b.js"></script>
  <script src="/static/shell/actions.js"></script>
  <!-- ⭐ `§19`「四个暂留件收口」（2026-09-21）：设置 ＋ 三个历史导入 —— **接线层加件**（原型切片一行不动）。
       ⚠️⚠️ **顺序有严格要求**，写错就是"整支脚本崩掉、页面一片空白"（实测踩到）：
         ① 必须在 `actions.js` **之后** —— 本件要往 `ACT` 上追加；
         ② 必须在 `core.js` **之前** —— `core.js` 的 `LOADERS` 表**在加载期**就要求值到 `reloadSet` 那几个函数
            （它们住在本件里）；⛔ 放在 `core.js` 之后 ⇒ `reloadSet is not defined` ⇒ `core.js` 整支中止。 -->
  <script src="/static/shell/legacy.js"></script>
  <script src="/static/shell/api.js"></script>
  <script src="/static/shell/core.js"></script>
  <script src="/static/shell/print-export.js"></script>

  <!-- 静态加载的必要前置：actions → legacy（追加 ACT）；view / legacy → core
       （捕获 render / 求值 reloadSet、reloadImp）。pages-a 的加工先登记，core 再追加。
       所有外链须在 boot 前到齐；API 是运行期依赖，不要求在 core 求值前出现。
       不建动态加载器或运行守卫：当前没有动态扩展需求，正常启动由真机核验。 -->
  <script>boot();</script>
</body>
