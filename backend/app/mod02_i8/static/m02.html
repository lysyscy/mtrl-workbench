<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>i8 抓取任务</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
  .wrap { max-width:1080px; margin:0 auto; padding:18px 20px 40px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  nav a { color:var(--pri); text-decoration:none; margin-right:10px; font-size:13px; }
  .card { background:var(--sf); border:1px solid var(--bd); border-radius:8px; padding:14px 16px; margin-bottom:14px; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .spacer { flex:1; }
  button { border:1px solid var(--bd); background:var(--sf); color:var(--tx); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; }
  button:hover { border-color:var(--pri); color:var(--pri); }
  button.primary { background:var(--pri); border-color:var(--pri); color:var(--sf); }
  button.primary:hover { background:var(--pri-d); color:var(--sf); }
  button.ghost { background:transparent; }
  input { border:1px solid var(--bd); border-radius:6px; padding:6px 10px; font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--bd); font-size:13px; }
  th { color:var(--mut); font-weight:500; background:var(--sf2); }
  .hint { color:var(--mut); font-size:12px; }
  .msg { margin-top:8px; font-size:13px; }
  .msg.err { color:var(--dg); } .msg.ok { color:var(--ok); } .msg.warn { color:var(--wn); }
  .tag { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; }
  .tag.ok { background:var(--ok-l); color:var(--ok); } .tag.bad { background:var(--dg-l); color:var(--dg); }
  .tag.warn { background:var(--wn-l); color:var(--wn); }
  code { background:var(--sf3); padding:1px 5px; border-radius:4px; font-size:12px; }
  .kpi { display:flex; gap:18px; margin-top:6px; }
  .kpi div { font-size:13px; } .kpi b { font-size:18px; }
  .empty { color:var(--mut); text-align:center; padding:20px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>i8 抓取任务</h1>
    <nav><a href="/m01">项目档案</a><a href="/m02">抓取任务</a><a href="/m03">付款通知书打印</a></nav>
  </header>

  <div class="card">
    <div class="row">
      <span>核算年月</span>
      <input id="ym" placeholder="2026-08" style="width:130px;" />
      <button id="btnPlan" class="primary">换算预览</button>
      <span class="hint">⚠️ 抓取**只允许单月**（业务上就是一次一个月）。</span>
    </div>
    <div id="planMsg" class="msg"></div>
  </div>

  <div class="card">
    <div class="row">
      <strong>付款通知书抓取</strong>
      <span class="hint">抓取为**人工触发**；登录会挤掉该账号在其他电脑的在线会话（强踢）。</span>
      <span class="spacer"></span>
      <button id="btnPreview">预览命中</button>
      <button id="btnRun" class="primary">开始抓取</button>
    </div>
    <div id="previewMsg" class="msg"></div>
    <div id="kpi" class="kpi"></div>
    <div id="runMsg" class="msg"></div>
  </div>

  <div class="card">
    <div class="row">
      <strong>基础名单同步</strong>
      <span class="hint">建档的数据底座（仓库名 ↔ 全名 / phid）。</span>
      <span class="spacer"></span>
      <button id="btnSyncWh">同步仓库名单</button>
      <button id="btnSyncCp">同步常用项目列表</button>
    </div>
    <div id="syncMsg" class="msg"></div>
  </div>

  <div class="card">
    <div class="row"><strong>最近执行记录</strong><span class="spacer"></span>
      <button id="btnReloadRec" class="ghost">刷新</button></div>
    <div class="hint">供看板提示「本月尚未抓取」「最近一次抓取失败」。</div>
    <table style="margin-top:8px;">
      <thead><tr><th style="width:60px;">类型</th><th>对象</th><th style="width:80px;">结果</th>
        <th style="width:110px;">成功/失败</th><th>失败原因</th><th style="width:150px;">时间</th></tr></thead>
      <tbody id="recBody"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opts||{}));
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.message || data.detail || ("HTTP "+r.status));
  return data;
}
const setMsg = (id, text, cls) => { const e=$(id); e.textContent=text; e.className = "msg " + (cls||""); };
const REQ_MONTH = /^\d{4}-\d{2}$/;

$("btnPlan").addEventListener("click", async ()=>{
  const ym = $("ym").value.trim();
  if(!REQ_MONTH.test(ym)) return setMsg("planMsg", "请填写形如 2026-08 的核算年月（只支持单月）。", "err");
  try{
    const d = await api(`/api/m02/fetch/plan?year_month=${encodeURIComponent(ym)}`);
    setMsg("planMsg", `${d.echo}　｜　该调用点可用模式：${d.capabilities.join(" / ")}`, "ok");
  }catch(e){ setMsg("planMsg", "换算失败：" + e.message, "err"); }
});

$("btnPreview").addEventListener("click", async ()=>{
  const ym = $("ym").value.trim();
  if(!REQ_MONTH.test(ym)) return setMsg("previewMsg", "请先填核算年月（形如 2026-08）。", "err");
  setMsg("previewMsg", "正在读取…", "");
  try{
    const d = await api("/api/m02/fetch/preview", {method:"POST", body:JSON.stringify({year_month:ym, allow_kick:false})});
    if(d.degraded){
      setMsg("previewMsg", d.message, "warn");
      $("kpi").innerHTML = "";
    } else {
      setMsg("previewMsg", d.echo, "ok");
      $("kpi").innerHTML = `<div>命中合计 <b>${d.total}</b></div><div>有效 <b>${d.valid}</b></div><div>剔除 <b>${d.excluded}</b></div>`;
    }
  }catch(e){ setMsg("previewMsg", "预览失败：" + e.message, "err"); }
});

$("btnRun").addEventListener("click", async ()=>{
  const ym = $("ym").value.trim();
  if(!REQ_MONTH.test(ym)) return setMsg("runMsg", "请先填核算年月（形如 2026-08）。", "err");
  if(!window.confirm("⚠️ 抓取会使用 i8 账号登录，可能挤掉该账号在其他电脑上的在线会话（强踢）。\n\n是否继续？")) return;
  setMsg("runMsg", "正在抓取…", "");
  try{
    const d = await api("/api/m02/fetch/run", {method:"POST", body:JSON.stringify({year_month:ym, allow_kick:false})});
    if(d.degraded) setMsg("runMsg", d.message, "warn");
    else setMsg("runMsg", `抓取完成：解析 ${d.fetched} 条。`, "ok");
    loadRecords();
  }catch(e){ setMsg("runMsg", "抓取失败：" + e.message, "err"); }
});

async function sync(path, label){
  // ⭐ D9：同步也要登录 i8 ⇒ **先问强踢**（不确认则不踢；若该账号已在线会失败并给出说明）
  const kick = window.confirm(
    `同步${label}会使用 i8 账号登录，可能挤掉该账号在其他电脑上的在线会话（强踢）。\n\n` +
    `【确定】= 允许强踢并继续\n【取消】= 不强踢（若该账号已在线，则会失败并给出说明）`);
  setMsg("syncMsg", `正在同步${label}…`, "");
  try{
    const d = await api(path + (kick ? "?allow_kick=true" : ""), {method:"POST"});
    if(d.degraded){
      setMsg("syncMsg", `${label}失败（已留痕）：${d.message}`, "warn");
    } else {
      // ⭐ 待处理项**全部逐条列出**。原先只印 `sample[0]` 的裸 JSON ⇒ 等于静默：
      //    本轮实测「兰考金不换前置车间项目」正是这样看不到的（它排在第 2 条以后）。
      //    口径 = 链路 A：「要人定的**显式列出**、不静默跳过」（`ACC-PRJ-SYNC-001/001-06`）。
      const pending = d.sample || [];
      const head = d.message || `${label}完成：${d.count} 条。`;
      const lines = pending.map(s=>{
        const extra = s.reason || (s.warehouses ? "仓库：" + s.warehouses.join("、") : "");
        return `⚠️ 待处理：${esc(s.name_full)}${extra ? " —— " + esc(extra) : ""}`;
      });
      $("syncMsg").innerHTML = esc(head) + lines.map(t=>"<br>" + t).join("");
      $("syncMsg").className = "msg " + (pending.length ? "warn" : "ok");
    }
    loadRecords();
  }catch(e){ setMsg("syncMsg", `${label}失败：${e.message}`, "err"); }
}
$("btnSyncWh").addEventListener("click", ()=>sync("/api/m02/sync/warehouses", "仓库名单"));
$("btnSyncCp").addEventListener("click", ()=>sync("/api/m02/sync/common-projects", "常用项目列表"));

async function loadRecords(){
  try{
    const rows = await api("/api/m02/fetch/records?limit=20");
    $("recBody").innerHTML = rows.length ? rows.map(r=>{
      const tag = r.status==="success" ? '<span class="tag ok">成功</span>'
                : r.status==="failed" ? '<span class="tag bad">失败</span>'
                : r.status==="partial" ? '<span class="tag warn">部分</span>' : esc(r.status);
      return `<tr><td>${esc(r.run_type)}</td><td>${esc(r.target)}</td><td>${tag}</td>
        <td>${r.success_count}/${r.fail_count}</td><td>${esc(r.error_message)}</td>
        <td>${esc(r.started_at)}</td></tr>`;
    }).join("") : '<tr><td colspan="6" class="empty">暂无执行记录。</td></tr>';
  }catch(e){ $("recBody").innerHTML = `<tr><td colspan="6" class="empty">加载失败：${esc(e.message)}</td></tr>`; }
}
$("btnReloadRec").addEventListener("click", loadRecords);
loadRecords();
</script>
</body>
</html>
