[pytest]
testpaths = tests
pythonpath = .
junit_family = xunit2
addopts = -q -p tests.acc_plugin
markers =
    acc: 验收用例 —— 必须成对声明「用例号 + 判据点号」（见 PRD/验收/README.md §三）
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    # starlette 新版对 httpx 的 TestClient 提示（与本工程无关的库内噪音）
    ignore:Using `httpx` with `starlette.testclient`:UserWarning
